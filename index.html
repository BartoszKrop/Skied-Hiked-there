 Francés – etapy"},{"n":"Etap 5: Puente la Reina → Estella","d":"łatwa","t":"6 h","o":"Pofałdowany teren i średniowieczne wioski, m.in. Cirauqui z uliczkami wspiętymi na wzgórze. Estella ma romańskie zabytki.","s":"Camino Francés – etapy"},{"n":"Etap 6: Estella → Los Arcos","d":"łatwa","t":"6 h","o":"Mijasz winiarnię Irache z fontanną wina dla pielgrzymów (w godzinach otwarcia). Dalej suchy, widokowy odcinek do Los Arcos.","s":"Camino Francés – etapy"},{"n":"Etap 7: Los Arcos → Logroño","d":"łatwa","t":"7 h","o":"Przez Vianę i dalej do La Rioja, pożegnanie z Nawarrą. Logroño ma słynną ulicę tapas, calle Laurel.","s":"Camino Francés – etapy"},{"n":"Etap 8: Logroño → Nájera","d":"łatwa","t":"7 h","o":"Przez winnice La Rioja i park nad zbiornikiem Pantano de la Grajera. Czerwona ziemia i długie, otwarte odcinki.","s":"Camino Francés – etapy"},{"n":"Etap 9: Nájera → Santo Domingo de la Calzada","d":"łatwa","t":"5–6 h","o":"Zielone pola i winnice. W Santo Domingo w katedrze zobaczysz kurę i koguta, bohaterów popularnej legendy pielgrzymów.","s":"Camino Francés – etapy"},{"n":"Etap 10: Santo Domingo → Belorado","d":"łatwa","t":"5 h","o":"Spokojny odcinek przez rolnicze, płaskie tereny, w trakcie którego przekraczasz granicę La Rioja i Kastylii-León.","s":"Camino Francés – etapy"},{"n":"Etap 11: Belorado → San Juan de Ortega","d":"średnia","t":"6 h","o":"Wejście w leśne wzgórza Montes de Oca. Przy małym klasztorze San Juan de Ortega kończy się leśny, dość odludny odcinek.","s":"Camino Francés – etapy"},{"n":"Etap 12: San Juan de Ortega → Burgos","d":"średnia","t":"6–7 h","o":"Trasa przechodzi blisko Atapuerca, stanowiska archeologicznego UNESCO, a potem długo prowadzi do Burgos z gotycką katedrą.","s":"Camino Francés – etapy"},{"n":"Etap 13: Burgos → Hornillos del Camino","d":"łatwa","t":"6 h","o":"Początek Mesety, wysokiego płaskowyżu o szerokich horyzontach. Mało cienia, więc ważne są woda i nakrycie głowy.","s":"Camino Francés – etapy"},{"n":"Etap 14: Hornillos → Castrojeriz","d":"łatwa","t":"5–6 h","o":"Przez Hontanas, wioskę ukrytą w zagłębieniu, i ruiny klasztoru San Antón. W Castrojeriz czeka pod górę zamek.","s":"Camino Francés – etapy"},{"n":"Etap 15: Castrojeriz → Frómista","d":"łatwa","t":"6 h","o":"Podejście na Alto de Mostelares, potem płaska droga przez pola. Frómista ma romański kościół San Martín.","s":"Camino Francés – etapy"},{"n":"Etap 16: Frómista → Carrión de los Condes","d":"łatwa","t":"6 h","o":"Długa, prosta trasa przez płaskie pola. Warto wybrać wariant przez Villalcázar de Sirga, z templariuszowskim kościołem.","s":"Camino Francés – etapy"},{"n":"Etap 17: Carrión → Terradillos de los Templarios","d":"łatwa","t":"6–7 h","o":"Pierwsze ok. 17 km po wyjściu z Carrión nie ma wsi, więc zabierz wodę i jedzenie. Po drodze Calzadilla de la Cueza.","s":"Camino Francés – etapy"},{"n":"Etap 18: Terradillos → Bercianos del Real Camino","d":"łatwa","t":"7 h","o":"Dalej przez płaską Mesetę. Sahagún, które mijasz, uchodzi za miasto leżące mniej więcej w połowie Camino Francés.","s":"Camino Francés – etapy"},{"n":"Etap 19: Bercianos → Mansilla de las Mulas","d":"łatwa","t":"7 h","o":"Długa, prosta droga przez pola i topolowe zagajniki. Mansilla de las Mulas zachowała fragmenty średniowiecznych murów.","s":"Camino Francés – etapy"},{"n":"Etap 20: Mansilla → León","d":"łatwa","t":"5–6 h","o":"Wejście do León z gotycką katedrą i słynnymi witrażami. Miasto warto zostawić na dzień odpoczynku.","s":"Camino Francés – etapy"},{"n":"Etap 21: León → San Martín del Camino","d":"średnia","t":"7 h","o":"Wyjście z León przez przedmieścia na wiejskie ścieżki. Można wybrać trasę przy drodze lub spokojniejszą, wiejską.","s":"Camino Francés – etapy"},{"n":"Etap 22: San Martín → Astorga","d":"łatwa","t":"6–7 h","o":"Mijasz Hospital de Órbigo z długim średniowiecznym mostem. W Astordze stoi Pałac Biskupi zaprojektowany przez Gaudíego.","s":"Camino Francés – etapy"},{"n":"Etap 23: Astorga → Foncebadón","d":"średnia","t":"6 h","o":"Początek podejścia w góry León, przez Rabanal del Camino do Foncebadón, odludnej wsi na wysokości ok. 1500 m.","s":"Camino Francés – etapy"},{"n":"Etap 24: Foncebadón → Ponferrada","d":"trudna","t":"6–7 h","o":"Cruz de Ferro (ok. 1500 m), przy którym pielgrzymi zostawiają kamień z domu, a potem strome zejście przez El Acebo i Molinaseca do Ponferrady z zamkiem templariuszy.","s":"Camino Francés – etapy"},{"n":"Etap 25: Ponferrada → Villafranca del Bierzo","d":"łatwa","t":"6–7 h","o":"Winnice regionu Bierzo i wioski. Villafranca del Bierzo ma kościół z Drzwiami Przebaczenia, które zastępowały pielgrzymom wejście do Santiago.","s":"Camino Francés – etapy"},{"n":"Etap 26: Villafranca → O Cebreiro","d":"trudna","t":"8 h","o":"Najtrudniejszy etap po Pirenejach: wspinaczka do Galicji (O Cebreiro ok. 1300 m) z widokami na góry. Są dwa warianty, przez Trabadelo i dłuższy, wysokościowy.","s":"Camino Francés – etapy"},{"n":"Etap 27: O Cebreiro → Triacastela","d":"średnia","t":"6 h","o":"Zejście i podejścia po wzgórzach Galicji. Zielona, często wilgotna kraina z kamiennymi wioskami.","s":"Camino Francés – etapy"},{"n":"Etap 28: Triacastela → Sarria","d":"łatwa","t":"5–6 h","o":"Do wyboru dwa warianty: przez klasztor Samos (dłuższy) lub krótszy przez San Xil. Sarria to początek ostatnich 100 km.","s":"Camino Francés – etapy"},{"n":"Etap 29: Sarria → Portomarín","d":"łatwa","t":"6–7 h","o":"Pierwszy etap ostatniej setki, więc w sezonie tłoczniej. Portomarín odbudowano nad zbiornikiem po zalaniu starego miasta.","s":"Camino Francés – etapy"},{"n":"Etap 30: Portomarín → Palas de Rei","d":"średnia","t":"6–7 h","o":"Początek z podejściem do Sierra de Ligonde, potem wiejskie drogi w cieniu eukaliptusów.","s":"Camino Francés – etapy"},{"n":"Etap 31: Palas de Rei → Arzúa","d":"średnia","t":"7 h","o":"Długi odcinek przez Melide, znane z pulpo gallego (ośmiornicy po galicyjsku), i Ribadiso z mostem. Arzúa słynie z serów.","s":"Camino Francés – etapy"},{"n":"Etap 32: Arzúa → O Pedrouzo","d":"łatwa","t":"6 h","o":"Przedostatni etap w eukaliptusowych lasach i na wiejskich ścieżkach. Do Santiago zostaje ok. 20 km.","s":"Camino Francés – etapy"},{"n":"Etap 33: O Pedrouzo → Santiago de Compostela","d":"łatwa","t":"5–6 h","o":"Przez Monte do Gozo z pierwszym widokiem na wieże katedry i dalej przez starówkę na plac Obradoiro, do katedry świętego Jakuba.","s":"Camino Francés – etapy"}],"ds":"Camino de Santiago to sieć pielgrzymich dróg prowadzących do katedry w Santiago de Compostela. Najpopularniejsze jest Camino Francés (ok. 780 km z St-Jean-Pied-de-Port), ale można iść też drogą portugalską, północną czy Via de la Plata. Do certyfikatu Compostela wystarczy przejść pieszo ostatnie 100 km. Sezon trwa od wiosny do jesieni, a noclegi są w tanich schroniskach pielgrzymich."},{"id":"h-reykjavik","n":"Reykjavík i okolice","c":"IS","r":"Stolica i półwysep Reykjanes","y":64.1466,"x":-21.9426,"hikes":[{"n":"Esja – Þverfellshorn","d":"średnia","t":"3–5 h","o":"Najpopularniejszy szlak w pobliżu stolicy, na ostatnim odcinku strome fragmenty z łańcuchem; widok na zatokę Faxaflói.","s":"Okolice stolicy"},{"n":"Helgafell (Hafnarfjörður)","d":"łatwa","t":"1,5–2 h","o":"Krótka wędrówka na wzgórze z widokiem na Hafnarfjörður i półwysep Reykjanes.","s":"Okolice stolicy"},{"n":"Úlfarsfell","d":"łatwa","t":"1–1,5 h","o":"Niski szczyt na obrzeżach Reykjavíku, z widokiem na miasto i zatokę. Idealny na krótką, popołudniową wycieczkę.","s":"Okolice stolicy"},{"n":"Fagradalsfjall – pola lawy","d":"średnia","t":"3–5 h","o":"Szlaki do miejsc niedawnych erupcji na Reykjanes; przed wyjściem sprawdź komunikaty o aktywności wulkanicznej.","s":"Okolice stolicy"}],"ds":"Stolica Islandii, otoczona wulkanicznymi wzgórzami i polami lawy. Kilka szlaków zaczyna się tuż za miastem i nadaje się na krótszy dzień."},{"id":"h-thingvellir","n":"Þingvellir i Złoty Krąg","c":"IS","r":"Złoty Krąg","y":64.2559,"x":-21.1299,"hikes":[{"n":"Almannagjá i Öxarárfoss","d":"łatwa","t":"1–1,5 h","o":"Spacer wąwozem na granicy płyt tektonicznych do wodospadu Öxarárfoss; park narodowy wpisany na listę UNESCO.","s":"Złoty Krąg","fm":["got"]},{"n":"Geysir – Haukadalur","d":"łatwa","t":"1–2 h","o":"Pole geotermalne ze Strokkurem, który wyrzuca wodę co kilka minut, i ścieżki po okolicznym wzgórzu.","s":"Złoty Krąg"}],"ds":"Park Narodowy Þingvellir na styku płyt tektonicznych Ameryki Północnej i Eurazji, dawne miejsce islandzkiego parlamentu. Wpisany na listę UNESCO, z wąwozami i jeziorem.","fl":{"got":"Orle Gniazdo"}},{"id":"h-reykjadalur","n":"Reykjadalur (gorąca rzeka)","c":"IS","r":"Hveragerði, południe","y":64.0206,"x":-21.2024,"hikes":[{"n":"Reykjadalur – kąpiel w gorącym potoku","d":"średnia","t":"3–4 h","o":"Ok. 3,5 km w jedną stronę przez pole geotermalne do ciepłego potoku, w którym można się wykąpać.","s":"Szlaki"},{"n":"Hengill – Skeggi","d":"średnia","t":"4–6 h","o":"Wędrówka przez obszar geotermalny z widokiem na dolinę Hveragerði. Parująca ziemia i kolorowe wzgórza.","s":"Szlaki"}],"ds":"Dolina niedaleko Hveragerði z gorącą rzeką, w której można się kąpać po marszu. Szlak prowadzi przez pole geotermalne."},{"id":"h-landmannalaugar","n":"Landmannalaugar","c":"IS","r":"Wyżyny, Fjallabak","y":63.985,"x":-19.06,"hikes":[{"n":"Laugavegur (Landmannalaugar → Þórsmörk)","d":"trudna","t":"4 dni","o":"Ok. 55 km, najsłynniejszy trekking Islandii: kolorowe ryolitowe góry, lodowce i pustynie wulkaniczne, schroniska co kilkanaście km; wymaga rezerwacji.","s":"Trekkingi"},{"n":"Laugahraun i Brennisteinsalda – pętla","d":"średnia","t":"2–3 h","o":"Przez pole lawy i kolorowe zbocza Brennisteinsalda z gorącymi źródłami.","s":"Szlaki dzienne"},{"n":"Bláhnúkur","d":"średnia","t":"2–3 h","o":"Podejście na „Niebieską Górę” z widokiem na barwne góry Landmannalaugar.","s":"Szlaki dzienne"}],"ds":"Wyżyna z różnokolorowymi riolitowymi górami i gorącymi źródłami, w środku Islandii. Początek szlaku Laugavegur."},{"id":"h-thorsmork","n":"Þórsmörk","c":"IS","r":"Południe, wyżyny","y":63.68,"x":-19.51,"hikes":[{"n":"Fimmvörðuháls (Skógar → Þórsmörk)","d":"trudna","t":"8–11 h","o":"Ok. 22–25 km przez przełęcz między lodowcami Eyjafjallajökull i Mýrdalsjökull, widać tereny erupcji z 2010 r.","s":"Trekkingi"},{"n":"Valahnúkur","d":"średnia","t":"1,5–2 h","o":"Szczyt nad doliną Þórsmörk, z widokiem na lodowce i rozlewiska rzek. Wejście krótkie, ale strome.","s":"Szlaki dzienne"},{"n":"Stakkholtsgjá","d":"łatwa","t":"1,5–2 h","o":"Wąwóz z potokiem prowadzący do zamkniętej, urwistej doliny. Trzeba przejść kilka razy przez wodę.","s":"Szlaki dzienne"}],"ds":"Dolina wśród lodowców Eyjafjallajökull i Mýrdalsjökull, osłonięta rzekami od świata. Dojazd tylko pojazdami terenowymi."},{"id":"h-skogar","n":"Skógar i Seljalandsfoss","c":"IS","r":"Południe","y":63.532,"x":-19.511,"hikes":[{"n":"Skógafoss – szlak wzdłuż rzeki Skógá","d":"łatwa","t":"2–3 h","o":"Dolina z kilkoma wodospadami powyżej Skógafoss; stąd zaczyna się Fimmvörðuháls.","s":"Wodospady","ct":"w"}],"ds":"Okolica wodospadów Skógafoss i Seljalandsfoss na południu Islandii. Stąd startuje Fimmvörðuháls."},{"id":"h-vik","n":"Vík, Dyrhólaey i Reynisfjara","c":"IS","r":"Południe","y":63.419,"x":-19.006,"hikes":[{"n":"Reynisfjara i Reynisdrangar","d":"łatwa","t":"1–1,5 h","o":"Czarna plaża z kolumnami bazaltu; fale są tu niebezpieczne, nie podchodź blisko wody.","s":"Wybrzeże"},{"n":"Dyrhólaey","d":"łatwa","t":"1–1,5 h","o":"Klify i widok na czarną plażę; część terenu bywa zamknięta w okresie lęgowym ptaków.","s":"Wybrzeże"},{"n":"Reynisfjall – grzbiet nad Vík","d":"średnia","t":"2–3 h","o":"Podejście na grzbiet z widokiem na Vík i skały Reynisdrangar. Pod ciemnymi klifami żyją maskonury.","s":"Wybrzeże"}],"ds":"Wioska na południowym wybrzeżu Islandii z czarną plażą Reynisfjara i skałami Reynisdrangar. W pobliżu przylądek Dyrhólaey."},{"id":"h-skaftafell","n":"Skaftafell (Vatnajökull)","c":"IS","r":"Park Narodowy Vatnajökull","y":64.016,"x":-16.966,"hikes":[{"n":"Skaftafellsjökull – czoło lodowca","d":"łatwa","t":"1–1,5 h","o":"Ścieżka do czoła lodowca wypływającego z Vatnajökull. Widać pasy popiołu wulkanicznego w lodzie.","s":"Szlaki","fm":["got","int"]},{"n":"Sjónarnípa i Svartifoss – pętla","d":"średnia","t":"3–4 h","o":"Pętla z punktem widokowym Sjónarnípa nad lodowcem i wodospadem Svartifoss, otoczonym bazaltowymi kolumnami. Najpopularniejsza trasa w Skaftafell.","s":"Szlaki"},{"n":"Kristínartindar","d":"trudna","t":"5–7 h","o":"Pętla po szczytach nad Skaftafell z widokiem na lodowce; wymaga dobrej pogody.","s":"Szlaki"}],"ds":"Część Parku Narodowego Vatnajökull z lodowcami, wodospadem Svartifoss i bazaltowymi kolumnami. Jeden z lepszych punktów wypadowych na południu Islandii.","fl":{"got":"Za Murem","int":"Lodowa planeta"}},{"id":"h-fjadrargljufur","n":"Fjaðrárgljúfur i Kirkjubæjarklaustur","c":"IS","r":"Południe","y":63.771,"x":-18.171,"hikes":[{"n":"Fjaðrárgljúfur – ścieżka nad kanionem","d":"łatwa","t":"1–1,5 h","o":"Głęboki, kręty kanion z rzeką; dostęp bywa czasowo ograniczany ze względu na ochronę przyrody.","s":"Szlaki","ct":"k"},{"n":"Systrafoss i Systravatn","d":"łatwa","t":"1–1,5 h","o":"Krótkie podejście nad Kirkjubæjarklaustur do wodospadu i jeziorka. Widok na wioskę i lawy.","s":"Szlaki","ct":"k"}],"ds":"Wąski kanion Fjaðrárgljúfur, długi na ok. 2 km i głęboki na ok. 100 m. W pobliżu Kirkjubæjarklaustur."},{"id":"h-myvatn","n":"Mývatn","c":"IS","r":"Północ","y":65.6,"x":-16.9,"hikes":[{"n":"Hverfjall","d":"łatwa","t":"1–1,5 h","o":"Szeroki krater wulkaniczny z widokiem na jezioro Mývatn i okolicę. Krawędź można obejść dookoła.","s":"Szlaki","ct":"j"},{"n":"Dimmuborgir","d":"łatwa","t":"1–2 h","o":"Pole lawowych formacji skalnych z kilkoma oznaczonymi pętlami. W islandzkim folklorze dom trolli.","s":"Szlaki","ct":"j","fm":["got"]},{"n":"Leirhnjúkur (Krafla)","d":"łatwa","t":"1–1,5 h","o":"Pole geotermalne z parującymi zboczami; trzymaj się oznaczonych ścieżek.","s":"Szlaki","ct":"j"}],"ds":"Jezioro na północy Islandii z polami lawy, kraterami i gorącymi źródłami. Akt ,"s":"Wybrzeże"},{"n":"Rauðasandur","d":"łatwa","t":"1–2 h","o":"Rozległa plaża o czerwonawym piasku nad zatoką. Odosobniona, z fokami.","s":"Wybrzeże"}],"ds":"Dzikie fiordy północno-zachodniej Islandii, z klifami Látrabjarg i rezerwatem Hornstrandir. Mało turystów."},{"id":"h-akureyri","n":"Akureyri i Goðafoss","c":"IS","r":"Północ","y":65.6835,"x":-18.1005,"hikes":[{"n":"Súlur","d":"średnia","t":"5–7 h","o":"Dwuwierzchołkowa góra nad Akureyri, popularna jednodniowa wędrówka. Widok na fiord.","s":"Szlaki"}],"ds":"Główne miasto północy Islandii, z fiordem Eyjafjörður i wodospadem Goðafoss w pobliżu. Szlaki zaczynają się niedaleko miasta."},{"id":"h-askja","n":"Askja i Víti","c":"IS","r":"Wyżyny, północny wschód","y":65.05,"x":-16.75,"hikes":[{"n":"Víti – krater z jeziorem","d":"łatwa","t":"1,5–2 h","o":"Z parkingu ok. 2,5 km do krateru geotermalnego; dojazd tylko autem 4×4 latem.","s":"Szlaki","ct":"j"},{"n":"Askja – Öskjuvatn","d":"średnia","t":"2–3 h","o":"Wokół głębokiego jeziora w kalderze, pole lawy i pustynny krajobraz. Obok jest gorące jezioro Víti.","s":"Szlaki"}],"ds":"Kaldera wulkaniczna w środku Islandii z jeziorem Öskjuvatn i kraterem Víti. Dostępna tylko latem i po trudnej drodze."},{"id":"h-lysefjord","n":"Lysefjord (Preikestolen, Kjerag)","c":"NO","r":"Rogaland","y":58.9863,"x":6.1903,"hikes":[{"n":"Preikestolen (Pulpit Rock)","d":"średnia","t":"3.5–4.5 h","o":"Najpopularniejszy szlak Norwegii: ok. 8 km w obie strony na płaską skałę 600 m nad fjordem.","s":"Klasyki","fm":["mi"]},{"n":"Hengjanefossen i Ørnaberget","d":"średnia","t":"2–3 h","o":"Krótsza alternatywa z widokiem na fjord, zwykle mniej zatłoczona niż Preikestolen.","s":"Klasyki","ct":"w"},{"n":"Kjerag i Kjeragbolten","d":"trudna","t":"6–8 h","o":"Wejście z łańcuchami na płaskowyż Kjerag, gdzie głaz Kjeragbolten tkwi zaklinowany nad przepaścią. Jedna z najbardziej fotografowanych atrakcji Norwegii.","s":"Klasyki"}],"ds":"Długi fiord w Rogalandzie z dwoma najsłynniejszymi punktami Norwegii: P i"}],"ds":"Park Narodowy Snowdonia w Walii z najwyższym szczytem Anglii i Walii, Snowdon (1085 m). Wiele grani i szlaków zrobionych dla piechurów."},{"id":"h-ben-nevis","n":"Ben Nevis i Glen Nevis","c":"GB","r":"Szkocja","y":56.7969,"x":-5.0036,"hikes":[{"n":"Ben Nevis – Mountain Track","d":"trudna","t":"7–9 h","o":"Najwyższa góra Wielkiej Brytanii (1345 m); ok. 17 km, pogoda zmienia się bardzo szybko.","s":"Klasyki"},{"n":"Steall Falls i Wire Bridge","d":"łatwa","t":"1.5–2 h","o":"Spacer wąwozem do wodospadu, z przeprawą po linowym moście. Wodospad jest widoczny z oddali.","s":"Klasyki","ct":"w","fm":["hp"]},{"n":"Carn Mor Dearg Arête","d":"trudna","t":"8–10 h","o":"Grań prowadząca do Ben Nevis, z widokiem na północną ścianę. Wymaga umiejętności scramblingu i dobrej pogody.","s":"Klasyki"},{"n":"Ben Nevis, trasa z Glen Nevis","d":"trudna","t":"7–9 h","o":"Najwyższy szczyt Wielkiej Brytanii (1345 m) przez ścieżkę Mountain Track. Pogoda szybko się zmienia, a na szczycie często jest mgła.","s":"Klasyki"}],"ds":"Najwyższy szczyt Wielkiej Brytanii (1345 m) nad Fort William. Szlaki od łagodnych spacerów w Glen Nevis po wymagające grzbiety.","fl":{"hp":"Turniej Trójmagiczny"}},{"id":"h-lake-district","n":"Lake District (Scafell Pike, Helvellyn)","c":"GB","r":"Cumbria","y":54.464,"x":-3.297,"hikes":[{"n":"Scafell Pike","d":"trudna","t":"5–7 h","o":"Najwyższy szczyt Anglii (978 m); typowe wejście z Wasdale Head lub Seathwaite.","s":"Klasyki"},{"n":"Helvellyn – Striding Edge","d":"trudna","t":"5–7 h","o":"Klasyczna grań z lekkim scramblingiem, jedna z najpopularniejszych tras Anglii.","s":"Klasyki"},{"n":"Catbells","d":"łatwa","t":"1.5–2 h","o":"Krótkie wejście z widokiem na Derwentwater. Jedno z ulubionych wzgórz Lake District.","s":"Klasyki"}],"ds":"Park Narodowy w północnej Anglii z jeziorami i wzgórzami, w tym Scafell Pike, najwyższym szczytem Anglii. Region literacki, z Wordsworthem."},{"id":"h-skye","n":"Skye (Old Man of Storr, Fairy Pools)","c":"GB","r":"Szkocja","y":57.5073,"x":-6.18,"hikes":[{"n":"Old Man of Storr","d":"średnia","t":"1.5–2 h","o":"Ok. 4 km do skalnej igły z widokiem na morze. Wzgórze z osuwiskami na Skye.","s":"Klasyki"},{"n":"Fairy Pools","d":"łatwa","t":"1–1.5 h","o":"Spacer wzdłuż potoku z kaskadami i krystalicznymi basenami pod Cuillinami.","s":"Klasyki"},{"n":"The Quiraing","d":"średnia","t":"2–3 h","o":"Pętla wśród osuwisk i skalnych iglic na północy Skye. Wiatr i widoki na morze.","s":"Klasyki"},{"n":"Neist Point","d":"łatwa","t":"1.5 h","o":"Spacer z klifami i latarnią na zachodnim końcu wyspy.","s":"Klasyki"},{"n":"Coire Lagan","d":"średnia","t":"3–4 h","o":"Wejście w głąb Cuillinów do jeziora wśród skał. Krótkie, ale z kamienistym podejściem.","s":"Klasyki"}],"ds":"Największa wyspa Hebrydów Wewnętrznych, z Cuillinami, formacjami Quiraing i Old Man of Storr. Klimat zmienny, widoki często zasłonięte mgłą."},{"id":"h-teide","n":"Teide (Teneryfa)","c":"ES","r":"Wyspy Kanaryjskie","y":28.2724,"x":-16.642,"hikes":[{"n":"Teide – Montaña Blanca","d":"trudna","t":"7–9 h","o":"Wejście na 3718 m od drogi TF-21; powyżej 3550 m jest odcinek, na który wymagane jest pozwolenie parku.","s":"Klasyki"},{"n":"Roques de García","d":"łatwa","t":"1–1.5 h","o":"Krótka pętla wśród formacji skalnych w Parque Nacional del Teide.","s":"Klasyki"},{"n":"Masca – wąwóz","d":"średnia","t":"3–4 h","o":"Zejście wąwozem do morza; powrót łodzią, trzeba zaplanować transport.","s":"Klasyki","ct":"k"}],"ds":"Park Narodowy Teide na Teneryfie (UNESCO) z Teide (3718 m), najwyższym szczytem Hiszpanii. Księżycowy krajobraz skał wulkanicznych jest tu głównym powodem wizyty. Na sam szczyt prowadzi kolejka linowa, ale wejście na wierzchołek wymaga wcześniejszego pozwolenia."},{"id":"h-tramuntana","n":"Mallorca (Serra de Tramuntana)","c":"ES","r":"Baleary","y":39.853,"x":2.795,"hikes":[{"n":"Torrent de Pareis (Sa Calobra)","d":"trudna","t":"5–7 h","o":"Wąwóz do plaży Sa Calobra; trasa przez rzekę i skalne bloki, tylko w suchej pogodzie.","s":"Klasyki"},{"n":"Cala Tuent – Sa Calobra","d":"średnia","t":"2–3 h","o":"Nadmorski fragment Tramuntany z wąskimi ścieżkami między dwiema zatokami. Najlepiej wiosną i jesienią, bo latem jest bez cienia i bardzo gorąco.","s":"Klasyki"},{"n":"Puig de Galatzó","d":"średnia","t":"3–4 h","o":"Szczyt (ok. 1026 m) na zachód od Palmy, z szeroką panoramą Tramuntany i morza. Trasa pnie się przez las i skały, a ostatni odcinek bywa stromy.","s":"Klasyki"}],"ds":"Serra de Tramuntana na Majorce to wapienne góry wzdłuż zachodniego wybrzeża (UNESCO), do 1445 m n.p.m. Przez nie biegnie długi szlak GR 221, a nad morzem są wąskie ścieżki i klify. Najlepsze miesiące to wiosna i jesień, w lecie jest bardzo gorąco."},{"id":"h-montserrat","n":"Montserrat","c":"ES","r":"Katalonia","y":41.5933,"x":1.8112,"hikes":[{"n":"Sant Jeroni","d":"średnia","t":"2.5–3.5 h","o":"Najwyższy punkt masywu Montserrat (1236 m), z klasztoru Montserrat ścieżką przez formacje skalne.","s":"Klasyki","ct":"k"}],"ds":"Montserrat to poszarpany masyw skalny pod Barceloną, z benedyktyńskim klasztorem na zboczu. Szczyt Sant Jeroni ma 1236 m i można dojechać tu pociągiem z Barcelony w niecałą godzinę. Dobre na pół dnia lub cały dzień pieszy z widokiem na Pireneje przy dobrej pogodzie."},{"id":"h-aiguestortes","n":"Aigüestortes i Estany de Sant Maurici","c":"ES","r":"Pireneje Katalońskie","y":42.58,"x":1.001,"hikes":[{"n":"Estany de Sant Maurici i Mirador","d":"łatwa","t":"1–1.5 h","o":"Łatwy spacer wokół jeziora Sant Maurici z widokiem na skalne wieże Els Encantats. Dobry na krótką wizytę w parku.","s":"Klasyki"},{"n":"Ratera – Amitges – Colomers","d":"trudna","t":"6–8 h","o":"Dłuższa trasa wysokogórska przez kilka jezior, w sezonie letnim.","s":"Klasyki"}],"ds":"Aigüestortes i Estany de Sant Maurici to jedyny park narodowy Katalonii, z kilkuset jeziorami i skalnymi iglicami Els Encantats. Dojazd na teren parku z wiosek Espot i Boí zapewniają miejscowe taksówki terenowe. Najlepszy czas na trasy to lato i początek jesieni."},{"id":"h-caminito","n":"Caminito del Rey (Málaga)","c":"ES","r":"Andaluzja","y":36.915,"x":-4.76,"hikes":[{"n":"Caminito del Rey","d":"łatwa","t":"3–4 h","o":"Ok. 8 km kładek wiszących nad wąwozem El Chorro; wejście tylko z biletem i rezerwacją.","s":"Klasyki","ct":"k"}],"ds":"Caminito del Rey to wąska ścieżka na pomostach przytwierdzonych do ścian wąwozu El Chorro, ok. 100 m nad rzeką. Wstęp wymaga wcześniejszej rezerwacji, a kask jest obowiązkowy. Trasa liczy ok. 8 km w jedną stronę i bywa zamykana przy złej pogodzie."},{"id":"h-madeira","n":"Madera","c":"PT","r":"Madera","y":32.75,"x":-16.95,"hikes":[{"n":"Pico do Arieiro – Pico Ruivo","d":"trudna","t":"5–7 h","o":"Najsłynniejsza trasa Madery: tunele i strome stopnie między dwoma najwyższymi szczytami wyspy.","s":"Klasyki"},{"n":"Levada das 25 Fontes (Rabaçal)","d":"średnia","t":"3–4 h","o":"Wzdłuż lewady do wodospadu z 25 źródłami i Lagoa das Vinte e Cinco Fontes.","s":"Klasyki"},{"n":"Levada do Caldeirão Verde","d":"średnia","t":"4–5 h","o":"Zielona dolina z tunelami i wodospadem na końcu, latarka obowiązkowa.","s":"Klasyki"},{"n":"Pico Ruivo od Achada do Teixeira","d":"średnia","t":"3–4 h","o":"Łatwiejsze wejście na najwyższy szczyt Madery, ok. 6 km w obie strony.","s":"Klasyki"},{"n":"Vereda da Ponta de São Lourenço (PR8)","d":"średnia","t":"2–3 h","o":"Skalisty półwysep na wschodnim krańcu wyspy, odsłonięte klify i punkty widokowe.","s":"Klasyki"},{"n":"Levada dos Piornais","d":"średnia","t":"2–3 h","o":"Lewada nad Funchal z widokami na miasto i ocean. Łatwa, bez stromych podejść, w cieniu lasu.","s":"Klasyki"},{"n":"Monte – Curral das Freiras","d":"średnia","t":"3–4 h","o":"Szlak do wioski w kotle wulkanicznym, nazywanej Doliną Zakonnic. Ścieżki są wąskie, a zejścia strome. Z wioski można wrócić autobusem.","s":"Klasyki"},{"n":"Las Fanal (Laurisilva)","d":"łatwa","t":"1–2 h","o":"Płaskowyż Fanal ze starymi drzewami laurowymi (UNESCO), które we mgle wyglądają jak z baśni. Do krótkiego spaceru wystarczy godzina.","s":"Klasyki"},{"n":"Basseny lawowe Porto Moniz","d":"łatwa","t":"1–2 h","o":"Naturalne baseny w skałach wulkanicznych na północnym wybrzeżu.","s":"Klasyki","ct":"k"}],"ds":"Madera to wyspa o lasach laurowych (UNESCO) i lewadach, czyli dawnych kanałach nawadniających z wąskimi ścieżkami wzdłuż wody. Pico Ruivo (1862 m) to najwyższy szczyt. Szlaki bywają zamykane po pożarach i osuwiskach, więc sprawdzaj komunikaty."},{"id":"h-azory","n":"Azory (São Miguel)","c":"PT","r":"Azory","y":37.842,"x":-25.787,"hikes":[{"n":"Sete Cidades – Vista do Rei i jeziora","d":"średnia","t":"3–4 h","o":"Pętla wokół kalder z jeziorami Lagoa Azul i Lagoa Verde, z punktem widokowym Vista do Rei. Mgła potrafi zasłonić widok, więc zostaw zapas dnia.","s":"Klasyki","ct":"j"},{"n":"Lagoa do Fogo","d":"średnia","t":"3–4 h","o":"Zejście do jeziora w kalderze wulkanu Fogo, powrót tą samą trasą pod górę. Latem można się kąpać na plaży nad jeziorem.","s":"Klasyki"},{"n":"Sete Cidades – Miradouro da Vista do Rei","d":"łatwa","t":"1–2 h","o":"Punkt widokowy nad kraterowymi jeziorami Zielonym i Niebieskim na São Miguel.","s":"Klasyki"},{"n":"Pico (2351 m)","d":"trudna","t":"6–8 h","o":"Najwyższy szczyt Portugalii na wyspie Pico, wejście z przewodnikiem lub GPS.","s":"Klasyki"},{"n":"Caldeira Faial","d":"łatwa","t":"2–3 h","o":"Spacer po krawędzi krateru Caldeira na wyspie Faial, z zielonym wnętrzem i jeziorkiem na dnie. Widoki szybko się zmieniają wraz z mgłą.","s":"Klasyki"}],"ds":"São Miguel to największa wyspa Azorów, z kalderami Sete Cidades, Fogo i Furnas. Jeziora w kraterach, gorące źródła i zielone wzgórza są na wyciągnięcie ręki. Pogoda zmienia się szybko, a mgła często zasłania widoki."},{"id":"h-carezza","n":"Lago di Carezza i Latemar","c":"IT","r":"Dolomity","y":46.41,"x":11.574,"hikes":[{"n":"Latemar – Rifugio Torre di Pisa","d":"średnia","t":"4–5 h","o":"Wędrówka w stronę skalnych iglic Latemaru, schronisko leży wśród strzelistych wież. Mniej tłoczna niż Tre Cime, z widokiem na Rosengarten.","s":"Klasyki"},{"n":"Catinaccio – Rifugio Vajolet","d":"średnia","t":"5–6 h","o":"Wejście pod Torri del Vajolet w masywie Catinaccio (Rosengarten), jedna z klasyków Dolomitów. Widok na trzy wieże i skaliste ściany, szczególnie wieczorem, gdy skały płoną czerwienią (enrosadira).","s":"Klasyki"}],"ds":"Jezioro Carezza (Karersee) pod masywem Latemar, o zmieniającym kolor odbiciu gór. Okolica ma też szlaki po Latemarze."},{"id":"h-marmolada","n":"Marmolada i Passo Fedaia","c":"IT","r":"Dolomity","y":46.46,"x":11.87,"hikes":[{"n":"Lago Fedaia – Rifugio Pian dei Fiacconi","d":"średnia","t":"3–4 h","o":"Szlak od jeziora Fedaia pod lodowiec Marmolady, z widokiem na jej północną ścianę. Pozostałości lodowca pokazują, jak szybko się topi.","s":"Klasyki"},{"n":"Viel del Pan","d":"łatwa","t":"2–3 h","o":"Spokojna wędrówka grzbietem z panoramą Marmolady. Dawniej szlak wojskowy, dziś łatwa trasa dla rodzin.","s":"Klasyki"}],"ds":"Królowa Dolomitów (3343 m), najwyższy masyw regionu, z lodowcem na północnej ścianie. Okolica Passo Fedaia ma szlaki do schronisk i jezior."},{"id":"h-como","n":"Jezioro Como (Menaggio, Varenna)","c":"IT","r":"Lombardia","y":46.019,"x":9.237,"hikes":[{"n":"Monte Grona","d":"trudna","t":"5–6 h","o":"Strome wejście nad jezioro Como, z panoramą od Alp po Lombardię. Zaczyna się od Menaggio.","s":"Klasyki","ct":"j"},{"n":"Sentiero del Viandante","d":"średnia","t":"5–6 h","o":"Stary szlak wzdłuż wschodniego brzegu jeziora, odcinek Lecco – Varenna. Przez małe wioski nad wodą.","s":"Klasyki","ct":"j"},{"n":"Villa del Balbianello (Lenno)","d":"łatwa","t":"1.5 h","o":"Spacer wzdłuż brzegu z Lenno do willi, w której kręcono ślub Anakina i Padmé w Ataku klonów. Willa stoi na cyplu nad jeziorem Como.","s":"Klasyki","fm":["sw"]}],"ds":"Jezioro Como w Lombardii, w kształcie litery Y, otoczone górami wznoszącymi się prosto z wody. Szlaki prowadzą nad brzegiem i na szczyty z widokiem na Alpy.","fl":{"sw":"Naboo (jezioro)"}},{"id":"h-gran-paradiso","n":"Gran Paradiso (Cogne)","c":"IT","r":"Dolina Aosty","y":45.607,"x":7.356,"hikes":[{"n":"Lillaz – Cascate","d":"łatwa","t":"1–1.5 h","o":"Spacer do wodospadów w Lillaz, dobre na pół dnia. W okolicy jest też podejście do Valnontey.","s":"Klasyki"},{"n":"Rifugio Vittorio Sella","d":"średnia","t":"3–4 h","o":"Wędrówka przez Valnontey do schroniska w sercu parku narodowego. Często widać koziorożce.","s":"Klasyki"},{"n":"Alta Via 2 – etap Cogne","d":"trudna","t":"8–10 h","o":"Etap Alta Via 2 w Aosta, wysokogórska trasa, wymaga doświadczenia i dobrej pogody. Widoki na Gran Paradiso.","s":"Klasyki"}],"ds":"Najstarszy park narodowy Włoch, z kozicami alpejskimi i szczytem Gran Paradiso (4061 m). Wioska Cogne to punkt startu do dolin Valnontey i Lillaz."},{"id":"h-amalfi","n":"Wybrzeże Amalfitańskie","c":"IT","r":"Kampania","y":40.628,"x":14.519,"hikes":[{"n":"Sentiero degli Dei","d":"średnia","t":"3–4 h","o":"Ok. 7 km szlak wysoko nad Amalfi i Positano, z widokiem na Capri. Najlepszy rano, bez upału.","s":"Klasyki"},{"n":"Valle delle Ferriere","d":"średnia","t":"3–4 h","o":"Zielony wąwóz z wodospadami nad Amalfi, rezerwat z rzadkimi paprociami. Chłodniej niż na wybrzeżu.","s":"Klasyki"}],"ds":"Wybrzeże na południu Włoch z klifami i miasteczkami przyklejonymi do zboczy. Szlaki wiodą wysoko nad morzem, z widokiem na Capri."},{"id":"h-etna","n":"Etna (Sycylia)","c":"IT","r":"Sycylia","y":37.751,"x":14.993,"hikes":[{"n":"Etna – kratery szczytowe","d":"trudna","t":"7–9 h","o":"Wejście z górnej stacji kolejki pod krater; powyżej 2900 m tylko z przewodnikiem.","s":"Klasyki"},{"n":"Crateri Silvestri","d":"łatwa","t":"1–1.5 h","o":"Krótka pętla wokół wygasłych kraterów na wysokości ok. 1900 m, na Etnie. Dobrze zobaczyć czarną lawę.","s":"Klasyki"}],"ds":"Najwyższy czynny wulkan Europy (ok. 3300 m), na Sycylii. Łatwe trasy wokół kraterów bocznych i wyprawy z przewodnikiem do głównych kraterów."},{"id":"h-sardynia","n":"Sardynia (Baunei, Gola Su Gorropu)","c":"IT","r":"Sardynia","y":40.09,"x":9.67,"hikes":[{"n":"Cala Goloritzé","d":"średnia","t":"2–3 h","o":"Szlak ok. 3.5 km do plaży z naturalnym łukiem skalnym; limit wejść w sezonie.","s":"Klasyki"},{"n":"Gola Su Gorropu","d":"średnia","t":"4–6 h","o":"Wąwóz uznawany za jeden z najgłębszych w Europie, w Sardynii. Wejście do środka wymaga ubrania i butów.","s":"Klasyki"}],"ds":"Wschodnia Sardynia z kanionami i wapiennymi klifami nad morzem. Wąwóz Gorropu i szlak Selvaggio Blu to jedne z najbardziej wymagających tras wyspy."},{"id":"h-garda","n":"Jezioro Garda (Monte Baldo)","c":"IT","r":"Wenecja Euganejska","y":45.764,"x":10.81,"hikes":[{"n":"Monte Baldo – Cima Valdritta","d":"średnia","t":"3–4 h","o":"Szlak ze stacji górnej kolejki z Malcesine na szczyt; widok na całe jezioro.","s":"Klasyki","ct":"j"},{"n":"Busatte – Tempesta","d":"łatwa","t":"2–3 h","o":"Ścieżka tuż nad brzegiem jeziora Garda, częściowo po ścianie. Widoki na jezioro i góry.","s":"Klasyki","ct":"j"}],"ds":"Największe jezioro Włoch, otoczone górami Monte Baldo na wschodzie. Można wejść pieszo lub wjechać kolejką linową z Malcesine."},{"id":"h-cervinia","n":"Breuil-Cervinia (Cervino)","c":"IT","r":"Dolina Aosty","y":45.939,"x":7.631,"hikes":[{"n":"Lago Goillet","d":"łatwa","t":"1–1.5 h","o":"Spacer do jeziora z widokiem na Matterhorn od strony włoskiej. Dobry na pół dnia.","s":"Klasyki"},{"n":"Rifugio Duca degli Abruzzi","d":"średnia","t":"4–5 h","o":"Wędrówka pod Matterhornem do schroniska, jedna z klasycznych tras okolicy. Widać ścianę Cervino.","s":"Klasyki"}],"ds":"Wieś u stóp Matterhornu po włoskiej stronie, jako Cervino, na wysokości ok. 2000 m. Trasy do jezior i schronisk z widokiem na ścianę góry."},{"id":"h-krimml","n":"Krimml (Wodospady Krimmler)","c":"AT","r":"Salzburg","y":47.211,"x":12.18,"hikes":[{"n":"Krimmler Wasserfälle","d":"łatwa","t":"1.5–2.5 h","o":"Trzypoziomowa kaskada o wysokości ok. 380 m, jedna z największych w Europie.","s":"Klasyki","ct":"w"},{"n":"Krimmler Achental – Krimmler Tauernhaus","d":"łatwa","t":"2–3 h","o":"Spokojna dolina nad wodospadami Krimml, odpowiednia dla rodzin. Dalej idzie się do schroniska.","s":"Klasyki","ct":"w"}],"ds":"Wodospady Krimml mają ok. 380 m w trzech kaskadach i należą do najwyższych w Europie. Dalej idą doliny w Parku Narodowym Hohe Tauern."},{"id":"h-innsbruck","n":"Innsbruck (Nordkette)","c":"AT","r":"Tyrol","y":47.311,"x":11.384,"hikes":[{"n":"Hafelekar – Gleirschjöchl","d":"średnia","t":"3–4 h","o":"Grzbiet nad Innsbruckiem z widokiem na miasto i Karwendel. Start przy górnej stacji kolejki Nordkette.","s":"Klasyki"},{"n":"Goetheweg – Patscherkofel","d":"łatwa","t":"2–3 h","o":"Panoramiczny spacer z górnej stacji kolejki Patscherkofel. Nazwany od Goethego.","s":"Klasyki"}],"ds":"Stolica Tyrolu, z górami Nordkette tuż nad miastem. Kolejka linowa z centrum wywozi na wysokość ponad 2000 m w kilkanaście minut."},{"id":"h-stubai","n":"Stubaital (Neustift)","c":"AT","r":"Tyrol","y":47.109,"x":11.315,"hikes":[{"n":"Elferhütte","d":"łatwa","t":"2–3 h","o":"Z Neustift na schronisko z widokiem na Stubaital. Łatwa trasa.","s":"Klasyki"},{"n":"Stubaier Höhenweg – etapy","d":"trudna","t":"1–2 dni","o":"Wysokogórska trasa wokół doliny; schroniska i pełne wyposażenie. Cała pętla trwa kilka dni.","s":"Klasyki"}],"ds":"Dolina na południe od Innsbrucka, z lodowcem Stubai i długim szlakiem Stubaier Höhenweg. Schroniska leżą dość blisko siebie."},{"id":"h-schladming","n":"Schladming i Dachstein","c":"AT","r":"Styria","y":47.393,"x":13.689,"hikes":[{"n":"Planai – Hochwurzen","d":"średnia","t":"4–5 h","o":"Grzbietem z górnej stacji Planai nad Schladming. Widać Dachstein.","s":"Klasyki"},{"n":"Seewigtal – wodospad Riesachfall","d":"łatwa","t":"1.5–2.5 h","o":"Wodospad Riesachfall, najwyższy w Styrii (ok. 140 m), w dolinie Seewigtal. Przy końcu doliny jest jezioro.","s":"Klasyki","ct":"w"},{"n":"Dachstein – Hunerkogel","d":"średnia","t":"3–4 h","o":"Z kolejki Dachstein Gletscherbahn na krawędź lodowca. Wysokość ponad 2700 m.","s":"Klasyki"}],"ds":"Miasto narciarskie w Styrii, u stóp masywu Dachstein. Latem szlaki prowadzą przez doliny jezior Schladminger Tauern."},{"id":"h-zell-kaprun","n":"Zell am See i Kaprun","c":"AT","r":"Salzburg","y":47.325,"x":12.797,"hikes":[{"n":"Schmittenhöhe – Pinzgauer Spaziergang","d":"łatwa","t":"3–4 h","o":"Widokowy szlak grzbietowy od Schmittenhöhe w stronę Saalbach. Widać Zell am See i Hohe Tauern.","s":"Klasyki"},{"n":"Kitzsteinhorn – Kaprun","d":"łatwa","t":"2–3 h","o":"Panorama Hohe Tauern z platformy przy lodowcu Kitzsteinhorn. Można wjechać kolejką.","s":"Klasyki"},{"n":"Kaprun – Mooserboden","d":"średnia","t":"3–4 h","o":"Dolina z zaporami i widokiem na lodowce Hohe Tauern. Zapory są ważnym obiektem inżynierskim.","s":"Klasyki"},{"n":"Imbachhorn","d":"trudna","t":"6–7 h","o":"Długie, strome wejście nad Zell am See z widokiem na Kitzsteinhorn i Wysokie Taury.","s":"Klasyki"}],"ds":"Zell am See nad jeziorem i Kaprun pod lodowcem Kitzsteinhorn w Parku Hohe Tauern. Widoki na Alpy z kolejek i szlaków."},{"id":"h-achensee","n":"Achensee (Pertisau)","c":"AT","r":"Tyrol","y":47.455,"x":11.73,"hikes":[{"n":"Seekarspitze","d":"średnia","t":"4–5 h","o":"Wejście nad Achensee, największe jezioro Tyrolu, z widokiem na Karwendel. Trasa jest średnio trudna.","s":"Klasyki","ct":"j"},{"n":"Gaisalm i Pertisau","d":"łatwa","t":"2–3 h","o":"Wędrówka przez las nad jeziorem do schroniska Gaisalm. Dobra dla rodzin.","s":"Klasyki","ct":"j"}],"ds":"Największe jezioro Tyrolu, zwane tirolskim fiordem, otoczone Karwendel i Rofan. Ma kilka tras widokowych i szlak na szczyty."},{"id":"h-schafberg","n":"Wolfgangsee (Schafberg)","c":"AT","r":"Salzkammergut","y":47.765,"x":13.437,"hikes":[{"n":"Schafberg","d":"średnia","t":"3–4 h","o":"Szczyt nad Wolfgangsee z zabytkowa kolejką zębatą; można wejść piechotą.","s":"Klasyki"},{"n":"Falkensteinwand","d":"łatwa","t":"1.5–2 h","o":"Ścieżka nad jeziorem Wolfgangsee z widokiem na St. Gilgen. Prowadzi przez klif.","s":"Klasyki"}],"ds":"Szczyt Schafberg nad jeziorem Wolfgangsee, z koleją zębatą z St. Wolfgang. Widoki na Salzkammergut i kilka jezior."},{"id":"h-wilder-kaiser","n":"Wilder Kaiser (Ellmau)","c":"AT","r":"Tyrol","y":47.52,"x":12.29,"hikes":[{"n":"Stripsenjoch","d":"trudna","t":"5–6 h","o":"Wejście na przełęcz wśród skalnych ścian Kaisergebirge. Schronisko Stripsenjochhaus na górze.","s":"Klasyki"},{"n":"Adlerweg (całość)","d":"trudna","t":"3–4 tygodnie","o":"Szlak Orła przez cały Tyrol, 24 etapy, dobrze oznaczony i z noclegami w schroniskach.","s":"Klasyki"}],"ds":"Masyw Wilder Kaiser, skalny mur nad Tyrolem, z wapiennymi turniami do 2300 m. Znany ze szlaków po schroniskach i ferrat."},{"id":"h-oberstdorf","n":"Oberstdorf (Allgäu)","c":"DE","r":"Bawaria","y":47.409,"x":10.279,"hikes":[{"n":"Heilbronner Weg","d":"trudna","t":"10–12 h","o":"Klasyczna wysokogórska pętla z ubezpieczeniami; w dobrej pogodzie i z wyposażeniem.","s":"Klasyki"},{"n":"Nebelhorn – Hindelanger Klettersteig","d":"trudna","t":"4–6 h","o":"Via ferrata z widokiem na Allgäu, tylko z kaskiem i uprzężą.","s":"Klasyki"},{"n":"Breitachklamm","d":"łatwa","t":"1–1.5 h","o":"Wąwóz do 150 m głębokości, trasa ok. 2,5 km pomostami nad rwącą rzeką. Wstęp jest płatny. Zimą można zobaczyć zamarznięty wodospad.","s":"Klasyki"},{"n":"Mädelegabel","d":"trudna","t":"8–10 h","o":"Wysokogórski szczyt (2645 m) w Alpach Algawskich, z odcinkami ubezpieczonymi łańcuchami i drabinkami. Wymaga doświadczenia i dobrej pogody.","s":"Klasyki"}],"ds":"Oberstdorf w Allgäu to najdalej na południe położone miasto Niemiec. Stąd idzie się do Breitachklamm, wąwozu, i na szczyty Alp Algawskich, w tym dłuższe trasy ze schroniskami. Dobre na tydzień wędrówek z łatwymi i trudnymi trasami."},{"id":"h-fussen","n":"Füssen (Neuschwanstein)","c":"DE","r":"Bawaria","y":47.5576,"x":10.7498,"hikes":[{"n":"Tegelberg – Ammergauer Alpen","d":"średnia","t":"4–5 h","o":"Wejście lub wjazd kolejką na Tegelberg (1720 m) z widokiem na zamki Neuschwanstein i Hohenschwangau oraz jezioro Forggensee. Z góry startują paralotniarze.","s":"Klasyki"}],"ds":"Füssen to baza do zamków Neuschwanstein i Hohenschwangau. Stąd wchodzi się lub wjeżdża kolejką na Tegelberg (1720 m), z którego startują paralotniarze. Dobra na krótką wizytę połączoną ze zwiedzaniem."},{"id":"h-sachsische-schweiz","n":"Szwajcaria Saksońska (Bastei)","c":"DE","r":"Saksonia","y":50.96,"x":14.073,"hikes":[{"n":"Bastei i Schwedenlöcher","d":"łatwa","t":"2–3 h","o":"Platforma widokowa Bastei i kamienny most na wysokości ok. 190 m nad Łabą, a potem wąwóz Schwedenlöcher z drabinami. W sezonie bywa tłoczno.","s":"Klasyki","ct":"k"},{"n":"Malerweg – etapy","d":"średnia","t":"1–2 dni","o":"Wielodniowy szlak wśród formacji piaskowca w parku narodowym.","s":"Klasyki","ct":"k"}],"ds":"Park Narodowy Szwajcaria Saksońska to piaskowcowe skały nad Łabą, z platformą Bastei i rozbudowaną siecią łatwych szlaków. Znany jest również szlak Malerweg. Najlepiej wcześnie rano, bo w sezonie jest tłoczno."},{"id":"h-brocken","n":"Harz (Brocken)","c":"DE","r":"Saksonia-Anhalt","y":51.7677,"x":10.667,"hikes":[{"n":"Brocken z Schierke","d":"średnia","t":"3–4 h","o":"Pętla przez lasy i skały do szczytu Brocken (1141 m), często we mgle. Na szczycie jest wiatr i widok na Harz. Można wrócić parową kolejką Brockenbahn.","s":"Klasyki"},{"n":"Ilsetal i Ilsenburg","d":"łatwa","t":"3–4 h","o":"Spokojny szlak doliną rzeki Ilse z kaskadami i skałami, z Ilsenburga w stronę Brocken. Łatwy i popularny, bez stromych odcinków.","s":"Klasyki"}],"ds":"Brocken (1141 m) to najwyższy szczyt Harzu, często owiany mgłą i znany z niemieckich legend o czarownicach. Na szczyt jeździ parowa kolejka Brockenbahn. Trasy są łatwe i dobre przez cały rok."},{"id":"h-walchensee","n":"Walchensee (Herzogstand)","c":"DE","r":"Bawaria","y":47.617,"x":11.333,"hikes":[{"n":"Herzogstand – Heimgarten","d":"średnia","t":"5–6 h","o":"Grzbiet z widokiem na jeziora Walchensee i Kochelsee. Wąski fragment między Herzogstand a Heimgarten wymaga pewnego kroku i ostrożności.","s":"Klasyki","ct":"j"},{"n":"Walchensee dookoła","d":"średnia","t":"5–6 h","o":"Ścieżka dookoła jeziora, częściowo szlakiem, częściowo szutrem, więc można ją pokonać rowerem. Latem dobre miejsce na kąpiel.","s":"Klasyki","ct":"j"}],"ds":"Walchensee to jedno z największych i najgłębszych jezior Alp w Niemczech, o turkusowej wodzie. Nad nim wznoszą się Herzogstand (1731 m) i Heimgarten, a w okolicy jest jezioro Kochelsee. Dobre na lato i na jesień."},{"id":"h-annecy","n":"Annecy i Semnoz","c":"FR","r":"Górna Sabaudia","y":45.8992,"x":6.1294,"hikes":[{"n":"La Tournette","d":"trudna","t":"6–7 h","o":"Najwyższy szczyt nad jeziorem Annecy (2351 m), z końcowym odcinkiem po skałach.","s":"Klasyki","ct":"j"},{"n":"Semnoz – Crêt de Châtillon","d":"łatwa","t":"2–3 h","o":"Grzbiet Semnoz z najwyższym punktem Crêt de Châtillon (ok. 1700 m), nad Annecy. Widać stąd jezioro i, przy dobrej pogodzie, Mont Blanc.","s":"Klasyki","ct":"j"},{"n":"Roc de Chère","d":"łatwa","t":"1.5–2 h","o":"Rezerwat na wschodnim brzegu jeziora Annecy, z drewnianymi pomostami i skałami nad wodą. Krótka trasa, którą dobrze łączyć z kąpielą w jeziorze.","s":"Klasyki","ct":"j"}],"ds":"Annecy leży nad jednym z najczystszych jezior Alp. Okoliczne wzgórza, w tym grzbiet Semnoz, dają widoki na jezioro i Mont Blanc, a po trasach można się kąpać w jeziorze. Dobre na lato i wczesną jesień."},{"id":"h-sixt","n":"Sixt-Fer-à-Cheval","c":"FR","r":"Górna Sabaudia","y":46.072,"x":6.769,"hikes":[{"n":"Cirque du Fer à Cheval","d":"łatwa","t":"1–1.5 h","o":"Spacer z parkingu pod ściany amfiteatru o wysokości do kilkuset metrów, z licznymi wodospadami. Po deszczu i w czerwcu jest najbardziej efektowny.","s":"Klasyki","ct":"w"},{"n":"Lac de Anterne","d":"średnia","t":"5–6 h","o":"Wysokogórskie jezioro pod Aiguilles Rouges, dostępne od strony Sixt przez Col d'Anterne. Trasa wymaga kondycji, ale nagradza widokiem na Mont Blanc.","s":"Klasyki","ct":"w"}],"ds":"Sixt-Fer-à-Cheval to cichszy zakątek Górnej Sabaudii, z rezerwatem i amfiteatrem Cirque du Fer à Cheval o ścianach do kilkuset metrów. Wodospady i spokojne doliny kontrastują z tłocznym Chamonix. Dobrze rozpocząć tu dzień przed południem."},{"id":"h-vanoise","n":"Pralognan (Vanoise)","c":"FR","r":"Sabaudia","y":45.383,"x":6.722,"hikes":[{"n":"Lac des Vaches","d":"średnia","t":"3–4 h","o":"Trasa z okolic Pralognan do jeziora w Parku Narodowym Vanoise, wśród łąk, gdzie łatwo spotkać koziorożce i świstaki. Dobra na pół dnia.","s":"Klasyki"},{"n":"Refuge de la Valette","d":"średnia","t":"4–5 h","o":"Wejście do schroniska pod lodowcem w Vanoise, typowa górska trasa parku narodowego. Latem warto rezerwować nocleg, jeśli chcesz zostać na noc.","s":"Klasyki"}],"ds":"Pralognan-la-Vanoise to baza do Parku Narodowego Vanoise, pierwszego francuskiego parku narodowego (1963). Lodowce, wysokogórskie jeziora i koziorożce są głównymi atrakcjami. Szlak GR 55 przechodzi przez serce parku."},{"id":"h-la-grave","n":"La Grave (Écrins)","c":"FR","r":"Alpy Delfinackie","y":45.045,"x":6.304,"hikes":[{"n":"Lac du Pontet","d":"łatwa","t":"1.5–2 h","o":"Z La Grave do jeziora Pontet z widokiem na lodowce La Meije. Łatwa i popularna wśród rodzin, a okolica jest spokojniejsza niż w Chamonix.","s":"Klasyki"},{"n":"Refuge de l'Alpe de Villar d'Arêne","d":"średnia","t":"3–4 h","o":"Droga doliną w stronę masywu Écrins, z widokami na lodowce La Meije. Dobra na dzień w sercu parku bez skomplikowanych podejść.","s":"Klasyki"}],"ds":"La Grave leży u stóp La Meije (3984 m) w Parku Narodowym Écrins. To mało komercyjna wioska z surowym krajobrazem, bez wielkiej infrastruktury turystycznej, ale z doskonałymi widokami na lodowce. Najlepsza dla osób, które lubią spokój."},{"id":"h-calanques","n":"Calanques (Marsylia, Cassis)","c":"FR","r":"Prowansja","y":43.214,"x":5.538,"hikes":[{"n":"Calanque d'En-Vau","d":"średnia","t":"3–4 h","o":"Zatoka z turkusową wodą; w sezonie dostęp ograniczony przez zagrożenie pożarowe i rezerwacje.","s":"Klasyki","ct":"k"},{"n":"Calanque de Sugiton","d":"średnia","t":"2–3 h","o":"Szlak z Luminy do skalnych zatok, widok na Morze Śródziemne.","s":"Klasyki","ct":"k"}],"ds":"Park Narodowy Calanques między Marsylią i Cassis to wapienne klify opadające do turkusowych zatok. Latem, przy ryzyku pożarowym, dostęp do niektórych szlaków bywa ograniczony lub zakazany, więc przed wyjściem sprawdź komunikaty. Najlepszy czas to wiosna i jesień."},{"id":"h-korsyka","n":"Korsyka (GR20, Calenzana)","c":"FR","r":"Korsyka","y":42.509,"x":8.859,"hikes":[{"n":"GR20 – etap Calenzana – Ortu di u Piobbu","d":"trudna","t":"6–8 h","o":"Pierwszy etap słynnego szlaku GR20; wymagający i bardzo widokowy.","s":"Klasyki"},{"n":"Lac de Melo i Lac de Capitello","d":"średnia","t":"4–5 h","o":"Klasyk Korsyki: pętla z parkingu Grotelle w dolinie Restonica nad dwa polodowcowe jeziora. Ścieżka pnie się skalnymi stopniami, a ostatni odcinek do Capitello jest najbardziej stromy.","s":"Klasyki"},{"n":"Calanche de Piana","d":"łatwa","t":"1.5–2 h","o":"Czerwone formacje skalne nad zatoką, spacer przez Chalet Mare a Mare.","s":"Klasyki"}],"ds":"GR20 na Korsyce to jeden z najtrudniejszych długich szlaków Europy, ok. 180 km z Calenzany na północy do Conca na południu. Trasa jest kamienista i stroma, a sezon trwa od czerwca do września. Można przejść tylko wybrane odcinki, np. wokół Monte Cinto (2706 m)."},{"id":"h-ventoux","n":"Mont Ventoux","c":"FR","r":"Prowansja","y":44.174,"x":5.278,"hikes":[{"n":"Mont Ventoux z Bédoin","d":"trudna","t":"6–8 h","o":"Wejście pieszo na ikoniczną górę znaną z Tour de France, bez cienia na szlaku.","s":"Klasyki"},{"n":"Gorges de la Nesque","d":"łatwa","t":"2–3 h","o":"Długi wąwóz u podnóża Mont Ventoux z punktem widokowym Belvédère du Castelleras. Trasa łatwa, ale latem bardzo gorąca i mało zacieniona.","s":"Klasyki"}],"ds":"Mont Ventoux (1912 m) to wapienny olbrzym Prowansji, znany z etapów Tour de France. Szczyt jest łysy i wystawiony na silny wiatr mistral, więc pogoda bywa bardziej surowa niż w dolinach. Widoki sięgają Alp i Morza Śródziemnego."},{"id":"h-verdon","n":"Gorges du Verdon","c":"FR","r":"Prowansja","y":43.76,"x":6.343,"hikes":[{"n":"Sentier Blanc-Martel","d":"trudna","t":"6–8 h","o":"Klasyczna trasa przez wąwóz, z tunelami; latarka obowiązkowa.","s":"Klasyki","ct":"k"},{"n":"Sentier de l'Imbut","d":"trudna","t":"2–3 h","o":"Wymagająca trasa w wąwozie Verdon, z drabinami i półkami skalnymi, kończąca się w miejscu, gdzie rzeka znika między głazami (Imbut). Wymaga dobrej orientacji i kondycji.","s":"Klasyki","ct":"k"}],"ds":"Gorges du Verdon to najgłębszy wąwóz Francji, z turkusową rzeką i pionowymi ścianami do ok. 700 m. Szlaki biegną na samym dnie lub półkami na krawędzi, a sezon trwa od kwietnia do października. Latem jest tłoczno i bardzo ciepło."},{"id":"h-plitvice","n":"Jeziora Plitwickie","c":"HR","r":"Lika","y":44.8654,"x":15.582,"hikes":[{"n":"Plitvice – trasa Gornja Jezera (Szlak K)","d":"łatwa","t":"4–6 h","o":"Najpopularniejsza trasa przez kaskady i jeziora wpisane na listę UNESCO; łódź i autobus w cenie biletu.","s":"Klasyki","ct":"j"},{"n":"Plitvice – trasa H","d":"łatwa","t":"5–7 h","o":"Długa pętla po Górnych i Dolnych Jeziorach.","s":"Klasyki","ct":"j"}]},{"id":"h-paklenica","n":"Paklenica","c":"HR","r":"Dalmacja","y":44.3,"x":15.466,"hikes":[{"n":"Velika Paklenica – Anića Luk","d":"łatwa","t":"2–3 h","o":"Wąwóz z pionowymi ścianami, popularny wśród wspinaczy.","s":"Klasyki"},{"n":"Vidakov kuk","d":"trudna","t":"5–7 h","o":"Wejście na punkt widokowy z panoramą wybrzeża i wysp.","s":"Klasyki"}]},{"id":"h-durmitor","n":"Durmitor (Žabljak)","c":"ME","r":"Czarnogóra","y":43.1544,"x":19.1226,"hikes":[{"n":"Bobotov Kuk","d":"trudna","t":"7–9 h","o":"Najwyższy szczyt Durmitoru (2523 m) z widokiem na Kanion Tary.","s":"Klasyki"},{"n":"Crno Jezero (Czarne Jezioro)","d":"łatwa","t":"1–1.5 h","o":"Spacer wokół jeziora u stóp Meded.","s":"Klasyki","ct":"j"},{"n":"Savin Kuk","d":"średnia","t":"4–5 h","o":"Szlak widokowy nad Žabljakiem; z kolejką krzesełkową łatwiej.","s":"Klasyki"}]},{"id":"h-rila","n":"Rila (Siedem Jezior, Musała)","c":"BG","r":"Rila","y":42.2008,"x":23.322,"hikes":[{"n":"Siedem Jezior Rylskich","d":"łatwa","t":"4–6 h","o":"Pętla wśród polodowcowych jezior, możliwy dojazd wyciągiem z Panichishte.","s":"Klasyki","ct":"j"},{"n":"Musała (2925 m)","d":"średnia","t":"5–7 h","o":"Najwyższy szczyt Bałkanów, wejście z Borowca przez gondolę lub pieszo.","s":"Klasyki"}]},{"id":"h-pirin","n":"Pirin (Bansko, Wichren)","c":"BG","r":"Pirin","y":41.765,"x":23.41,"hikes":[{"n":"Wichren (2914 m)","d":"trudna","t":"6–8 h","o":"Z chaty Wichren na szczyt Pirinu; ekspozycja i skały.","s":"Klasyki"},{"n":"Banderishki Chukar i jeziora","d":"średnia","t":"5–7 h","o":"Pętla przez jeziora Banderiszkie.","s":"Klasyki","ct":"j"}]},{"id":"h-bucegi","n":"Bucegi (Sinaia, Bușteni)","c":"RO","r":"Karpaty Południowe","y":45.416,"x":25.537,"hikes":[{"n":"Sfinx i Babele","d":"łatwa","t":"2–3 h","o":"Skalne formacje na płaskowyżu Bucegi; można dojechać kolejką z Bușteni.","s":"Klasyki"},{"n":"Vârful Omu (2505 m)","d":"trudna","t":"7–9 h","o":"Wejście na najwyższy punkt Bucegi z górskim schroniskiem.","s":"Klasyki"},{"n":"Cascada Urlătoarea","d":"łatwa","t":"1–1.5 h","o":"Wodospad nad Bușteni.","s":"Klasyki"}]},{"id":"h-piatra-craiului","n":"Piatra Craiului (Zărnești)","c":"RO","r":"Karpaty Południowe","y":45.56,"x":25.29,"hikes":[{"n":"La Om – Grind","d":"trudna","t":"6–8 h","o":"Wapienna grań nad Zărnești; ekspozycja i skały.","s":"Klasyki"},{"n":"Prăpăstiile Zărneștilor","d":"łatwa","t":"1.5–2 h","o":"Wąwóz z potokiem, dobry na pół dnia.","s":"Klasyki"}]},{"id":"h-fagaras","n":"Fogarasze (Bâlea, Moldoveanu)","c":"RO","r":"Karpaty Południowe","y":45.603,"x":24.617,"hikes":[{"n":"Lacul Bâlea – Vârful Negoiu","d":"trudna","t":"8–10 h","o":"Wysokogórska wędrówka nad jeziorem Bâlea (Transfogaraska).","s":"Klasyki"},{"n":"Moldoveanu (2544 m)","d":"trudna","t":"1–2 dni","o":"Najwyższy szczyt Rumunii; dłuższa trasa z biwakiem lub schroniskiem.","s":"Klasyki"}]},{"id":"h-retezat","n":"Retezat (Gura Zlata)","c":"RO","r":"Karpaty Południowe","y":45.36,"x":22.84,"hikes":[{"n":"Lacul Bucura","d":"średnia","t":"6–7 h","o":"Największe jezioro polodowcowe Karpat Południowych.","s":"Klasyki"},{"n":"Vârful Peleaga","d":"trudna","t":"7–9 h","o":"Najwyższy szczyt Retezatu (2509 m).","s":"Klasyki"}]},{"id":"h-krynica","n":"Krynica (Beskid Sądecki)","c":"PL","r":"Małopolska","y":49.421,"x":20.959,"hikes":[{"n":"Jaworzyna Krynicka (1114 m)","d":"łatwa","t":"2–3 h","o":"Najwyższy punkt Beskidu Sądeckiego z widokiem na całą okolicę, można wjechać kolejką.","s":"Klasyki"}],"ds":"Uzdrowisko w Beskidzie Sądeckim z Jaworzyną Krynicką (1114 m), dostępną kolejką gondolową. Spokojne szlaki wśród lasów, dużo punktów widokowych."},{"id":"h-lackowa","n":"Beskid Niski (Lackowa, Magura Wątkowska)","c":"PL","r":"Małopolska","y":49.454,"x":21.087,"hikes":[{"n":"Lackowa (997 m)","d":"średnia","t":"3–4 h","o":"Szczyt Korony Gór Polski w Beskidzie Niskim, z widokiem na Beskidy i Słowację. Łagodny i cichy, z lasem bukowym.","s":"Klasyki"},{"n":"Magura Wątkowska – Wołowiec","d":"łatwa","t":"2–3 h","o":"Szlak przez łagodne grzbiety Beskidu Niskiego, z drewnianymi cerkwiami po drodze. Spokojny, dla początkujących.","s":"Klasyki"}],"ds":"Dwa szczyty Beskidu Niskiego: Lackowa (997 m) i Magura Wątkowska. Dzikie, mało uczęszczane trasy z cmentarzami z I wojny światowej na szlaku."},{"id":"h-izery","n":"Góry Izerskie (Świeradów-Zdrój)","c":"PL","r":"Dolny Śląsk","y":50.904,"x":15.343,"hikes":[{"n":"Stóg Izerski (1107 m)","d":"średnia","t":"3–4 h","o":"Szczyt Gór Izerskich z widokiem na Karkonosze.","s":"Klasyki"},{"n":"Wysoka Kopa (1126 m)","d":"średnia","t":"3–4 h","o":"Najwyższy szczyt polskiej części Gór Izerskich.","s":"Klasyki"},{"n":"Jakuszyce – Orle (wokół torfowisk)","d":"łatwa","t":"3–4 h","o":"Spokojny szlak przez Hale Izerskie i torfowiska.","s":"Klasyki"}],"ds":"Góry Izerskie ze Świeradowem-Zdrojem, Stogiem Izerskim i torfowiskami. Dobra baza do łatwych wycieczek, w pobliżu kolejka gondolowa na Stóg."},{"id":"h-sowie","n":"Góry Sowie (Wielka Sowa)","c":"PL","r":"Dolny Śląsk","y":50.682,"x":16.488,"hikes":[{"n":"Wielka Sowa (1015 m)","d":"średnia","t":"3–4 h","o":"Najwyższy szczyt Gór Sowich z wieżą widokową.","s":"Klasyki"},{"n":"Zamek Grodno i Zagórze Śląskie","d":"łatwa","t":"2–3 h","o":"Spacer nad jeziorem Bystrzyckim do zamku Grodno.","s":"Klasyki"}],"ds":"Góry Sowie z Wielką Sową (1015 m) i wieżą widokową. Niewysokie pasmo z łagodnymi szlakami i podziemiami Osówki w okolicy."},{"id":"h-walbrzych","n":"Wałbrzych (Chełmiec, Książ)","c":"PL","r":"Dolny Śląsk","y":50.758,"x":16.284,"hikes":[{"n":"Chełmiec (851 m)","d":"łatwa","t":"2–3 h","o":"Szczyt Korony Gór Polski nad Wałbrzychem z wieżą widokową.","s":"Klasyki"},{"n":"Zamek Książ – Pełcznica","d":"łatwa","t":"2–3 h","o":"Zespół zamkowy z tarasami i spacerem przez Książański Park Krajobrazowy.","s":"Klasyki"}],"ds":"Wałbrzych z Chełmcem i zamkiem Książ, jednym z największych zamków w Polsce. Krótkie trasy połączone ze zwiedzaniem."},{"id":"h-hrensko","n":"Hřensko (Czeska Szwajcaria)","c":"CZ","r":"Kraj Ujście","y":50.873,"x":14.226,"hikes":[{"n":"Pravčická brána","d":"łatwa","t":"2–3 h","o":"Największy naturalny most skalny w Europie; trasa z Hřenska przez Edmundovu soutěskę.","s":"Klasyki","ct":"k","fm":["nar"]},{"n":"Divoká soutěska i Edmundova soutěska","d":"łatwa","t":"2–3 h","o":"Wąwozy z łodziami i pomostami w Parku Narodowym Czeska Szwajcaria.","s":"Klasyki","ct":"k"}],"fl":{"nar":"Pravčická brána"}},{"id":"h-jeseniky","n":"Jeseníky (Praděd)","c":"CZ","r":"Morawy","y":50.083,"x":17.231,"hikes":[{"n":"Praděd z Ovčárny","d":"średnia","t":"3–4 h","o":"Najwyższy szczyt Moraw (1491 m) z wieżą widokową.","s":"Klasyki"},{"n":"Petrovy kameny","d":"łatwa","t":"2–3 h","o":"Formacje skalne z szerokim widokiem, popularne na krótki wypad.","s":"Klasyki"}]},{"id":"h-adrspach","n":"Adršpach (Skalne Miasto)","c":"CZ","r":"Kraj Hradecki","y":50.61,"x":16.113,"hikes":[{"n":"Adršpašské skály","d":"łatwa","t":"2–3 h","o":"Labirynt piaskowcowych wież, w tym wodospad i jezioro.","s":"Klasyki","ct":"k","fm":["nar"]},{"n":"Teplické skály","d":"łatwa","t":"2–3 h","o":"Skalne miasto z wieżą widokową i ścieżką wśród głazów.","s":"Klasyki","ct":"k"}],"fl":{"nar":"Las Narnii"}},{"id":"h-slovensky-raj","n":"Słowacki Raj (Podlesok)","c":"SK","r":"Preszów","y":48.934,"x":20.379,"hikes":[{"n":"Suchá Belá","d":"średnia","t":"3–4 h","o":"Wąwóz z drabinami i kładkami, jedna z najlepszych tras Słowacji.","s":"Klasyki"},{"n":"Piecky – Kyseľ","d":"średnia","t":"3–4 h","o":"Wąwóz z drabinami, prawie przez cały czas w wodzie i skałach.","s":"Klasyki"},{"n":"Tomášovský výhľad","d":"łatwa","t":"1.5–2 h","o":"Skalny taras nad doliną Hornádu, jedna z najpiękniejszych panoram Słowackiego Raju. Z Podlesoka dojście zajmuje 1,5–2 h. Spokojna, krótka trasa, ale pod koniec jest stromo.","s":"Klasyki"}],"ds":"Słowacki Raj to park narodowy z wąwozami, wodospadami i drabinami przymocowanymi do skał. Trasy w wąwozach, np. Suchá Belá i Piecky, mają łańcuchy i drabiny, a część biegnie w jedną stronę. Podlesok jest jedną z głównych baz. Najlepsze na wiosnę i jesień, bo w wąwozach bywa mokro."},{"id":"h-nizke-tatry","n":"Niżne Tatry (Jasná, Chopok)","c":"SK","r":"Żylina","y":48.943,"x":19.59,"hikes":[{"n":"Chopok (2024 m)","d":"średnia","t":"3–4 h","o":"Najpopularniejszy szczyt Tatr Niżnych, można wjechać kolejką.","s":"Klasyki"},{"n":"Ďumbier (2043 m)","d":"średnia","t":"4–5 h","o":"Najwyższy szczyt Tatr Niżnych (2043 m), z szerokim widokiem na całe pasmo. Podejście z Chopoku jest łatwe technicznie, a z doliny dłuższe i bardziej męczące.","s":"Klasyki"},{"n":"Demänovská dolina – jaskinie","d":"łatwa","t":"2–3 h","o":"Dolina z kilkoma udostępnionymi jaskiniami, m.in. Demänovská Ľadová i Demänovská jaskyňa slobody. Trasa jest łatwa, a jaskinie są otwarte sezonowo, więc sprawdź godziny.","s":"Klasyki"}],"ds":"Tatry Niżne to najdłuższe pasmo gór Słowacji, z najwyższym szczytem Ďumbier (2043 m). Jasná i Chopok to baza i ośrodek narciarski, a w Demänovskiej Dolinie jest kilka udostępnionych jaskiń. Łagodniejsze niż Tatry Wysokie, z szerokimi widokami."},{"id":"h-mala-fatra","n":"Mała Fatra (Vrátna)","c":"SK","r":"Żylina","y":49.184,"x":19.069,"hikes":[{"n":"Veľký Rozsutec","d":"trudna","t":"5–6 h","o":"Charakterystyczny szczyt Małej Fatry, z łańcuchami na ostatnim odcinku.","s":"Klasyki"},{"n":"Veľký Kriváň","d":"średnia","t":"5–6 h","o":"Najwyższy szczyt Krywańskiej Małej Fatry (1709 m). Wejście z Vrátnej doliny jest dość strome, ale nagradza panoramą całego pasma. Wymaga kondycji i dobrej pogody.","s":"Klasyki"},{"n":"Jánošíkove diery","d":"średnia","t":"2–3 h","o":"Wąwóz w Małej Fatrze, z drabinami, kładkami i łańcuchami. Najlepszy latem, bo wiosną i po deszczu jest ślisko. Wejście może być zamknięte zimą.","s":"Klasyki"}],"ds":"Mała Fatra to pasmo w północnej Słowacji, z dużym parkiem narodowym. Vrátna dolina jest bazą do szlaków na Veľký Kriváň i do wąwozu Jánošíkove diery, nazwanego od zbójnika Janosika. Dobre na jeden lub dwa dni wędrówek."},{"id":"h-kazbegi","n":"Kazbegi (Stepancminda)","c":"GE","r":"Mccheta-Mtianeti","y":42.658,"x":44.643,"hikes":[{"n":"Cminda Sameba (Gergeti Trinity Church)","d":"średnia","t":"2.5–3.5 h","o":"Z Stepancminda do kościoła z XIV wieku na wysokości ok. 2170 m, z Kazbekiem w tle. Podejście ok. 3 h stromą ścieżką lub drogą terenową. Rano często ładniejsze światło.","s":"Klasyki"},{"n":"Juta – Chaukhi Pass","d":"trudna","t":"7–9 h","o":"Wysokogórska trasa z wioski Juta pod skalne iglice Czaukhi i przełęcz na ok. 3300 m. Wymaga formy i dobrej pogody, a widoki na masyw Czaukhi są jednymi z najlepszych w Kazbegi.","s":"Klasyki"},{"n":"Juta – Piąte Jezioro (Czaukhi)","d":"średnia","t":"5–7 h","o":"Pętla z Juty w górę doliny pod granią Czaukhi, jedna z najpopularniejszych tras w Kazbegi. Droga prowadzi przez łąki i morenę, a skały Czaukhi dominują nad całą doliną.","s":"Klasyki","ct":"j"}],"ds":"Kazbegi (Stepancminda) leży u stóp Kazbeku (5054 m), przy Gruzińskiej Drodze Wojennej. Trasy są krótkie i widokowe, a wioska to baza dla większych wypraw. Najlepiej latem i wczesną jesienią, zimą droga bywa zamknięta."},{"id":"h-kz-bao","n":"Wielkie Jezioro Ałmatyńskie","c":"KZ","r":"Ałmaty","y":43.0508,"x":76.9857,"hikes":[{"n":"Wielkie Jezioro Ałmatyńskie – punkt widokowy","d":"łatwa","t":"1–2 h","o":"Turkusowe jezioro w Górach Zailijskich nad Ałmaty, krótki spacer z parkingu i dalej wzdłuż brzegu.","s":"Klasyki","ct":"j"},{"n":"Szczyt Turystów (Tourist Peak, 3954 m)","d":"trudna","t":"8–10 h","o":"Wejście ponad jeziorem, zwykle z przełęczy Tuyuk-Su; wymaga kondycji i aklimatyzacji.","s":"Klasyki"}],"ds":"Wielkie Jezioro Ałmatyńskie leży na ok. 2500 m w górach Zailijskiego Ałatau, ok. 15 km od Ałmaty. Woda ma turkusowy kolor, a wokół wznoszą się szczyty powyżej 4000 m. Droga do jeziora bywa zamknięta, bo leży w strefie przygranicznej i wymaga zezwolenia."},{"id":"h-kz-medeu","n":"Medeu i Szymbułak","c":"KZ","r":"Ałmaty","y":43.157,"x":77.059,"hikes":[{"n":"Medeu – Szymbułak (schody i szlak)","d":"średnia","t":"2–3 h","o":"Z lodowiska Medeu na górną stację w Szymbułak, panorama Ałmaty.","s":"Klasyki"},{"n":"Kok-Żajlau – Kok-Tobe","d":"łatwa","t":"2–3 h","o":"Spacer po łagodnych pastwiskach nad Ałmaty. Z Kok-Tobe, na które wjeżdża kolejka linowa, rozciąga się widok na miasto i góry.","s":"Klasyki"}],"ds":"Medeu to wysokogórskie lodowisko (ok. 1700 m) nad Ałmaty, a stąd wyciąg prowadzi do ośrodka Szymbułak. Latem to baza lekkich spacerów, zimą narciarstwa. Z góry widać miasto i góry Zailijskiego Ałatau."},{"id":"h-kz-charyn","n":"Kanion Czaryn (Dolina Zamków)","c":"KZ","r":"Ałmaty","y":43.35,"x":79.0833,"hikes":[{"n":"Dolina Zamków (Valley of Castles)","d":"łatwa","t":"2–3 h","o":"Ok. 3 km w dół czerwonego kanionu do rzeki Czaryn, formacje skalne jak w Wielkim Kanionie.","s":"Klasyki","ct":"k"}],"ds":"Kanion Czaryn to czerwone ściany skalne o głębokości do ok. 300 m, wyrzeźbione przez rzekę. Najsłynniejsza jest Dolina Zamków z fantazyjnymi formacjami. Latem jest bardzo gorąco, więc najlepiej wybrać wiosnę lub jesień."},{"id":"h-kz-kolsai","n":"Jeziora Kolsaj","c":"KZ","r":"Ałmaty","y":42.9877,"x":78.3253,"hikes":[{"n":"Dolne Jezioro Kolsaj","d":"łatwa","t":"1–2 h","o":"Najłatwiejsze z trzech jezior, położone w smrekowej dolinie na ok. 1800 m.","s":"Klasyki","ct":"j"},{"n":"Środkowe Kolsaj (Kolsai II)","d":"średnia","t":"5–7 h","o":"Dojście przez las do jeziora na ok. 2250 m, zwykle z noclegiem w namiocie.","s":"Klasyki","ct":"j"},{"n":"Górne Kolsaj (Kolsai III)","d":"trudna","t":"2 dni","o":"Najwyżej położone jezioro, wymaga kondycji i zezwolenia strefy przygranicznej.","s":"Klasyki","ct":"j"},{"n":"Zatopiony las Kaindy","d":"łatwa","t":"1–2 h","o":"Jezioro z pniami świerków sterczącymi spod wody; spacer wzdłuż brzegu i na punkt widokowy.","s":"Klasyki","ct":"j"}],"ds":"Jeziora Kolsaj to trzy jeziora w górach Kungej Ałatau, na wysokości ok. 1800, 2250 i 2700 m, wśród jodłowych lasów. Dostępne są zwykle od czerwca do września. Do wyższych jezior idzie się pieszo i warto mieć pozwolenie na wejście w strefę przygraniczną."},{"id":"h-kz-altyn-emel","n":"Altyn-Emel (Śpiewająca Wydma)","c":"KZ","r":"Ałmaty","y":43.91,"x":78.6,"hikes":[{"n":"Śpiewająca Wydma","d":"łatwa","t":"1–2 h","o":"Piaszczysta wydma wydająca dźwięk przy wietrze, w parku Altyn-Emel.","s":"Klasyki","ct":"k"},{"n":"Góry Aktau i Katutau","d":"łatwa","t":"2–3 h","o":"Kolorowe formacje skalne w Altyn-Emel, w odcieniach czerwieni, bieli i żółci. Dojazd tylko samochodem terenowym, a ścieżki wśród skał są krótkie.","s":"Klasyki"}],"ds":"Park Narodowy Altyn-Emel słynie ze Śpiewającej Wydmy, która wydaje niski dźwięk, gdy piasek zsuwa się z grzbietu. Są tu też kolorowe góry Aktau i Katutau oraz pradawne petroglify. Do większości miejsc potrzebny jest samochód terenowy."},{"id":"h-kz-bayanaul","n":"Bajanauł","c":"KZ","r":"Pawłodar","y":50.7833,"x":75.7,"hikes":[{"n":"Jezioro Dżasybaj i skały","d":"łatwa","t":"2–3 h","o":"Spacery wokół jeziora Dżasybaj i granitowych skał w parku Bajanauł. Łatwe ścieżki wśród sosen, dobre na wycieczkę z dziećmi.","s":"Klasyki","ct":"j"}],"ds":"Bajanauł to park narodowy w północnym Kazachstanie, z granitowymi skałami i jeziorami wśród lasów sosnowych. Najlepszy czas to lato, gdy można pływać i chodzić na krótkie szlaki. Dobre miejsce na spokojny weekend z dala od tłumów."},{"id":"h-kz-burabay","n":"Burabaj (Szczuczyńsk)","c":"KZ","r":"Akmola","y":53.0833,"x":70.3167,"hikes":[{"n":"Okżetpes i Jezioro Burabaj","d":"łatwa","t":"2–3 h","o":"Granitowe skały nad jeziorem, popularne miejsce wypoczynku w centralnym Kazachstanie.","s":"Klasyki","ct":"j"}],"ds":"Burabaj, zwany Szczuczyńskiem, to uzdrowiskowy kurort w stepach Kazachstanu, z jeziorami i granitowymi skałami wśród sosnowych lasów. Często nazywany jest kazachską Szwajcarią. Najlepiej latem, a trasy są krótkie i łatwe."},{"id":"h-kg-karakol","n":"Karakol (Ala-Kul, Ałtyn Arasan)","c":"KG","r":"Issyk-Kul","y":42.4907,"x":78.3936,"hikes":[{"n":"Ala-Kul Trek","d":"trudna","t":"1–2 dni","o":"Klasyczny trek do jeziora Ala-Kul na ok. 3500 m, przez przełęcz ok. 3900 m. Dla wielu to najpiękniejsza trasa Kirgistanu, ale podejście jest strome i wymaga aklimatyzacji.","s":"Klasyki"},{"n":"Ałtyn Arasan – gorące źródła","d":"średnia","t":"2 dni","o":"Dolina Ałtyn Arasan z gorącymi źródłami, dojście z Karakol w głąb gór Terskey. Dwa dni z noclegiem w dolinie.","s":"Klasyki"},{"n":"Wodospad Barskoon","d":"łatwa","t":"2–3 h","o":"Wąska dolina z kaskadą wodospadów, na południowym brzegu Issyk-Kul. Przy wejściu stoi pomnik Gagarina.","s":"Klasyki","ct":"w"},{"n":"Wodospad Jeti-Ögüz","d":"łatwa","t":"2 h","o":"Spacer do wodospadu z doliny Dżeti-Ögüz. Przez las świerkowy.","s":"Klasyki","ct":"w"},{"n":"Karakol – Ałtyn Arasan – Ala-Kul","d":"trudna","t":"3–4 dni","o":"Rozszerzona pętla przez dolinę Ałtyn Arasan i przełęcz Ala-Kul. Najlepsza dla tych, którzy chcą połączyć gorące źródła z trekkingiem.","s":"Klasyki"},{"n":"Wodospad Arashan","d":"średnia","t":"2–3 h","o":"Szlak do wodospadu w dolinie nad Karakolem, z gorącym źródłem w dolinie. Dobry na jednodniową wycieczkę.","s":"Klasyki","ct":"w"}],"ds":"Miasto nad wschodnim końcem Issyk-Kul i baza trekkingowa Tienszanu. Stąd startują klasyczne trasy do Ala-Kul i gorących źródeł Ałtyn Arasan."},{"id":"h-kg-jeti-oguz","n":"Dżeti-Ögüz (Siedem Byków)","c":"KG","r":"Issyk-Kul","y":42.3333,"x":78.2,"hikes":[{"n":"Dolina Dżeti-Ögüz – Złamane Serce","d":"łatwa","t":"2–3 h","o":"Spacer doliną wśród czerwonych skał Siedmiu Byków i formacji Złamane Serce. Jedno z najbardziej charakterystycznych miejsc nad Issyk-Kul.","s":"Klasyki","ct":"k"}],"ds":"Dolina Dżeti-Ögüz z czerwonymi skałami zwanymi Siedmioma Bykami, na południowym brzegu Issyk-Kul. Jest też początkiem trasy w stronę Karakolu i gór."},{"id":"h-kg-skazka","n":"Kanion Skazka (Bajka)","c":"KG","r":"Issyk-Kul","y":42.15,"x":77.0,"hikes":[{"n":"Kanion Skazka","d":"łatwa","t":"1–2 h","o":"Czerwono-pomarańczowe formacje erozyjne na południowym brzegu Issyk-Kul. Skały przypominają bajkowe zamki.","s":"Klasyki","ct":"k"}],"ds":"Kanion Skazka (Bajka) na południowym brzegu Issyk-Kul, z czerwonymi i pomarańczowymi formacjami z piaskowca. Powstały przez erozję, a z góry widać jezioro."},{"id":"h-kg-song-kul","n":"Song-Köl","c":"KG","r":"Naryn","y":41.85,"x":75.1167,"hikes":[{"n":"Pętla wokół Song-Köl","d":"średnia","t":"1–2 dni","o":"Wysokogórskie jezioro (ok. 3000 m) z jurtami i końmi; dojazd z Kochkor lub Naryn. Trasa jest otwarta tylko latem.","s":"Klasyki"},{"n":"Song-Köl – Kyzart i Jurty","d":"średnia","t":"2–3 dni","o":"Trasa z noclegiem w jurtach nad jeziorem, pieszo lub konno. Jedno z najbardziej klimatycznych miejsc Kirgistanu.","s":"Klasyki"}],"ds":"Jezioro Song-Köl na wysokości ok. 3000 m, otoczone pastwiskami z jurtami pasterzy. Latem można tu jeździć konno i chodzić, zimą jest niedostępne."},{"id":"h-kg-kel-suu","n":"Kel-Suu","c":"KG","r":"Naryn","y":40.9833,"x":78.7667,"hikes":[{"n":"Jezioro Kel-Suu","d":"trudna","t":"2 dni","o":"Lazurowe jezioro wśród skał przy granicy z Chinami, wymaga zezwolenia przygranicznego. Dojście zajmuje dwa dni.","s":"Klasyki","ct":"j"}],"ds":"Jezioro Kel-Suu o lazurowej wodzie wśród pionowych skał, przy granicy z Chinami. Dojazd terenowy, a wstęp wymaga zezwolenia przygranicznego."},{"id":"h-kg-tash-rabat","n":"Tasz Rabat","c":"KG","r":"Naryn","y":40.8167,"x":75.2833,"hikes":[{"n":"Karawanseraj Tasz Rabat","d":"łatwa","t":"1–2 h","o":"Kamienny karawanseraj na dawnym Jedwabnym Szlaku, w wysokiej dolinie. Spacery po okolicy i nocleg w jurtach.","s":"Klasyki","ct":"k"}],"ds":"Kamienny karawanseraj z XV w. w wysokiej dolinie koło Naryn, dawny przystanek na Jedwabnym Szlaku. Wokół pastwiska i krótkie trasy."},{"id":"h-kg-arslanbob","n":"Arsłanbob (wodospady i orzechy)","c":"KG","r":"Dżalalabad","y":41.3333,"x":72.9333,"hikes":[{"n":"Wielkie Wodospady Arsłanbob","d":"łatwa","t":"2–3 h","o":"Spacer przez największy na świecie las orzecha włoskiego do wodospadów. Droga jest w miarę łatwa.","s":"Klasyki","ct":"w"}],"ds":"Wieś u stóp gór Fergańskich, w największym na świecie naturalnym lesie orzecha włoskiego. W okolicy wodospady i krótkie trasy."},{"id":"h-kg-ala-archa","n":"Ala-Archa","c":"KG","r":"Czuj","y":42.55,"x":74.4833,"hikes":[{"n":"Lodowiec Ak-Sai (Alplager)","d":"trudna","t":"6–8 h","o":"Wejście do bazy wspinaczkowej Alplager i dalej w stronę lodowca Ak-Sai, w Ala-Archa. Przewyższenie duże, a odcinek lodowcowy wymaga doświadczenia.","s":"Klasyki"},{"n":"Wodospad Ak-Sai i Tuyuk-Su","d":"średnia","t":"6 h","o":"Rozbudowana trasa z Ala-Archa na przełęcz w stronę Tuyuk-Su, z widokiem na wodospad Ak-Sai. Cały dzień w dolinach.","s":"Klasyki","ct":"w"},{"n":"Szczyt Korona (Korona Peak)","d":"trudna","t":"2 dni","o":"Wysokogórska wyprawa w Ala-Archa, wymaga doświadczenia. Wejście ze sprzętem i noclegiem.","s":"Klasyki"}],"ds":"Park Narodowy Ala-Archa, godzinę od Biszkeku, z lodowcami i szczytami powyżej 4800 m. Najłatwiej dostępna wysokogórska okolica Kirgistanu."},{"id":"h-kg-lenin","n":"Pik Lenina – Obóz Bazowy","c":"KG","r":"Osz","y":39.35,"x":72.8667,"hikes":[{"n":"Obóz Bazowy Piku Lenina","d":"trudna","t":"3–4 dni","o":"Trek z Dżeti-Ögüz do obozu bazowego pod 7134 m; wysokość i pogoda są głównym ryzykiem. Widok na wysokie szczyty Pamiru.","s":"Klasyki"}],"ds":"Pik Lenina (7134 m), jeden z najłatwiejszych siedmiotysięczników świata, w paśmie Pamiru. Obóz bazowy leży na ok. 3600 m."},{"id":"h-kg-sary-chelek","n":"Sary-Czełek","c":"KG","r":"Dżalalabad","y":41.9167,"x":72.2333,"hikes":[{"n":"Jezioro Sary-Czełek","d":"łatwa","t":"2–3 h","o":"Rezerwat biosfery z turkusowym jeziorem otoczonym lasami. Odległy region, mało turystów.","s":"Klasyki","ct":"j"}],"ds":"Rezerwat biosfery na zachodzie Kirgistanu z turkusowym jeziorem otoczonym lasami. Dziki, mało odwiedzany region."},{"id":"h-ge-svaneti","n":"Swanetia (Mestia, Uszguli)","c":"GE","r":"Swanetia","y":43.045,"x":42.729,"hikes":[{"n":"Mestia – Uszguli","d":"trudna","t":"4 dni","o":"Klasyczny czterodniowy trek (ok. 55 km) między Mestią i Uszguli, z przełęczami, wioskami Zhabeshi i Adiszi i wieżami obronnymi. Noclegi w gościnnych domach, wymaga formy, ale nie umiejętności wspinaczkowych.","s":"Klasyki"},{"n":"Lodowiec Czalaadi","d":"łatwa","t":"3–4 h","o":"Spacer doliną do języka lodowca blisko Mestii, z mostem na rzece i prostym podejściem. Dobry na pół dnia, bez wymagań technicznych.","s":"Klasyki"},{"n":"Jeziora Koruldi","d":"średnia","t":"4–5 h","o":"Wejście nad Mestię do dwóch jezior z widokiem na Uszbę, szczyt o charakterystycznym podwójnym wierzchołku. Dobra trasa na 4–5 h z fotogenicznym finałem.","s":"Klasyki","ct":"j"}],"ds":"Swanetia to najwyższa zamieszkana część Kaukazu, z wieżami obronnymi na liście UNESCO i lodowcami nad wioskami. Mestia jest bazą na jednodniowe trasy, a stąd zaczyna się czterodniowy trek do Uszguli. Sezon trwa od czerwca do września."},{"id":"h-ge-ushguli","n":"Uszguli i lodowiec Szchary","c":"GE","r":"Swanetia","y":42.9167,"x":43.0167,"hikes":[{"n":"Uszguli – lodowiec Szchary","d":"średnia","t":"4–5 h","o":"Pod najwyższy szczyt Gruzji (5193 m): trasa płaska i bardzo widokowa, z wioski przez dolinę do lodowca. Idealna, jeśli nie masz sił na dłuższe trasy.","s":"Klasyki"}],"ds":"Uszguli to jedna z najwyżej położonych stale zamieszkanych osad w Europie (ok. 2100 m), z wieżami obronnymi i wpisem UNESCO. Nad wioską wznosi się Szchara (5193 m), najwyższy szczyt Gruzji. Dojazd z Mestii zajmuje kilka godzin."},{"id":"h-ge-tusheti","n":"Tuszeti (Omalo, Dartlo)","c":"GE","r":"Kachetia","y":42.37,"x":45.62,"hikes":[{"n":"Omalo – Dartlo","d":"średnia","t":"1–2 dni","o":"Dolinami między kamiennymi wioskami Tuszeti, w tym Dartlo ze słynnymi wieżami. Jedna z najbardziej odludnych tras Kaukazu, wygodna jako 1–2 dni z noclegiem.","s":"Klasyki"}],"ds":"Tuszeti to odległy region na północnym wschodzie Gruzji, dostępny tylko latem przez przełęcz Abano (ok. 2850 m), jedną z najniebezpieczniejszych dróg Kaukazu. Kamienne wsie, wypas owiec i brak tłumów robią z niego ciekawy cel dla trekkerów."},{"id":"h-ge-okatse","n":"Kanion Okacze","c":"GE","r":"Imeretia","y":42.463,"x":42.53,"hikes":[{"n":"Ścieżka w Kanionie Okacze","d":"łatwa","t":"1.5–2 h","o":"Zawieszone nad kanionem pomosty i wodospad Kinchkha w pobliżu. Spokojny spacer przez las, a sam widok na przepaść robi wrażenie.","s":"Klasyki","ct":"k"}],"ds":"Kanion Okacze koło Kutaisi z zawieszoną nad przepaścią platformą widokową i krótkim spacerem leśnym. Dobre na pół dnia, często łączone z kanionem Martvili i jaskiniami Prometeusza."},{"id":"h-ge-martvili","n":"Kanion Martvili","c":"GE","r":"Samegrelo","y":42.46,"x":42.38,"hikes":[{"n":"Kanion Martvili","d":"łatwa","t":"1–2 h","o":"Wąski kanion z turkusową wodą, łódki i krótki spacer po pomostach. Łączenie z Okacze to klasyczny dzień koło Kutaisi.","s":"Klasyki","ct":"k"}],"ds":"Wąski kanion rzeki Abasza z turkusową wodą i skalnymi ścianami porośni 7,"hikes":[{"n":"Jezioro Parz – Goshavank","d":"łatwa","t":"2–3 h","o":"Lasy dębowe i klasztory w „armeńskiej Szwajcarii”.","s":"Klasyki","ct":"j"}]},{"id":"h-am-garni","n":"Wąwóz Garni (Symfonia Kamieni)","c":"AM","r":"Kotajk","y":40.11,"x":44.73,"hikes":[{"n":"Symfonia Kamieni – Garni","d":"łatwa","t":"1–2 h","o":"Bazaltowe słupy w wąwozie rzeki Azat, przy świątyni Garni.","s":"Klasyki","ct":"k"}]},{"id":"h-am-sevan","n":"Półwysep Sevan","c":"AM","r":"Gegharkunik","y":40.55,"x":45.35,"hikes":[{"n":"Półwysep Sevan – klasztor Sevanawank","d":"łatwa","t":"1–2 h","o":"Schody na wzgórze z widokiem na największe jezioro Kaukazu.","s":"Klasyki","ct":"k"}]},{"id":"h-am-tatev","n":"Tatew (Skrzydła Tatewu)","c":"AM","r":"Syunik","y":39.38,"x":46.25,"hikes":[{"n":"Kanion Worotan – klasztor Tatew","d":"średnia","t":"3–4 h","o":"Szlak kanionem do klasztoru, można wrócić kolejką linową Skrzydła Tatewu.","s":"Klasyki","ct":"k"}]},{"id":"h-az-shahdag","n":"Szahdag i Laza","c":"AZ","r":"Quba","y":41.1722,"x":48.1433,"hikes":[{"n":"Laza – wodospady","d":"średnia","t":"2–3 h","o":"Wioska pod Szahdagiem z wodospadami w kaukaskich dolinach.","s":"Klasyki","ct":"w"}]},{"id":"h-az-xinaliq","n":"Chinalig","c":"AZ","r":"Quba","y":41.1833,"x":48.1167,"hikes":[{"n":"Chinalig – wysokogórska wioska","d":"łatwa","t":"2–3 h","o":"Jedna z najwyżej położonych wsi Kaukazu (ok. 2300 m), spacery po okolicy.","s":"Klasyki"}]},{"id":"h-tj-iskanderkul","n":"Iskanderkul","c":"TJ","r":"Sogd","y":39.0833,"x":68.3667,"hikes":[{"n":"Jezioro Iskanderkul i wodospad Fan","d":"łatwa","t":"2–3 h","o":"Górskie jezioro w Górach Fan, spacer do wodospadu przy jeziorze.","s":"Klasyki","ct":"w"}]},{"id":"h-tj-fann","n":"Góry Fan (Siedem Jezior)","c":"TJ","r":"Sogd","y":39.235,"x":67.69,"hikes":[{"n":"Siedem Jezior Marguzor","d":"średnia","t":"3 dni","o":"Trek wzdłuż turkusowych jezior doliną Shing; wysokość ok. 1600–2400 m.","s":"Klasyki","ct":"j"},{"n":"Jeziora Alauddin","d":"trudna","t":"2–3 dni","o":"Dalszy trek do jezior Alauddin pod szczytami ponad 5000 m.","s":"Klasyki","ct":"j"}]},{"id":"h-uz-chimgan","n":"Czymgan i Belder Sai","c":"UZ","r":"Taszkent","y":41.4833,"x":70.0167,"hikes":[{"n":"Wielki Czymgan (3309 m)","d":"średnia","t":"6–8 h","o":"Najwyższy szczyt okolic Taszkentu; popularny szlak górski z kolejką.","s":"Klasyki"},{"n":"Jezioro Charvak","d":"łatwa","t":"1–2 h","o":"Zbiornik w dolinie z możliwością krótkich spacerów.","s":"Klasyki","ct":"j"}]},{"id":"h-mn-gobi","n":"Pustynia Gobi (Chongor Els, Jolyn Am)","c":"MN","r":"Południowy Gobi","y":43.7667,"x":102.2833,"hikes":[{"n":"Wydmy Chongor Els","d":"średnia","t":"2–3 h","o":"Wejście na „śpiewające” wydmy w Gobi.","s":"Klasyki","ct":"k"},{"n":"Jolyn Am (Dolina Lodowa)","d":"łatwa","t":"2–3 h","o":"Wąski kanion z lodem utrzymującym się latem.","s":"Klasyki","ct":"k"}]},{"id":"h-mn-terelj","n":"Terelj","c":"MN","r":"Ułan Bator","y":47.9833,"x":107.4667,"hikes":[{"n":"Żółw Skała i Aryabal","d":"łatwa","t":"2–3 h","o":"Park narodowy blisko Ułan Bator, spacery pośród skał i pastwisk.","s":"Klasyki"}]},{"id":"h-mn-altai","n":"Ałtaj (Tavan Bogd)","c":"MN","r":"Bajan-Ölgij","y":49.1,"x":87.8,"hikes":[{"n":"Tavan Bogd – lodowiec Potanin","d":"trudna","t":"3–5 dni","o":"Wyprawa w pasmo Ałtaju przy styku Mongolii, Chin i Rosji.","s":"Klasyki"}]},{"id":"h-np-ebc","n":"Everest Base Camp (Lukla)","c":"NP","r":"Khumbu","y":27.6881,"x":86.7312,"hikes":[{"n":"Everest Base Camp","d":"trudna","t":"12–14 dni","o":"Klasyczny trek przez Namche Bazaar i Gorak Shep do obozu bazowego na ok. 5300 m.","s":"Klasyki"},{"n":"Jeziora Gokyo","d":"trudna","t":"10–12 dni","o":"Trek do systemu jezior Gokyo w Khumbu, z możliwością przejścia przełęczą Cho La. Piękne turkusowe jeziora i widok na Everest z Gokyo Ri.","s":"Klasyki","ct":"j"}],"ds":"Everest Base Camp to klasyczny trek w Himalajach, który zaczyna się w Lukli i prowadzi przez wioski szerpów do bazy pod Everestem na ok. 5364 m. Trwa zwykle ok. 12–14 dni z aklimatyzacją. Najlepszy czas to wiosna i jesień."},{"id":"h-np-annapurna","n":"Annapurna (Annapurna Base Camp)","c":"NP","r":"Gandaki","y":28.53,"x":83.878,"hikes":[{"n":"Annapurna Base Camp","d":"trudna","t":"7–10 dni","o":"Trek przez Ghandruk i wioski Gurungów do sanktuarium Annapurny na ok. 4130 m. Zwykle 7–10 dni, z noclegami w lodge'ach.","s":"Klasyki"},{"n":"Poon Hill","d":"średnia","t":"3–5 dni","o":"Krótki trek na punkt widokowy ze wschodami nad Dhaulagiri i Annapurną.","s":"Klasyki"}],"ds":"Annapurna Base Camp to trek do sanktuarium Annapurny na ok. 4130 m, w otoczeniu ośmiotysięczników. Zwykle trwa 7–10 dni przez wioski Ghandruk i Chomrong. Najlepszy sezon to wiosna i jesień."},{"id":"h-np-tilicho","n":"Jezioro Tilicho","c":"NP","r":"Gandaki","y":28.6833,"x":83.85,"hikes":[{"n":"Jezioro Tilicho","d":"trudna","t":"4–6 dni","o":"Jedno z najwyżej położonych jezior świata (ok. 4900 m), odnoga Annapurna Circuit.","s":"Klasyki","ct":"j"}],"ds":"Jezioro Tilicho leży na ok. 4919 m i należy do najwyżej położonych jezior świata. Trek bywa częścią Obwodu Annapurny. Wysokość wymaga aklimatyzacji, a trasa biegnie miejscami ryzykownymi zboczami."},{"id":"h-np-langtang","n":"Langtang","c":"NP","r":"Bagmati","y":28.21,"x":85.5,"hikes":[{"n":"Langtang Valley Trek","d":"średnia","t":"7–9 dni","o":"Trek doliną Langtang z widokami na lodowce, blisko Katmandu.","s":"Klasyki"}],"ds":"Langtang to dolina na północ od Katmandu, z widokiem na lodowce i szczyty wokół Langtang Lirung. Trek trwa kilka dni i jest łatwiej dostępny niż Everest czy Annapurna. Region został mocno zniszczony przez trzęsienie ziemi w 2015 r. i wciąż się odbudowuje."},{"id":"h-pk-fairy","n":"Fairy Meadows (Nanga Parbat)","c":"PK","r":"Gilgit-Baltistan","y":35.42,"x":74.59,"hikes":[{"n":"Fairy Meadows – Nanga Parbat Base Camp","d":"średnia","t":"1–2 dni","o":"Łąki pod ścianą Nanga Parbat (8126 m), dojście z Raikot Bridge.","s":"Klasyki"}]},{"id":"h-pk-k2","n":"K2 Base Camp (Concordia)","c":"PK","r":"Gilgit-Baltistan","y":35.758,"x":76.511,"hikes":[{"n":"K2 Base Camp i Concordia","d":"trudna","t":"14–18 dni","o":"Jeden z najbardziej wymagających treków świata, przez lodowiec Baltoro.","s":"Klasyki"}]},{"id":"h-pk-hunza","n":"Hunza i Attabad","c":"PK","r":"Gilgit-Baltistan","y":36.3333,"x":74.8667,"hikes":[{"n":"Jezioro Attabad","d":"łatwa","t":"1–2 h","o":"Turkusowe jezioro powstałe po osuwisku, na Karakorum Highway.","s":"Klasyki","ct":"j"}]},{"id":"h-pk-deosai","n":"Deosai","c":"PK","r":"Gilgit-Baltistan","y":35.0833,"x":75.4167,"hikes":[{"n":"Jezioro Sheosar","d":"łatwa","t":"2–3 h","o":"Wysokogórski płaskowyż Deosai (ok. 4100 m), „Kraina Olbrzymów”.","s":"Klasyki","ct":"j"}]},{"id":"h-in-pangong","n":"Pangong Tso","c":"IN","r":"Ladakh","y":33.75,"x":78.6667,"hikes":[{"n":"Pangong Tso – brzeg jeziora","d":"łatwa","t":"1–2 h","o":"Wysokogórskie jezioro w Ladakhu (ok. 4300 m); wymaga zezwolenia.","s":"Klasyki","ct":"j"}]},{"id":"h-in-valley-flowers","n":"Valley of Flowers","c":"IN","r":"Uttarakhand","y":30.728,"x":79.605,"hikes":[{"n":"Valley of Flowers","d":"średnia","t":"1–2 dni","o":"Dolina pokryta kwiatami w sezonie monsunowym; dojście z Govindghat.","s":"Klasyki"}]},{"id":"h-in-triund","n":"Triund (Dharamsala)","c":"IN","r":"Himachal Pradesh","y":32.25,"x":76.328,"hikes":[{"n":"Triund Trek","d":"średnia","t":"3–5 h","o":"Krótki trek nad McLeod Ganj z widokiem na Dhauladhar.","s":"Klasyki"}]},{"id":"h-pe-inca","n":"Droga Inków (Machu Picchu)","c":"PE","r":"Cusco","y":-13.1631,"x":-72.545,"hikes":[{"n":"Klasyczna Droga Inków","d":"trudna","t":"4 dni","o":"Czterodniowy trek do Machu Picchu starym szlakiem Inków, przez przełęcz Dead Woman's Pass (4215 m). Pozwolenia kupuje się z kilkumiesięcznym wyprzedzeniem, a wejście możliwe tylko z przewodnikiem.","s":"Klasyki"},{"n":"Machu Picchu – Huayna Picchu","d":"średnia","t":"2–3 h","o":"Stroma ścieżka po kamiennych schodach na górę stojącą nad ruinami, z widokiem na całą cytadelę. Dzienna liczba biletów jest ograniczona.","s":"Klasyki"},{"n":"Machu Picchu
