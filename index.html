/* ===== charakter: sportowy, outdoorowy wygląd (łatwo cofnąć usuwając ten blok) ===== */
:root{--fd:"Barlow Condensed","Arial Narrow","Roboto Condensed",Impact,sans-serif;--fb:Barlow,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}

#toast{position:fixed;left:50%;bottom:calc(86px + var(--safe-b));transform:translate(-50%,16px);background:var(--bg2);color:var(--text);border:1px solid var(--accent);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;z-index:400;opacity:0;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.45);transition:opacity .25s,transform .35s cubic-bezier(.3,1.5,.5,1);white-space:nowrap}

/* wyjazdy: porządki */
.tfold .tdel{opacity:.85!important;font-size:15px;padding:4px 6px;cursor:pointer}
.tctl{display:flex;gap:5px;align-items:center;margin-top:8px;flex-wrap:nowrap}
.tctl .tdaysel{width:auto;max-width:none;min-width:84px;padding:5px 4px;font-size:12px;flex:1 1 0;text-overflow:ellipsis}.tctl .tvg,.tctl button{flex:none}
.tctl .tdx{margin-left:0}.tctl button.tdx{padding:5px 0;width:30px;justify-content:center}
.tvg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tvg .tvote{border:0;border-radius:0}.tvg .tvote+.tvote{border-left:1px solid var(--line)}
.tctl button.tvote,.tctl button.tcmb,.tctl button.tdx{background:var(--glass);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:5px 9px;font-size:13px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;gap:4px;min-height:30px}
.tctl .tvg .tvote{border:0;border-radius:0}.tctl .tvg .tvote+.tvote{border-left:1px solid var(--line)}
.tctl button .ic{width:16px;height:16px}.tctl .tvg{background:var(--glass);border-radius:999px}.tctl .tvg .tvote{background:transparent;padding:5px 7px;min-height:30px}.tctl .tvg .tvote[data-v="1"].on{color:#2fb96a;background:rgba(47,185,106,.16);box-shadow:none}.tctl .tvg .tvote[data-v="-1"].on{color:#e5484d;background:rgba(229,72,77,.15);box-shadow:none}.tctl button.tcmb{border-radius:999px;padding:5px 8px}.tctl button.tcmb.has{color:var(--accent)}.tctl button.tdx{border-radius:999px}
.tctl button i{font-style:normal;font-size:12px;font-weight:700;opacity:.85}
.tctl button.on{background:var(--accentbg);box-shadow:inset 0 0 0 1.5px var(--accent)}
.tctl button.tdx{color:#ff8a8a;opacity:.9;padding:5px 10px;font-size:12px;opacity:1}
.tfold{margin-top:14px;border:1px solid var(--line);border-radius:16px;background:var(--glass);overflow:hidden}
.tfold>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:13px 14px;font-weight:700;font-size:15px;cursor:pointer}
.tfold>summary::-webkit-details-marker{display:none}
.tfold>summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--mute);border-bottom:2px solid var(--mute);transform:rotate(45deg) translateY(-2px);transition:transform .2s}
.tfold[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
.tfold[open]>summary{border-bottom:1px solid var(--line)}
.tfold .small{line-height:1.4}.tfold>*:not(summary){margin-left:12px!important;margin-right:12px!important}.tfold>summary+*{margin-top:10px}.tfold>*:last-child{margin-bottom:14px}

.tform{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.tform .tft .tfs{text-transform:none;letter-spacing:0;font-weight:500;font-size:12px}.tform .tft{font-weight:700;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}

.tspl{display:flex;gap:6px;flex-wrap:wrap}

.tsum .tppl{display:flex;gap:8px;flex-wrap:wrap}
.tact{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tdelall{display:block;margin:22px auto 6px;background:none;border:0;color:#ff8a8a;font-size:13px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;padding:8px}

.fmore::after{content:"";display:inline-block;width:6px;height:6px;margin-left:7px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(45deg) translateY(-2px);transition:transform .2s}

.fmore.act{color:var(--accent)}
