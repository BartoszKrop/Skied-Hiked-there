o Zermatt. Cały czas widać Matterhorn i lodowce Monte Rosa.","s":"Klasyki"},{"n":"Rothorn – Fluhalp","d":"średnia","t":"3–4 h","o":"Spacer z Blauherd przez Stellisee, jeziorko znane z odbicia Matterhornu, do Fluhalp. Najlepsze rano przy bezwietrznej pogodzie.","s":"Klasyki"},{"n":"Gandegg – Trockener Steg","d":"średnia","t":"4–5 h","o":"Wysokogórska trasa pod lodowcem Theodul, przy górnej stacji kolejki Matterhorn Glacier Paradise. Wysokość powyżej 3000 m, więc łatwo o zadyszkę i śnieg latem.","s":"Klasyki"},{"n":"Europaweg (Grächen – Zermatt)","d":"trudna","t":"2 dni","o":"Wysokogórska trasa nad doliną z widokami na lodowce Matterhornu i Weisshornu.","s":"Klasyki"},{"n":"Zmutt – Schwarzsee","d":"średnia","t":"4–5 h","o":"Spacer przez dolinę Zmutt na tle Matterhornu, powrót kolejką lub pieszo.","s":"Klasyki","ct":"j"}],"ds":"Wieś pod Matterhornem, bez ruchu samochodowego, z kolejką zębatą na Gornergrat. Najsłynniejszy widok w Alpach, szlaki od spacerów po wejścia pod szczyt."},{"id":"h-grindelwald","n":"Grindelwald","c":"CH","r":"Berno","y":46.6243,"x":8.0413,"hikes":[{"n":"First – Bachalpsee","d":"łatwa","t":"2–3 h","o":"Jezioro z widokiem na Schreckhorn i Wetterhorn, spacer z górnej stacji First.","s":"Klasyki"},{"n":"Eiger Trail","d":"średnia","t":"2–3 h","o":"Zejście pod północną ścianą Eigera, słynną z historii wspinaczkowej. Szlak zaczyna się przy Eigergletscher i kończy w Alpiglen, z widokiem na Grindelwald.","s":"Klasyki"},{"n":"Männlichen – Kleine Scheidegg","d":"łatwa","t":"1–1,5 h","o":"Płaski grzbietowy spacer z widokiem na Eiger, Mönch i Jungfrau. Kończy się w Kleine Scheidegg, skąd jedzie kolej na Jungfraujoch.","s":"Klasyki"},{"n":"Pfingstegg – Marmorbruch","d":"łatwa","t":"1,5–2 h","o":"Spacer do dawnego kamieniołomu marmuru koło lodowca Dolnego Grindelwaldu.","s":"Grindelwald"},{"n":"Bussalp – Faulhorn","d":"średnia","t":"4–5 h","o":"Podejście z Bussalp nad Grindelwaldem na Faulhorn (2681 m), z widokiem na Eiger i jezioro Brienz. Na szczycie stoi stare górskie schronisko.","s":"Grindelwald"},{"n":"Glecksteinhütte","d":"trudna","t":"5–6 h","o":"Trasa do schroniska pod stromą ścianą Wetterhornu. Spore przewyższenie, z widokiem na lodowiec Górny Grindelwald.","s":"Grindelwald"},{"n":"Schynige Platte – Faulhorn","d":"średnia","t":"5–6 h","o":"Klasyk Oberlandu: z Schynige Platte grzbietem aż do First lub Faulhornu. Tło to Eiger, Mönch i Jungfrau, a trasa ma kilka odcinków wymagających kondycji.","s":"Grindelwald"},{"n":"First Cliff Walk i Bachsee","d":"łatwa","t":"1.5–2 h","o":"Kładka przyklejona do skały nad przepaścią przy stacji First, potem spacer do jeziora Bachalpsee. Przy dobrej pogodzie Schreckhorn odbija się w wodzie.","s":"Klasyki"},{"n":"Pfingstegg – Bäregg","d":"średnia","t":"4–5 h","o":"Trasa nad lodowcem Dolny Grindelwald z widokiem na zbocza Eigera. Dobra na dzień, gdy wyżej leży chmura.","s":"Klasyki"},{"n":"Faulhornweg (First – Schynige Platte)","d":"średnia","t":"5 h","o":"Klasyczny grzbietowy szlak z widokami na Eiger, Mönch i Jungfrau oraz jeziora Thun i Brienz.","s":"Klasyki"},{"n":"Grosse Scheidegg – First","d":"łatwa","t":"2–3 h","o":"Łagodny spacer po pastwiskach między Grosse Scheidegg a First. Po drodze krowy z dzwonkami i widok na Wetterhorn.","s":"Klasyki"}],"ds":"Dolina pod ścianą Eigeru, z kolejką na First i na Kleine Scheidegg. Dużo łatwych szlaków z widokiem na lodowce i trudniejszych tras wysokogórskich."},{"id":"h-lauterbrunnen","n":"Lauterbrunnen","c":"CH","r":"Berno","y":46.5936,"x":7.9075,"hikes":[{"n":"Dolina wodospadów (Lauterbrunnen – Stechelberg)","d":"łatwa","t":"2–3 h","o":"Doliną z około siedemdziesięcioma wodospadami, m.in. Staubbach (ok. 300 m). Cała trasa jest płaska, a ściany doliny mają setki metrów.","ct":"w"},{"n":"Mürren – Gimmelwald – Lauterbrunnen","d":"średnia","t":"3–4 h","o":"Wioski bez samochodów i widoki na Eiger, Mönch i Jungfrau, na końcu zejście do doliny.","ct":"w"},{"n":"Grütschalp – Mürren","d":"łatwa","t":"1–1,5 h","o":"Płaski spacer przy torze kolejki, z widokiem na Eiger, Mönch i Jungfrau. Mürren jest wsią bez samochodów.","ct":"w"},{"n":"Trümmelbachfälle","d":"łatwa","t":"1–1.5 h","o":"Wodospady płynące wewnątrz skały, oglądane z windy i kładek. Odcinek lodowcowej wody ma dziesięć kaskad.","s":"Klasyki","ct":"w"},{"n":"Schilthorn – Mürren (zejście)","d":"średnia","t":"3–4 h","o":"Zejście z Birg lub Schilthornu do Mürren z widokiem na Eiger, Mönch i Jungfrau.","s":"Klasyki","ct":"w","fm":["bond"]},{"n":"Obersteinberg – Tanzbödeli","d":"średnia","t":"5 h","o":"Odludna dolina z widokiem na Breithorn i Tschingelhorn, pętla przez Stechelberg.","s":"Klasyki"}],"ds":"Wąska dolina ze skalnymi ścianami i kilkudziesięcioma wodospadami. Dobra baza do spacerów po dolinie i wyjazdów kolejką do Mürren i Wengen.","fl":{"bond":"Piz Gloria"}},{"id":"h-kandersteg","n":"Kandersteg","c":"CH","r":"Berno","y":46.495,"x":7.673,"hikes":[{"n":"Blüemlisalphütte","d":"trudna","t":"4–6 h","o":"Strome podejście z Oeschinensee do schroniska pod lodowcem Blüemlisalp, na ok. 2800 m. Wymaga wcześniejszego startu i kondycji.","s":"Klasyki"},{"n":"Oeschinensee – górna ścieżka","d":"średnia","t":"4–5 h","o":"Pętla nad jeziorem Oeschinen, jednym z najładniejszych jezior Alp, z widokiem na ściany Blüemlisalp. Fragmenty są eksponowane.","s":"Kandersteg"},{"n":"Gasterntal","d":"łatwa","t":"2–3 h","o":"Dzika dolina z potokiem Kander, daleko od tłumów. Do wejścia do doliny dojeżdża się wąską drogą z Kandersteg.","s":"Kandersteg"},{"n":"Bunderchrinde","d":"średnia","t":"5–6 h","o":"Przełęcz między Adelboden a Kandersteg, trasa przez pastwiska i skały. Dobra dla tych, którzy chcą zobaczyć mniej oczywiste zakątki Oberlandu.","s":"Kandersteg"},{"n":"Sunnbüel – Gemmipass","d":"średnia","t":"4–5 h","o":"Trasa po zboczach z widokiem na Valais i czterotysięczniki, kończy się na przełęczy Gemmi nad Leukerbad. Prowadzi między dwoma kantonami.","s":"Klasyki"}],"ds":"Alpejska wieś z Oeschinensee, jednym z najbardziej znanych jezior górskich w Szwajcarii. Łatwy dojazd z Berna, szlaki od rodzinnych po całodniowe."},{"id":"h-pontresina","n":"Pontresina i St. Moritz","c":"CH","r":"Gryzonia (Engadyna)","y":46.492,"x":9.9,"hikes":[{"n":"Lodowiec Morteratsch","d":"łatwa","t":"2–3 h","o":"Spacer doliną do czoła lodowca, wzdłuż tabliczek pokazujących jego dawny zasięg. Dobrze widać, jak szybko lodowiec się cofa."},{"n":"Muottas Muragl – Alp Languard","d":"średnia","t":"3–4 h","o":"Panoramiczna trasa wysoko nad doliną Engadyny, z widokiem na jeziora Oberengadyny. Dobry początek: wjazd kolejką na Muottas Muragl."},{"n":"Piz Languard (3262 m)","d":"trudna","t":"6–7 h","o":"Wejście na trzytysięcznik nad Pontresiną, bez trudności technicznych, ale długie. Ze szczytu widać Bernina, jeziora Engadyny i pasma aż po Włochy."},{"n":"Val Roseg – Hotel Roseg","d":"łatwa","t":"2–3 h","o":"Spacer wzdłuż rzeki doliną Val Roseg, do hotelu pod lodowcem. Najczęściej wybierany dzień dla rodzin w Pontresinie.","s":"Klasyki"},{"n":"Piz Corvatsch – Murtèl","d":"łatwa","t":"1.5–2 h","o":"Z górnej stacji kolejki Corvatsch (3303 m) na platformy widokowe. Krótko, ale na dużej wysokości, więc ubierz się ciepło.","s":"Klasyki"},{"n":"Diavolezza – Munt Pers","d":"średnia","t":"3 h","o":"Wejście spod Diavolezzy na Munt Pers (3207 m). Z góry widać lodowce Pers i Morteratsch oraz grupę Bernina z Piz Palü.","s":"Klasyki"},{"n":"Ospizio Bernina – Lago Bianco","d":"łatwa","t":"2 h","o":"Spacer wzdłuż Lago Bianco na przełęczy Bernina, przy linii kolejowej Bernina Express (UNESCO). Woda jest mlecznobiała od zawiesiny lodowcowej.","s":"Klasyki","ct":"j"}],"ds":"Engadyna z masywem Bernina, lodowcami i jeziorami na wysokości ponad 1800 m. Kolejki i autobusy ułatwiają dojście na punkty widokowe, a St. Moritz jest tuż obok."},{"id":"h-hallstatt","n":"Hallstatt i Dachstein (Obertraun)","c":"AT","r":"Górna Austria","y":47.5622,"x":13.6493,"hikes":[{"n":"Soleweg do Rudolfsturm","d":"łatwa","t":"1–1,5 h","o":"Szlak nad Hallstatt wzdłuż dawnego rurociągu solnego, najstarszego na świecie. Prowadzi do Rudolfsturm, z widokiem na jezioro i wioskę.","ct":"j"},{"n":"Dolina Echern i wodospad Waldbachstrub","d":"łatwa","t":"1,5–2 h","o":"Spacer lasem do wodospadu Waldbachstrub, w Dolinie Echern koło Hallstatt. Dobry dzień w deszczu, gdy wodospad ma najwięcej wody.","ct":"w"},{"n":"Hallstätter See – Obertraun","d":"łatwa","t":"2–3 h","o":"Spacer wzdłuż brzegu jeziora do Obertraun, przez lasy i plaże. Dobry na rodzinny dzień.","s":"Klasyki","ct":"j"},{"n":"Krippenstein – 5 Fingers","d":"łatwa","t":"2–3 h","o":"Platforma widokowa nad Hallstätter See, w kształcie pięciu palców. Wejście kolejką z Obertraun.","s":"Klasyki"},{"n":"Hoher Krippenstein – Gjaidalm","d":"średnia","t":"3–4 h","o":"Wędrówka z widokiem na lodowiec Dachstein, do schroniska Gjaidalm. Krasowe plateau.","s":"Klasyki"}],"ds":"Region Hallstatt–Dachstein z jeziorem, kopalnią soli i płaskowyżem Dachstein na liście UNESCO. Trasy prowadzą od brzegu jeziora po wysokie punkty widokowe z kolejki na Krippenstein, a w okolicy są też jaskinie lodowe."},{"id":"h-mayrhofen","n":"Mayrhofen (Zillertal)","c":"AT","r":"Tyrol","y":47.165,"x":11.865,"hikes":[{"n":"Berliner Höhenweg","d":"trudna","t":"kilka dni","o":"Klasyczny wysokogórski trekking po Alpach Zillertalskich ze schroniskami."},{"n":"Zillergrund – Zillertal Alpen","d":"łatwa","t":"2–3 h","o":"Dolina z wodospadami i schroniskami w Zillertalu. Można pójść krótko albo wydłużyć trasę.","s":"Klasyki"},{"n":"Schlegeis-Stausee – Friesenberghaus","d":"średnia","t":"5–6 h","o":"Wysokogórski szlak od zapory Schlegeis do schroniska Friesenberghaus pod lodowcem. Ostatnie podejście jest strome.","s":"Klasyki"},{"n":"Ahornspitze (2973 m)","d":"średnia","t":"6–8 h","o":"Wejście na szczyt z kolejki Ahornbahn, z widokiem na Zillertal i lodowce. Dłuższy dzień z przewyższeniem.","s":"Klasyki"},{"n":"Tristner","d":"trudna","t":"6–7 h","o":"Jedno z trudniejszych jednodniowych wejść w okolicy Mayrhofen, z widokiem na Zillertal.","s":"Klasyki"}],"ds":"Główny ośrodek Zillertalu w Tyrolu, z dolinami pod lodowcami i długimi szlakami do schronisk. Latem jeżdżą stąd kolejki na kilka szczytów."},{"id":"h-heiligenblut","n":"Heiligenblut (Großglockner)","c":"AT","r":"Karyntia","y":47.0404,"x":12.8449,"hikes":[{"n":"Gamsgrubenweg (Pasterze)","d":"średnia","t":"2–3 h","o":"Ścieżka nad lodowcem Pasterze, najdłuższym lodowcem Austrii, pod Großglocknerem. Fragmenty są eksponowane."},{"n":"Großglockner (3798 m)","d":"trudna","t":"2 dni","o":"Najwyższy szczyt Austrii, wymaga doświadczenia wysokogórskiego (lodowiec, asekuracja)."},{"n":"Franz-Josefs-Höhe – Pasterze","d":"łatwa","t":"1.5–2 h","o":"Spacer z platformy Franz-Josefs-Höhe w kierunku lodowca Pasterze. Cały czas widać Großglockner.","s":"Klasyki"},{"n":"Edelweißspitze","d":"łatwa","t":"1.5 h","o":"Krótkie wejście na punkt widokowy nad Wielką Drogą Alpejską Grossglockner.","s":"Klasyki"}],"ds":"Wioska pod Großglocknerem, najwyższą górą Austrii (3798 m), w parku Hohe Tauern. Okolica słynie z lodowca Pasterze i drogi Grossglockner Hochalpenstrasse."},{"id":"h-garmisch","n":"Garmisch-Partenkirchen","c":"DE","r":"Bawaria","y":47.4921,"x":11.0958,"hikes":[{"n":"Partnachklamm","d":"łatwa","t":"1–1,5 h","o":"Ok. 700 m wąwozu ze ścianami do 80 m i pomostami wykutymi w skale. Wstęp jest płatny, a w środku bywa mokro. Zimą można zobaczyć lodowe formacje."},{"n":"Eibsee dookoła","d":"łatwa","t":"2 h","o":"Pętla ok. 7 km wokół szmaragdowego jeziora u podnóża Zugspitze, z widokiem na masyw i wysepki. Łatwa i płaska, w sezonie dość tłoczna."},{"n":"Zugspitze przez Reintal","d":"trudna","t":"1–2 dni","o":"Wymagająca wyprawa na najwyższy szczyt Niemiec (2962 m) przez długą dolinę Reintal, zwykle z noclegiem w schronisku. Ostatni odcinek biegnie skałami z ubezpieczeniami. Można zjechać kolejką."},{"n":"Höllentalklamm","d":"średnia","t":"2.5–3.5 h","o":"Wąwóz z tunelami i pomostami, dojście do Höllentalangerhütte.","s":"Klasyki"},{"n":"Alpspitz – AlpspiX","d":"średnia","t":"3–4 h","o":"Pętla z górnej stacji kolejki Alpspitzbahn, ze skrzyżowaną platformą widokową AlpspiX nad przepaścią. Łatwe spacery i widok na Zugspitze.","s":"Klasyki"},{"n":"Kramer-Plateauweg","d":"łatwa","t":"3–4 h","o":"Pętla nad Garmisch z widokiem na Zugspitze, Alpspitze i Wetterstein, z niewielkimi podejściami. Łatwa i dobra na dzień o niepewnej pogodzie.","s":"Klasyki"}],"ds":"Garmisch-Partenkirchen w Bawarii to baza pod Zugspitze (2962 m), najwyższym szczytem Niemiec. W okolicy są wąwóz Partnachklamm, jezioro Eibsee i trasy w masywie Wetterstein. Sezon pieszy trwa od czerwca do października, a zimą jest tu ośrodek narciarski."},{"id":"h-berchtesgaden","n":"Berchtesgaden","c":"DE","r":"Bawaria","y":47.63,"x":13.0,"hikes":[{"n":"Königssee i Röthbachfall","d":"łatwa","t":"2–3 h","o":"Rejs po jeziorze i spacer do jednego z najwyższych wodospadów w Niemczech."},{"n":"Watzmannhaus","d":"trudna","t":"4–6 h","o":"Długie podejście do schroniska na wysokości ok. 1930 m pod masywem Watzmann, z widokiem na Königssee. Przydaje się nocleg, jeśli chcesz iść dalej."},{"n":"Jenner – Königssee","d":"łatwa","t":"2–3 h","o":"Z górnej stacji kolejki Jenner zejście nad jezioro Königssee, z widokiem z góry na fiordowy kształt jeziora. Nad wodą pływają statki do St. Bartholomä.","s":"Klasyki"},{"n":"Hoher Göll","d":"trudna","t":"6–8 h","o":"Wysokogórskie wejście nad Berchtesgaden, wymaga doświadczenia.","s":"Klasyki"}],"ds":"Park Narodowy Berchtesgaden to jedyny alpejski park narodowy Niemiec. Nad fiordowym jeziorem Königssee pływają elektryczne statki, a nad nim wznosi się Watzmann (2713 m). Najlepszy sezon trwa od czerwca do października."},{"id":"h-chamonix","n":"Chamonix","c":"FR","r":"Owernia-Rodan-Alpy","y":45.9237,"x":6.8694,"hikes":[{"n":"Lac Blanc","d":"średnia","t":"3–4 h","o":"Jezioro z widokiem na Mont Blanc, jedna z najpopularniejszych wędrówek w dolinie."},{"n":"Grand Balcon Sud (Planpraz – Flégère)","d":"średnia","t":"2–3 h","o":"Widokowy szlak po południowej stronie doliny, naprzeciw masywu Mont Blanc."},{"n":"Montenvers – Mer de Glace","d":"łatwa","t":"1–2 h","o":"Z kolejką na Montenvers, potem szlakiem nad lodowiec Mer de Glace."},{"n":"Tour du Mont Blanc","d":"trudna","t":"10–11 dni","o":"Klasyczny trekking dookoła Mont Blanc przez Francję, Włochy i Szwajcarię."},{"n":"Aiguille du Midi – Plan de l'Aiguille","d":"łatwa","t":"2–3 h","o":"Z kolejki zejście do Plan de l'Aiguille z widokiem na Mont Blanc.","s":"Klasyki"},{"n":"Lac de Chéserys","d":"średnia","t":"3–4 h","o":"Szlak do jeziora z widokiem na Mont Blanc i Aiguilles Rouges.","s":"Klasyki"},{"n":"Grand Balcon Nord","d":"średnia","t":"3–4 h","o":"Trasa z Montenvers (dojazd kolejką zębatą) wzdłuż zbocza w stronę Plan de l'Aiguille. Daje widoki na Aiguilles de Chamonix i Mer de Glace bez ostrego podejścia.","s":"Klasyki"},{"n":"Mont Blanc – Tête Rousse","d":"trudna","t":"2 dni","o":"Wejście w stronę Mont Blanc przez schronisko; tylko z doświadczeniem i przewodnikiem.","s":"Klasyki"}],"ds":"Chamonix leży pod Mont Blanc (4806 m) i jest bazą dla Tour du Mont Blanc. Koleje linowe, w tym na Aiguille du Midi, szybko wynoszą na widokowe tarasy, a lodowiec Mer de Glace jest najłatwiejszy do zobaczenia. Najlepszy sezon trwa od lipca do września."},{"id":"h-gavarnie","n":"Gavarnie","c":"FR","r":"Oksytania (Pireneje)","y":42.735,"x":-0.01,"hikes":[{"n":"Cyrk Gavarnie","d":"łatwa","t":"ok. 3 h","o":"Spacer z wioski do ogromnego lodowcowego cyrku ze słynnym wodospadem.","ct":"k"},{"n":"Brèche de Roland","d":"trudna","t":"6–8 h","o":"Znane przejście w skalnej ścianie na granicy francusko-hiszpańskiej.","ct":"k"},{"n":"Grande Cascade – Cirque de Gavarnie","d":"średnia","t":"3–4 h","o":"Z wioski Gavarnie ok. dwóch godzin marszu wzdłuż rzeki do hotelu u wejścia do amfiteatru, a dalej w stronę podnóża wodospadu. Najlepsza w czerwcu, kiedy topnieje śnieg.","s":"Klasyki","ct":"k"}],"ds":"Cirque de Gavarnie to wielki amfiteatr skalny (UNESCO) z jednym z najwyższych wodospadów Europy. Leży w Parku Narodowym Pirenejów, a trasa z wioski jest prosta i widokowa. Najlepszy czas to czerwiec–wrzesień."},{"id":"h-cauterets","n":"Cauterets","c":"FR","r":"Oksytania (Pireneje)","y":42.889,"x":-0.113,"hikes":[{"n":"Pont d'Espagne – Lac de Gaube","d":"łatwa","t":"2–3 h","o":"Z parkingu Pont d'Espagne łagodna ścieżka (lub kolejka krzesełkowa) do jeziora Gaube pod masywem Vignemale. Na starcie są wodospady, a okolica to klasyk Pirenejów."},{"n":"Cascade de Lutour","d":"łatwa","t":"1.5–2 h","o":"Krótkie wejście z Cauterets ścieżką do wodospadu Lutour. Łatwa trasa w cieniu lasu, dobra na pół dnia.","s":"Klasyki"}],"ds":"Cauterets to dawne uzdrowisko u wejścia do Parku Narodowego Pirenejów. Stąd wyruszasz do doliny wodospadów Pont d'Espagne i nad jezioro Gaube, a dalej pod Vignemale, najwyższy francuski szczyt Pirenejów. Dobra baza na tydzień łatwych i średnich tras."},{"id":"h-cortina","n":"Cortina d'Ampezzo","c":"IT","r":"Wenecja Euganejska (Dolomity)","y":46.5405,"x":12.1357,"hikes":[{"n":"Lago di Sorapis","d":"średnia","t":"4–5 h","o":"Mlecznoturkusowe jezioro pod ścianami Sorapis, jedno z najpiękniejszych w Dolomitach. Szlak z Passo Tre Croci zawiera krótkie odcinki z linami i drabinkami, a w lecie bywa tłoczny. Najlepiej wyjść wcześnie."},{"n":"Cinque Torri","d":"łatwa","t":"2–3 h","o":"Pięć skalnych wież z okopami i tunelami z I wojny światowej, dziś otwartych jako muzeum plenerowe. Z parkingu przy Passo Falzarego lub z Bai de Dones, łatwa trasa z widokiem na Tofane i Civettę."},{"n":"Lagazuoi i tunele wojenne","d":"średnia","t":"3–4 h","o":"Szlak śladami frontu z I wojny światowej, z tunelami wykutymi w skale pod Lagazuoi. Weź latarkę czołową i ciepłą kurtkę. Z góry widok na Cinque Torri i Marmoladę."},{"n":"Lago Federa i Croda da Lago","d":"średnia","t":"4–5 h","o":"Pętla do jeziora Federa pod ścianą Croda da Lago, z jednym z lepszych odbić Dolomitów w wodzie. Schronisko nad jeziorem sprzedaje dobre jedzenie, najładniej rano.","s":"Klasyki"},{"n":"Cascate di Fanes","d":"łatwa","t":"1–1.5 h","o":"Wodospady i wąwóz w parku Fanes-Sennes-Braies, krótki spacer od wsi Fanes. Dobry w deszczowy dzień, gdy góry są w chmurach.","s":"Klasyki"},{"n":"Rifugio Nuvolau","d":"średnia","t":"3–4 h","o":"Wejście do jednego z najstarszych schronisk w Dolomitach, położonego na szczycie Nuvolau (2575 m), z panoramą na 360 stopni, w tym Cinque Torri, Marmoladę i Tofane. Można skrócić trasę wyciągiem.","s":"Klasyki"}],"ds":"Dolomitowa stolica sportów górskich, miasto zimowych igrzysk 1956 i 2026. Wokół strzeliste turnie, okopy I wojny światowej i schroniska widoczne z doliny."},{"id":"h-tre-cime","n":"Tre Cime i Misurina (Cadini)","c":"IT","r":"Dolomity (Auronzo, Misurina)","y":46.6139,"x":12.3036,"hikes":[{"n":"Tre Cime dookoła","d":"średnia","t":"3–4 h","o":"Pętla ok. 10 km wokół trzech słynnych turni, start przy Rifugio Auronzo. Najpopularniejsza trasa Dolomitów, z widokiem na północną ścianę Cime i przy Rifugio Locatelli. Wczesny start unika tłumów i kolejki do parkingu."},{"n":"Rifugio Locatelli (Dreizinnenhütte)","d":"średnia","t":"3–4 h","o":"Klasyczna trasa do schroniska pod północnymi ścianami Tre Cime, jedno z najsłynniejszych miejsc w Dolomitach. Widok na całą trójkę wież z bliska, szczególnie fotogeniczny o wschodzie słońca.","s":"Klasyki"},{"n":"Lago di Misurina dookoła","d":"łatwa","t":"1–1.5 h","o":"Płaski spacer wokół jeziora Misurina, z widokiem na Cadini i Tre Cime. Łatwy i szybki, dobry na odpoczynek po większej trasie.","s":"Klasyki"},{"n":"Cadini di Misurina – Rifugio Fonda Savio","d":"średnia","t":"4–5 h","o":"Pętla pod iglicami Cadini di Misurina do schroniska Fonda Savio. Z widokiem na Tre Cime, w dobrej pogodzie jedna z najładniejszych tras okolicy.","s":"Klasyki"},{"n":"Monte Piana (okopy I wojny)","d":"średnia","t":"3–4 h","o":"Szlak po polach bitewnych z okopami i rowami z I wojny światowej, widok na Tre Cime. Dużo informacji o historii frontu dolomickiego.","s":"Klasyki"}],"ds":"Okolice Tre Cime di Lavaredo i jeziora Misurina, serce Dolomitów Sextońskich. Klasyczna pętla wokół trzech turni, schroniska pod ścianami, pola bitewne z I wojny światowej na Monte Piana i iglice Cadini. Dojazd drogą płatną pod Rifugio Auronzo, w sezonie z kolejką do parkingu."},{"id":"h-braies","n":"Lago di Braies","c":"IT","r":"Południowy Tyrol (Dolomity)","y":46.6945,"x":12.0855,"hikes":[{"n":"Lago di Braies dookoła","d":"łatwa","t":"1–1,5 h","o":"Pętla wokół jednego z najsłynniejszych jezior Dolomitów, po lesie. Wczesny ranek omija tłumy i daje najlepsze światło, ale trasa jest krótka i łatwa.","ct":"j"},{"n":"Alta Via 1","d":"trudna","t":"10–12 dni","o":"Klasyczny trekking po Dolomitach, ok. 120 km, zaczyna się nad Lago di Braies i kończy w Belluno. Noclegi w schroniskach, 10–12 dni, z kilkoma bardziej wymagającymi przejściami.","ct":"j"},{"n":"Seekofel","d":"trudna","t":"6–7 h","o":"Wejście nad Lago di Braies na szczyt Seekofel (2810 m), z widokiem na jezioro i okolicę. Trasa jest wymagająca i kamienista, ale technicznie prosta.","s":"Klasyki","ct":"j"},{"n":"Croda del Becco","d":"trudna","t":"6 h","o":"Wymagające wejście nad Lago di Braies na Croda del Becco (2810 m), z widokiem na Seekofel i Tre Cime. Dla doświadczonych, z odcinkami po osypisku.","s":"Klasyki"}],"ds":"Jezioro Braies (Pragser Wildsee) w Dolomitach Sextenu, o szmaragdowej wodzie i drewnianych łódkach. Z niego startuje Alta Via 1."},{"id":"h-alpe-di-siusi","n":"Alpe di Siusi","c":"IT","r":"Południowy Tyrol (Dolomity)","y":46.54,"x":11.62,"hikes":[{"n":"Alpe di Siusi – Rifugio Zallinger","d":"łatwa","t":"2–3 h","o":"Rozległe łąki z widokiem na Sassolungo i Sciliar, spokojna trasa dla rodzin. Najładniejsza wiosną i jesienią, w lecie wygodna przy upale."},{"n":"Dookoła Sassolungo","d":"średnia","t":"5–6 h","o":"Wędrówka wokół masywu Sassolungo (Langkofel), z przełęczami i widokami na Val Gardena. Zajmuje cały dzień, ale nie jest techniczna."},{"n":"Schlern – Santner Steig","d":"trudna","t":"6–7 h","o":"Wysokogórska trasa z ekspozycją na masyw Schlern (Sciliar), z fragmentami ubezpieczonymi linami. Dla osób z doświadczeniem, z widokiem na Alpe di Siusi.","s":"Klasyki"},{"n":"Compatsch – Saltria","d":"łatwa","t":"2–3 h","o":"Spokojne przejście przez największą górską łąkę Europy, z widokiem na Sciliar i Sassolungo. Dobre w każdej pogodzie, bez trudności.","s":"Klasyki"}],"ds":"Największa wysokogórska łąka Europy, z widokiem na masyw Sciliar i Sassolungo. Dobre miejsce na spokojne spacery i rodzinne trasy."},{"id":"h-seceda","n":"Ortisei i Seceda","c":"IT","r":"Południowy Tyrol (Dolomity)","y":46.605,"x":11.726,"hikes":[{"n":"Seceda: granią","d":"łatwa","t":"2–3 h","o":"Grań w masywie Odle, znana z wielu zdjęć z charakterystyczną skalną ścianą opadającą ku dolinie. Idzie się wśród turni i łąk, można dojechać kolejką z Ortisei."},{"n":"Seceda – Troier Hütte","d":"średnia","t":"3–4 h","o":"Szlak grzbietowy z widokiem na Odle (Geisler), kończący się przy schronisku. Spokojniejsza wersja po drugiej stronie Seceda niż tłoczny punkt widokowy.","s":"Klasyki"},{"n":"Puez – Odle","d":"średnia","t":"5–6 h","o":"Wędrówka pod grupą Odle, po wysokich płaskowyżach Puez-Odle. Dobre widoki, mniej ludzi niż przy Seceda, ale dłuższy i bardziej górski dzień.","s":"Klasyki"}],"ds":"Grań Seceda w grupie Odle w Dolomitach Val Gardena, z poszarpanymi iglicami nad zielonymi łąkami. Wjazd kolejką z Ortisei."},{"id":"h-val-di-funes","n":"Val di Funes","c":"IT","r":"Południowy Tyrol (Dolomity)","y":46.634,"x":11.723,"hikes":[{"n":"Adolf-Munkel-Weg","d":"średnia","t":"3–4 h","o":"Szlak u stóp ścian Odle, z widokiem na grupę Geisler, prowadzący przez las i łąki. Łatwa i spokojna trasa z Zannser Alm."},{"n":"Santa Maddalena – Kirchsteig","d":"łatwa","t":"1–1.5 h","o":"Spacer z widokiem na kościółek Santa Maddalena na tle Odle, jeden z najbardziej fotogenicznych widoków Dolomitów. Krótki i bardzo łatwy, najlepszy o wschodzie słońca.","s":"Klasyki"}],"ds":"Dolina z kościółkiem Santa Maddalena na tle ścian Odle, jedno z najczęściej fotografowanych miejsc w Dolomitach. Spokojniejsza od sąsiednich dolin."},{"id":"h-courmayeur","n":"Courmayeur","c":"IT","r":"Dolina Aosty","y":45.797,"x":6.9686,"hikes":[{"n":"Rifugio Bonatti (Val Ferret)","d":"średnia","t":"4–6 h","o":"Szlak w stronę Mont Blanc przez Val Ferret, częsty fragment Tour du Mont Blanc."},{"n":"Rifugio Elena","d":"średnia","t":"3–4 h","o":"Szlak pod lodowiec Pré de Bar, w Val Ferret. Widoki na Mont Blanc po włoskiej stronie.","s":"Klasyki"},{"n":"Lago di Combal","d":"łatwa","t":"1.5–2 h","o":"Spacer przez Val Veny do jeziora Combal, pod lodowcem Miage. Spokojne łąki i widoki na Mont Blanc.","s":"Klasyki"},{"n":"Tour du Mont Blanc (etap włoski)","d":"trudna","t":"1–2 dni","o":"Włoski odcinek klasycznej pętli wokół Mont Blanc, zwykle z noclegiem w schronisku.","s":"Klasyki"}],"ds":"Miasto u stóp Mont Blanc po włoskiej stronie, w Dolinie Aosty. Dostęp do Val Veny, Val Ferret i tras Tour du Mont Blanc."},{"id":"h-cinque-terre","n":"Cinque Terre","c":"IT","r":"Liguria","y":44.127,"x":9.709,"hikes":[{"n":"Monterosso – Vernazza (Sentiero Azzurro)","d":"średnia","t":"1,5–2 h","o":"Najpopularniejszy odcinek Błękitnej Ścieżki, z widokami na morze i tarasy winnic. Wstęp na szlak jest płatny."},{"n":"Sentiero Rosso – Levanto – Monterosso","d":"średnia","t":"4–5 h","o":"Widokowa trasa wzdłuż wybrzeża, mniej uczęszczana niż Azzurro. Dłuższa, z podejściami.","s":"Klasyki"},{"n":"Vernazza – Corniglia (Sentiero Azzurro)","d":"średnia","t":"2–3 h","o":"Odcinek ze schodami nad morzem; w sezonie wymagany bilet Cinque Terre Card.","s":"Klasyki"}],"ds":"Pięć kolorowych wsi na klifach Liguryjskiego wybrzeża, wpisanych na listę UNESCO. Szlaki łączą je przez tarasy winnic i morskie skały."},{"id":"h-bled","n":"Bled","c":"SI","r":"Gorenjska","y":46.3683,"x":14.1146,"hikes":[{"n":"Wąwóz Vintgar","d":"łatwa","t":"1,5–2 h","o":"Wąwóz o długości ok. 1,6 km z drewnianymi pomostami nad turkusową rzeką Radovną, kończący się wodospadem Šum. Wstęp jest płatny, a trasa zwykle zamknięta zimą.","ct":"k"},{"n":"Ojstrica i Mala Osojnica","d":"łatwa","t":"1–1,5 h","o":"Dwa krótkie podejścia na punkty widokowe nad jeziorem Bled, z widokiem na wyspę z kościołem i na Alpy Julijskie. Ścieżki są strome, ale krótkie.","ct":"j"},{"n":"Pokljuka – jezioro Zeleni Rob","d":"łatwa","t":"2–3 h","o":"Spokojna trasa przez płaskowyż Pokljuka, wśród lasów świerkowych i torfowisk. Jeziorko Zeleni Rob to cichy cel spaceru.","s":"Klasyki","ct":"j"}],"ds":"Bled to znane jezioro polodowcowe w Alpach Julijskich, z wyspą i kościołem na środku oraz zamkiem na skale. W okolicy są wąwóz Vintgar i punkty widokowe. Najlepiej wcześnie rano, bo w sezonie bywa tłoczno."},{"id":"h-bohinj","n":"Bohinj","c":"SI","r":"Gorenjska (Triglav)","y":46.286,"x":13.887,"hikes":[{"n":"Wodospad Savica","d":"łatwa","t":"1–1,5 h","o":"Krótki szlak od parkingu do wodospadu Savica, źródła rzeki Sawy Bohinjki, który spada ok. 60 m. Trasa ma kilkaset schodów.","ct":"w"},{"n":"Triglav (2864 m)","d":"trudna","t":"2 dni","o":"Najwyższy szczyt Słowenii, wymaga doświadczenia i sprzętu do zabezpieczeń.","ct":"j"},{"n":"Dolina Siedmiu Jezior Triglavskich","d":"średnia","t":"6–8 h","o":"Najsłynniejszy szlak Alp Julijskich, z Bohinja przez jeziora.","s":"Klasyki","ct":"j"},{"n":"Vogel – Šija","d":"średnia","t":"3–4 h","o":"Szlak z górnej stacji kolejki Vogel na widokowy grzbiet, z panoramą Triglavu i jeziora Bohinj. Fragmenty są strome, a pogoda zmienia się szybko.","s":"Klasyki","ct":"j"},{"n":"Mostnica – wąwóz","d":"łatwa","t":"1.5–2 h","o":"Spacer wąwozem rzeki Mostnicy do wodospadu Slap Mostnice, obok kamiennego mostu w Stara Fužina. Łatwa trasa, dobra na pół dnia.","s":"Klasyki","ct":"k"}],"ds":"Bohinj to największe jezioro Słowenii, w sercu Parku Narodowego Triglav. Okolica słynie z wodospadu Savica, kolejki na Vogel i szlaków w stronę Triglavu. Spokojniejsza od Bled, dobra na kilka dni wędrówek."},{"id":"h-zakopane","n":"Zakopane (Tatry)","c":"PL","r":"Małopolska","y":49.2992,"x":19.9496,"hikes":[{"n":"Morskie Oko","d":"łatwa","t":"4–5 h","o":"Najpopularniejszy szlak w Tatrach, ok. 9 km w jedną stronę asfaltową drogą do jeziora.","s":"Klasyki","sk":"Schronisko PTTK nad Morskim Okiem"},{"n":"Dolina Kościeliska","d":"łatwa","t":"3–4 h","o":"Najpopularniejsza dolina Tatr Zachodnich: szeroką drogą idzie się obok Wąwozu Kraków i jaskiń, m.in. Mroźnej i Mylnej, do schroniska na Hali Ornak. Nadaje się na każdą pogodę i dla dzieci, zimą bywa lodowo.","s":"Klasyki","sk":"Schronisko na Hali Ornak"},{"n":"Rysy","d":"trudna","t":"8–10 h","o":"Najwyższy szczyt Polski (2499 m) i jedna z największych tatrzańskich klasyków. Z Morskiego Oka mija się Czarny Staw pod Rysami, a ostatni odcinek to łańcuchy i skalne płyty. Latem wymaga kondycji i wczesnego startu, zimą to wyprawa skiturowa lub wysokogórska.","s":"Klasyki"},{"n":"Kasprowy Wierch (1987 m)","d":"średnia","t":"4–5 h","o":"Z Kuźnic przez Myślenickie Turnie albo Boczań i Halę Gąsienicową; można też wjechać kolejką.","s":"Tatry Zachodnie – szczyty"},{"n":"Kopa Kondracka (2005 m)","d":"średnia","t":"5–6 h","o":"Najbardziej wysunięty na wschód szczyt Czerwonych Wierchów, z Kasprowego lub z Doliny Kondratowej.","s":"Tatry Zachodnie – szczyty"},{"n":"Małołączniak (2096 m)","d":"średnia","t":"5–6 h","o":"Jeden z czterech Czerwonych Wierchów, zielony w lecie, z szeroką granią i widokiem na całe Tatry Zachodnie. Najczęściej łączony z Krzesanicą i Kopą Kondracką.","s":"Tatry Zachodnie – szczyty"},{"n":"Krzesanica (2122 m)","d":"średnia","t":"5–6 h","o":"Najwyższy z Czerwonych Wierchów, szeroka trawiasta grań bez ekspozycji. Z góry widać Giewont, Tatry Wysokie i Dolinę Kościeliską.","s":"Tatry Zachodnie – szczyty"},{"n":"Ciemniak (2096 m)","d":"średnia","t":"5–6 h","o":"Najbardziej wysunięty na zachód z Czerwonych Wierchów, podejście łagodniejsze niż na pozostałe. Dobry początek grani, jeśli idziesz w stronę Krzesanicy.","s":"Tatry Zachodnie – szczyty"},{"n":"Czerwone Wierchy – pętla","d":"średnia","t":"7–8 h","o":"Cały grzbiet: Kopa Kondracka, Małołączniak, Krzesanica, Ciemniak, powrót doliną Kościeliską lub Małej Łąki.","s":"Tatry Zachodnie – szczyty"},{"n":"Wołowiec (2064 m)","d":"średnia","t":"6–7 h","o":"Najłatwiejszy dwutysięcznik, z Doliny Chochołowskiej przez Rakoń; widok na cały Zachód.","s":"Tatry Zachodnie – szczyty","sk":"Schronisko na Polanie Chochołowskiej"},{"n":"Jarząbczy Wierch (2137 m)","d":"średnia","t":"6–7 h","o":"Szczyt Tatr Zachodnich z pięknym widokiem na polską i słowacką stronę. Najłatwiej z Doliny Chochołowskiej przez Rakoń i Wołowiec, to długi dzień.","s":"Tatry Zachodnie – szczyty"},{"n":"Rakoń (1879 m)","d":"średnia","t":"4–5 h","o":"Trawiasty szczyt w Tatrach Zachodnich nad Doliną Chochołowską, niemal zawsze mijany po drodze na Wołowiec. Szeroki widok na Rohacze i Tatry Wysokie.","s":"Tatry Zachodnie – szczyty","sk":"Schronisko na Polanie Chochołowskiej"},{"n":"Grześ (1653 m)","d":"łatwa","t":"3–4 h","o":"Łagodna kopa nad Doliną Chochołowską, najłatwiejszy pewny widok na Tatry Zachodnie.","s":"Tatry Zachodnie – szczyty","sk":"Schronisko na Polanie Chochołowskiej"},{"n":"Kominiarski Wierch (1829 m)","d":"średnia","t":"3–4 h","o":"Wyraźny szczyt nad Doliną Chochołowską, ze stromym podejściem z Wąwozu Kraków lub z Kir. Dobra alternatywa dla tłumów w Dolinie Kościeliskiej.","s":"Tatry Zachodnie – szczyty"},{"n":"Ornak (1854 m)","d":"średnia","t":"4–5 h","o":"Szczyt w Tatrach Zachodnich nad Doliną Ornaczańską, wejście od Hali Ornak. Mniej ludny niż Czerwone Wierchy, z widokiem na Tatry Wysokie.","s":"Tatry Zachodnie – szczyty","sk":"Schronisko na Hali Ornak"},{"n":"Giewont – Wielki (1895 m)","d":"średnia","t":"5–6 h","o":"Z Kuźnic przez Kalatówki albo Doliną Strążyską; ostatni odcinek z łańcuchami.","s":"Tatry Zachodnie – szczyty","sk":"Schronisko na Hali Kondratowej"},{"n":"Kopieniec Wielki (1328 m)","d":"łatwa","t":"2–3 h","o":"Kameralna trasa z Jaszczurówki na szczyt z widokiem na Giewont i Tatry Wysokie. Dobra na pierwszy dzień w Zakopanem lub przy gorszej pogodzie.","s":"Tatry Zachodnie – szczyty"},{"n":"Nosal (1206 m)","d":"łatwa","t":"1–1,5 h","o":"Krótko i stromo na grzbiet nad Zakopanem, z widokiem na Giewont i miasto. Dobry na wieczór po pracy, bez wymagań technicznych.","s":"Tatry Zachodnie – szczyty"},{"n":"Sarnia Skała (1377 m)","d":"łatwa","t":"2–3 h","o":"Skalny szczyt nad Doliną Kościeliską, widok na Giewont i Tatry Zachodnie. Łatwiejsza niż się wydaje, ale kamienista.","s":"Tatry Zachodnie – szczyty"},{"n":"Kozi Wierch (2291 m)","d":"trudna","t":"6–8 h","o":"Najwyższy szczyt całkowicie w Polsce, z Orlą Percią, z Doliny Pięciu Stawów.","s":"Tatry Wysokie – szczyty","sk":"Schronisko w Dolinie Pięciu Stawów"},{"n":"Świnica (2301 m)","d":"trudna","t":"6–7 h","o":"Jeden z najpiękniejszych tatrzańskich szczytów, na końcu ze skalnymi stopniami i łańcuchami. Najczęściej z Kasprowego przez Zawrat lub z Doliny Gąsienicowej. Wymaga doświadczenia i dobrej pogody.","s":"Tatry Wysokie – szczyty"},{"n":"Szpiglasowy Wierch (2172 m)","d":"średnia","t":"6–7 h","o":"Przez Szpiglasową Przełęcz, nad Morskim Okiem, widok na dolinę Pięciu Stawów.","s":"Tatry Wysokie – szczyty","sk":"Schronisko PTTK nad Morskim Okiem"},{"n":"Kościelec (2155 m)","d":"trudna","t":"5–6 h","o":"Czarny szlak, z Hali Gąsienicowej; kilka eksponowanych miejsc, wąska grań.","s":"Tatry Wysokie – szczyty","sk":"Schronisko Murowaniec"},{"n":"Granaty (Skrajny, 2225 m)","d":"trudna","t":"7–8 h","o":"Fragment Orlej Perci z łańcuchami i drabinami, jedna z najtrudniejszych dróg w polskich Tatrach. Dla osób z doświadczeniem i bez lęku wysokości.","s":"Tatry Wysokie – szczyty"},{"n":"Mnich (2068 m)","d":"trudna","t":"6–7 h","o":"Turnia nad Morskim Okiem, bez znakowanego szlaku na szczyt (tylko dla wspinaczy); popularny jako widok ze szlaku do Czarnego Stawu.","s":"Tatry Wysokie – szczyty"},{"n":"Czerwone Wierchy z Doliny Kościeliskiej","d":"średnia","t":"7–9 h","o":"Klasyczna pętla z Kir przez Dolinę Mułową na grań Czerwonych Wierchów i zejście Doliną Kościeliską. Długi dzień, ale bez ekspozycji. Dobra w jasne dni, bo widoki są wszędzie.","s":"Szlaki ikony","sk":"Schronisko na Hali Ornak"},{"n":"Orla Perć (Zawrat – Krzyżne)","d":"trudna","t":"10–12 h","o":"Najtrudniejszy szlak w polskich Tatrach, łańcuchy, drabiny i ekspozycja; nie dla ludzi z lękiem wysokości.","s":"Szlaki ikony","sk":"Schronisko w Dolinie Pięciu Stawów"},{"n":"Zawrat (2159 m)","d":"trudna","t":"5–6 h","o":"Przełęcz między Doliną Gąsienicową a Doliną Pięciu Stawów, z łańcuchami po obu stronach. Latem tłoczna, zimą i wiosną może być lodowo i niebezpiecznie.","s":"Przełęcze"},{"n":"Krzyżne (2112 m)","d":"średnia","t":"7–8 h","o":"Przełęcz na szlaku Doliny Pięciu Stawów do Roztoki, najwyższa przełęcz szlaku turystycznego.","s":"Przełęcze"},{"n":"Świnicka Przełęcz (2051 m)","d":"średnia","t":"5–6 h","o":"Przełęcz między Kasprowym Wierchem a Świnicą, wejście od Zawratu. Szeroki widok na doliny i ściany Orlej Perci.","s":"Przełęcze"},{"n":"Szpiglasowa Przełęcz (2110 m)","d":"średnia","t":"6–7 h","o":"Przejście z Morskiego Oka do Doliny Pięciu Stawów, strome podejście i widok na Morskie Oko z góry. Dobra jako część większej pętli.","s":"Przełęcze"},{"n":"Przełęcz pod Chłopkiem (2307 m)","d":"trudna","t":"8 h","o":"Tylko dla doświadczonych, bardzo eksponowana przełęcz nad Morskim Okiem.","s":"Przełęcze"},{"n":"Hala Gąsienicowa i Murowaniec","d":"łatwa","t":"3–4 h","o":"Przez Boczań z Kuźnic do schroniska, baza dla wypraw na Kościelec i Orlą Perć.","s":"Doliny, stawy, polany i schroniska","sk":"Schronisko Murowaniec"},{"n":"Czarny Staw Gąsienicowy","d":"łatwa","t":"4–5 h","o":"Z Hali Gąsienicowej do jednego z najpiękniejszych stawów w Tatrach, z Kościelcem w tle. Łatwa trasa na cały dzień, ładna też zimą.","s":"Doliny, stawy, polany i schroniska","sk":"Schronisko Murowaniec","ct":"j"},{"n":"Zielony Staw Gąsienicowy","d":"łatwa","t":"3–4 h","o":"Szlak z Hali Gąsienicowej do jeziora pod Kościelcem, krótszy i spokojniejszy niż do Czarnego Stawu. Woda ma tu zielonkawy odcień.","s":"Doliny, stawy, polany i schroniska","sk":"Schronisko Murowaniec","ct":"j"},{"n":"Czarny Staw pod Rysami","d":"średnia","t":"6–7 h","o":"Powyżej Morskiego Oka, ciemne jezioro pod ścianą Mięguszowieckich. Podejście kamiennymi schodami, w lecie tłoczno, wiosną zalega śnieg.","s":"Doliny, stawy, polany i schroniska","sk":"Schronisko PTTK nad Morskim Okiem","ct":"j"},{"n":"Dolina Pięciu Stawów Polskich","d":"średnia","t":"5–6 h","o":"Polodowcowa dolina z pięcioma jeziorami i górskim schroniskiem, ciszej niż w Morskim Oku. Przejście od Morskiego Oka przez Szpiglasową lub z Roztoki.","s":"Doliny, stawy, polany i schroniska","sk":"Schronisko w Dolinie Pięciu Stawów","ct":"j"},{"n":"Wodogrzmoty Mickiewicza i Siklawa","d":"łatwa","t":"3–4 h","o":"Z Palenicy Białczańskiej do wodospadów w Roztoce, w tym Siklawy, najwyższej z tatrzańskich. Szeroka droga, dobra dla rodzin, tylko trochę długa.","s":"Doliny, stawy, polany i schroniska"},{"n":"Hala Gąsienicowa – Dolina Jaworzynki","d":"średnia","t":"5–6 h","o":"Zejście od schroniska Murowaniec do Kuźnic doliną Jaworzynki. Mniej uczęszczane niż Boczań, z widokami na Giewont.","s":"Doliny, stawy, polany i schroniska","sk":"Schronisko Murowaniec"},{"n":"Dolina Chochołowska","d":"łatwa","t":"3–4 h","o":"Szeroka, łagodna dolina z Polaną Chochołowską i schroniskiem. W marcu i kwietniu pokrywają ją krokusy, co przyciąga tłumy. Dobra na rodzinny wypad.","s":"Doliny, stawy, polany i schroniska","sk":"Schronisko na Polanie Chochołowskiej"},{"n":"Dolina Strążyska i Siklawica","d":"łatwa","t":"2–3 h","o":"Pętla przez wodospad Siklawica; często zaczyna się wejście na Giewont.","s":"Doliny, stawy, polany i schroniska"},{"n":"Dolina Małej Łąki i Przysłop Miętusi","d":"średnia","t":"4–5 h","o":"Klasyczna trasa od Doliny Kościeliskiej na Czerwone Wierchy przez Dolinę Małej Łąki i Przysłop Miętusi. Dobre widoki na Tatry Zachodnie.","s":"Doliny, stawy, polany i schroniska"},{"n":"Hala Kondratowa i Giewont","d":"średnia","t":"4–5 h","o":"Z Kuźnic i Kalatówek przez Dolinę Kondratową do schroniska, potem dalej na Giewont ze słynnym krzyżem. Dobry szlak na cały dzień.","s":"Doliny, stawy, polany i schroniska","sk":"Schronisko na Hali Kondratowej"},{"n":"Rusinowa Polana i Gęsia Szyja","d":"łatwa","t":"2–3 h","o":"Polana z widokiem na Tatry Wysokie, kaplica w Wiktorówkach i Gęsia Szyja. Dobre dla rodzin, szczególnie o zachodzie słońca.","s":"Doliny, stawy, polany i schroniska"},{"n":"Zawrat – Dolina Gąsienicowa – Pięć Stawów","d":"trudna","t":"8–10 h","o":"Przejście przez Zawrat między dwiema dolinami, z łańcuchami i ekspozycją. Piękna trasa, ale dla osób obeznanych.","s":"Szlaki ikony","ct":"j"},{"n":"Dolina Kościeliska – Smreczyński Staw","d":"średnia","t":"3–4 h","o":"Doliną Kościeliską do jednego z najpiękniejszych stawów Tatr Zachodnich.","s":"Klasyki"},{"n":"Dolina Chochołowska i Rakoń","d":"średnia","t":"5–6 h","o":"Szlak doliną z Polaną Chochołowską i dalej na Rakoń, pierwszy duży szczyt Tatr Zachodnich. Dobra opcja na jasny dzień.","s":"Klasyki"}],"ds":"Stolica Tatr Polskich i najwięcej szlaków w Polsce: Morskie Oko, Giewont, Kasprowy Wierch, Dolina Kościeliska i wiele innych. Szlaki od spacerów po trasy z łańcuchami."},{"id":"h-szczyrk","n":"Szczyrk","c":"PL","r":"Śląsk (Beskidy)","y":49.716,"x":19.03,"hikes":[{"n":"Skrzyczne","d":"średnia","t":"3–4 h","o":"Najwyższy szczyt Beskidu Śląskiego z widokiem na Beskidy i, przy dobrej pogodzie, Tatry.","sk":"Schronisko PTTK Skrzyczne"},{"n":"Klimczok (1117 m)","d":"średnia","t":"3–4 h","o":"Z Szyndzielni lub Szczyrku na szczyt z szerokim widokiem na Beskid Śląski.","s":"Klasyki"},{"n":"Barania Góra (1220 m)","d":"średnia","t":"3–4 h","o":"Najwyższy szczyt Beskidu Śląskiego, na zboczach źródła Białej i Czarnej Wisełki, które dają początek Wiśle. Łatwe podejście, wieża widokowa.","s":"Klasyki"},{"n":"Malinowska Skała (1152 m)","d":"średnia","t":"2–3 h","o":"Skalny punkt widokowy nad Szczyrkiem, dojście od Malinowa. Dobry widok na Beskid Śląski i Żywiecki.","s":"Klasyki"}],"ds":"Miasto w Beskidzie Śląskim ze szlakami na Skrzyczne (1257 m), najwyższy szczyt pasma, i Klimczok. Zimą duży ośrodek narciarski."},{"id":"h-zawoja","n":"Zawoja (Babia Góra)","c":"PL","r":"Małopolska","y":49.615,"x":19.533,"hikes":[{"n":"Babia Góra z Krowiarek","d":"średnia","t":"4–5 h","o":"Podejście na Diablak (1725 m) od strony Krowiarek, mniej tłoczne niż z Zawoi. Wysoko ponad lasem krajobraz jest alpejski, a pogoda zmienia się szybko."},{"n":"Babia Góra – Markowe Szczawiny","d":"średnia","t":"5–6 h","o":"Najpopularniejsza droga na Diablak z Zawoi przez schronisko Markowe Szczawiny, ok. 5 godzin w obie strony. Szczyt jest najwyższy w Beskidach polskich.","s":"Klasyki"},{"n":"Babia Góra – Perć Akademików","d":"trudna","t":"5–6 h","o":"Wymagający wariant z ubezpieczeniami; bez doświadczenia lepiej unikać.","s":"Klasyki"}],"ds":"Wieś u podnóża Babiej Góry (1725 m), jednej z najwyższych gór Polski poza Tatrami. Szlak na Diablak ma ostre zmiany pogody i wiatr."},{"id":"h-karpacz","n":"Karpacz (Karkonosze)","c":"PL","r":"Dolny Śląsk","y":50.778,"x":15.75,"hikes":[{"n":"Śnieżka","d":"średnia","t":"4–5 h","o":"Najwyższy szczyt Karkonoszy (1603 m), z charakterystyczną kaplicą św. Wawrzyńca i obserwatorium. Z Karpacza przez Strzechę Akademicką, w dobrą pogodę widać Czechy i Śląsk.","s":"Klasyki","sk":"Schronisko Dom Śląski"},{"n":"Samotnia i Mały Staw","d":"łatwa","t":"3–4 h","o":"Szlak z Karpacza do schroniska Samotnia nad Małym Stawem, polodowcowym jeziorem w kotle. Łatwy, ale końcówka stroma.","s":"Szlaki","sk":"Schronisko Samotnia","ct":"j"},{"n":"Wodospad Kamieńczyka (Szklarska Poręba)","d":"łatwa","t":"1–1,5 h","o":"Najwyższy wodospad w polskich Sudetach, ok. 27 m, w zacienionym wąwozie, z platformą widokową. Krótka, szybka trasa, ale zimą lodowata.","s":"Szlaki","ct":"w"},{"n":"Szrenica (1362 m)","d":"średnia","t":"4–5 h","o":"Z Szklarskiej Poręby na szczyt w zachodnich Karkonoszach, z widokiem na Śnieżne Kotły i Czechy. Można wjechać wyciągiem.","s":"Szczyty","sk":"Schronisko na Hali Szrenickiej"},{"n":"Śnieżne Kotły","d":"średnia","t":"5–6 h","o":"Polodowcowe kotły ze skalnymi ścianami, widoczne z grani Karkonoszy, popularne wśród wspinaczy. Szlak z Szrenicy, widoki szerokie.","s":"Szlaki"},{"n":"Czarny Kocioł Jagniątkowski","d":"średnia","t":"2–3 h","o":"Polodowcowy kocioł nad Jagniątkowem, spokojniejszy odpowiednik Śnieżnych Kotłów. Trasa leśna, widoki na końcu.","s":"Klasyki"},{"n":"Wielki Szyszak (1509 m)","d":"średnia","t":"4–5 h","o":"Szczyt w Karkonoszach z szerokim widokiem na Czechy, na szlaku granicznym. Kamienista grań, często wietrznie.","s":"Klasyki"},{"n":"Karkonosze – Główny Szlak Sudecki","d":"trudna","t":"1–2 dni","o":"Fragment słynnej trasy grzbietowej od Szklarskiej Poręby do Karpacza, kilka dni na grani. Dużo widoków, ale pogoda w Karkonoszach jest zmienna.","s":"Klasyki"},{"n":"Szklarska Poręba – Kamieńczyk – Szrenica","d":"średnia","t":"4–5 h","o":"Pętla przez wodospad Kamieńczyka i schronisko na Hali Szrenickiej. Połączenie krótkiej atrakcji z prawdziwą górską trasą.","s":"Klasyki"}],"ds":"Karpacz i okolice Śnieżki (1603 m), najwyższej góry Karkonoszy, z Kotłem Małego Stawu i Wang. Dużo szlaków na grani z widokiem na Czechy."},{"id":"h-pec","n":"Pec pod Sněžkou","c":"CZ","r":"Kralovéhradecký kraj","y":50.686,"x":15.738,"hikes":[{"n":"Sněžka z Pece pod Sněžkou","d":"średnia","t":"3–4 h","o":"Podejście na najwyższy szczyt Karkonoszy od czeskiej strony."}]},{"id":"h-bieszczady","n":"Bieszczady (Wetlina)","c":"PL","r":"Podkarpacie","y":49.15,"x":22.5,"hikes":[{"n":"Połonina Wetlińska","d":"średnia","t":"3–5 h","o":"Grzbietowa wędrówka po połoninie z widokiem na całe Bieszczady, ze schroniskiem Chatka Puchatka. W dobrą pogodę widać ukraińskie Karpaty.","sk":"Schronisko Chatka Puchatka"},{"n":"Tarnica","d":"średnia","t":"3–4 h","o":"Najwyższy szczyt polskich Bieszczadów (1346 m), start w Wołosatem. Podejście łagodne, a z góry widać połoniny i Ukrainę.","ct":"j"},{"n":"Połonina Caryńska","d":"średnia","t":"3–4 h","o":"Widokowa połonina z Berehy Górnych, jedna z najbardziej uczęszczanych tras Bieszczad.","s":"Klasyki"},{"n":"Wielka Rawka (1307 m)","d":"średnia","t":"3–4 h","o":"Szczyt na granicy z Ukrainą i Słowacją, z panoramą połonin i dzikich lasów. Dłuższe podejście z Ustrzyk Górnych.","s":"Klasyki"},{"n":"Smerek (1222 m)","d":"średnia","t":"3–4 h","o":"Szczyt nad Smereczem z szeroką panoramą doliny Wetlinki, na szlaku z Przełęczy Orłowicza. Wygodny jako pętla z Wetliny.","s":"Klasyki"},{"n":"Halicz (1333 m)","d":"średnia","t":"4–5 h","o":"Szlak z Przełęczy Bukowskiej z widokiem na Połoninę Bukowską i Rozsypaniec. Bardziej odludny niż Tarnica.","s":"Klasyki"},{"n":"Jeziorka Duszatyńskie","d":"łatwa","t":"1.5–2 h","o":"Spacer do osuwiskowych jeziorek w lesie, powstałych w 1907 r. po osuwisku. Spokojna, krótka trasa, dobra po deszczu.","s":"Klasyki","ct":"j"},{"n":"Krzemień (1335 m)","d":"średnia","t":"4–5 h","o":"Szlak graniczny z szerokim widokiem na Ukrainę i Bieszczady Zachodnie. Dłuższy dzień, ale mało ludzi.","s":"Klasyki"}],"ds":"Wetlina i okolice z połoninami: Połoniną Wetlińską i Caryńską. Rozległe widoki ponad granicą lasu, mało ludzi poza sezonem."},{"id":"h-strbske","n":"Štrbské Pleso (Tatry Wysokie)","c":"SK","r":"Preszów","y":49.119,"x":20.063,"hikes":[{"n":"Popradské pleso","d":"łatwa","t":"2–3 h","o":"Jezioro polodowcowe na wysokości ok. 1500 m pod Mięguszowieckim Szczytem. Szlak ze Szczyrbskiego Jeziora jest łatwy i szeroki, a nad jeziorem stoi schronisko. Widok na Tatry Wysokie jest świetny przy dobrej pogodzie.","s":"Klasyki"},{"n":"Rysy ze strony słowackiej","d":"trudna","t":"7–9 h","o":"Najwyższy szczyt Polski od słowackiej strony, dłuższe podejście.","s":"Klasyki"},{"n":"Krywań (2494 m)","d":"trudna","t":"7–9 h","o":"Symbol Słowacji, szlak z Szczyrbskiego Jeziora przez Jamskie Pleso i Jamska Przełęcz.","s":"Szczyty"},{"n":"Predné Solisko (2093 m)","d":"średnia","t":"3–4 h","o":"Najłatwiejszy dwutysięcznik w Wysokich Tatrach, widok na Krywań i Szczyrbskie Pleso.","s":"Szczyty"},{"n":"Hincowe plesá (Hińczowe Stawy)","d":"średnia","t":"4–6 h","o":"Dalej i wyżej od Popradskiego Plesa: szlak przez Dolinę Mięguszowiecką do Hińczowych Stawów, z widokiem na Mięguszowiecki Szczyt. Podejście jest dość strome, a późną wiosną może leżeć śnieg.","s":"Doliny i stawy","ct":"j"},{"n":"Symboliczny cmentarz i Popradskie Pleso","d":"łatwa","t":"2 h","o":"Cmentarz ofiar gór nad Popradskim Plesem, krótko od Štrbskeho Plesa.","s":"Doliny i stawy"},{"n":"Szczyrbskie Jezioro – wokół","d":"łatwa","t":"1–2 h","o":"Spokojny spacer wokół jeziora Szczyrbskie Pleso i po miasteczku, obok skoczni narciarskich. Dobre na krótki, łatwy dzień lub gdy pogoda w górze jest zła.","s":"Doliny i stawy","ct":"j"}],"ds":"Szczyrbskie Jezioro (Štrbské Pleso) to górska miejscowość na ok. 1350 m, w sercu Tatr Wysokich po słowackiej stronie. Stąd startują szlaki do Popradskiego Plesa i Hińczowych Stawów. Kolejką można wjechać wyżej. Sezon pieszy trwa mniej więcej od czerwca do października, a zimą jest tu ośrodek narciarski."},{"id":"h-ordesa","n":"Torla (Ordesa)","c":"ES","r":"Aragonia (Pireneje)","y":42.637,"x":-0.105,"hikes":[{"n":"Cola de Caballo","d":"średnia","t":"6–7 h","o":"Dolina Ordesa z wodospadami, klasyczna trasa do Cola de Caballo."},{"n":"Faja de Pelay","d":"średnia","t":"5–6 h","o":"Półka skalna wysoko nad doliną Arazas, z widokami na całą dolinę Ordesa i jej wodospady. Część ścieżki biegnie wąskimi półkami nad urwiskiem, więc nie jest to trasa dla osób z lękiem wysokości. Dobra na dłuższy dzień w dobrej pogodzie.","s":"Klasyki"},{"n":"Circo de Soaso","d":"łatwa","t":"2.5–3.5 h","o":"Prosta i płaska trasa dnem doliny Arazas do amfiteatru Soaso. Po drodze mijasz kaskady, a na końcu wysoki wodospad Cola de Caballo. Najbardziej efektowna w czerwcu, gdy topi się śnieg.","s":"Klasyki"}],"ds":"Park Narodowy Ordesa y Monte Perdido w hiszpańskich Pirenejach (wpis UNESCO), z wąwozem o pionowych ścianach do 1000 m i wodospadami. Bazą jest wioska Torla, a trasy zaczynają się z doliny Ordesa. Najlepszy sezon od czerwca do października, w lecie wjazd do doliny jest ograniczony i trzeba dojeżdżać busem."},{"id":"h-cares","n":"Poncebos (Picos de Europa)","c":"ES","r":"Asturia","y":43.253,"x":-4.85,"hikes":[{"n":"Ruta del Cares","d":"średnia","t":"6–7 h","o":"Szlak wąwozem Cares wykutym w skale; ok. 3–4 h w jedną stronę.","ct":"k"},{"n":"Lagos de Covadonga","d":"łatwa","t":"1.5–2 h","o":"Spacer wokół jezior Enol i Ercina w Parku Narodowym Picos de Europa.","s":"Klasyki","ct":"k"}],"ds":"Poncebos to wejście do Parku Narodowego Picos de Europa, wapiennych gór sięgających prawie 2650 m. Najsłynniejszy jest szlak Ruta del Cares przez głęboki wąwóz rzeki Cares do wsi Caín. Pogoda zmienia się tu szybko, a lato i wczesna jesień są najstabilniejsze."},{"id":"h-sierra-nevada","n":"Sierra Nevada","c":"ES","r":"Andaluzja","y":37.054,"x":-3.311,"hikes":[{"n":"Mulhacén (3479 m)","d":"trudna","t":"7–10 h","o":"Najwyższy szczyt kontynentalnej Hiszpanii, na który wchodzi się bez sprzętu wspinaczkowego, najczęściej od strony Hoya del Portillo lub Capileiry. Latem trasa jest długa i gorąca, a wiosną zalega śnieg. Wyruszaj wcześnie rano."},{"n":"Veleta (3396 m)","d":"trudna","t":"5–7 h","o":"Wejście na jeden z najwyższych szczytów Półwyspu Iberyjskiego.","s":"Klasyki"}],"ds":"Sierra Nevada w Andaluzji to park narodowy z Mulhacénem (3479 m), najwyższym szczytem Hiszpanii kontynentalnej. Śnieg zalega do późnej wiosny, a latem warto wyjść wcześnie, bo na wysokości prawie nie ma cienia. Bazą bywają Granada i wioski Alpujarras."},{"id":"h-tlomnica","n":"Tatranská Lomnica (Słowackie Tatry)","c":"SK","r":"Preszów","y":49.165,"x":20.285,"hikes":[{"n":"Lomnický štít (2634 m)","d":"średnia","t":"wjazd kolejką","o":"Dwie kolejki z Tatrzańskiej Łomnicy, widok na Tatry z jednego z najwyższych szczytów.","s":"Szczyty"},{"n":"Skalnaté pleso i Lomnické sedlo","d":"średnia","t":"3–4 h","o":"Szlak z Tatrzańskiej Łomnicy do Skalnatego Plesa i Przełęczy pod Łomnicą.","s":"Doliny i schroniska"},{"n":"Téryho chata (2015 m)","d":"trudna","t":"6–7 h","o":"Najwyżej położone schronisko w Tatrach, szlak Doliną Pięciu Stawów Spiskich.","s":"Doliny i schroniska"},{"n":"Zamkovského chata – Malá Studená dolina","d":"średnia","t":"4–5 h","o":"Szlak z Hrebienka do Zamkovského chaty, wodospady Studenovodskie.","s":"Doliny i schroniska"},{"n":"Zelené pleso (Zielony Staw Kieżmarski)","d":"łatwa","t":"4–5 h","o":"Najpiękniejsze jezioro w Tatrach Bielskich, szlak z Tatrzańskiej Kotliny.","s":"Doliny i schroniska","ct":"j"},{"n":"Hrebienok – Studenovodské vodopády","d":"łatwa","t":"1,5–2 h","o":"Z Starego Smokowca kolejką na Hrebienok (ok. 1280 m), a potem krótkim szlakiem do Studenovodských wodospadów. Łatwa, krótka trasa, z widokiem na Tatry. Na Hrebienku jest też Lodowa Kopuła (Ľadový dóm).","s":"Doliny i schroniska"},{"n":"Slavkovský štít (2452 m)","d":"trudna","t":"8–10 h","o":"Wysoki szczyt Tatr Wysokich nad Doliną Staroleśną. Trasa jest długa i wymaga kondycji oraz doświadczenia w terenie górskim, zwłaszcza w górnej części. Na Słowacji od listopada do połowy czerwca obowiązuje zamknięcie wielu szlaków powyżej schronisk.","s":"Szczyty"},{"n":"Łomnica – Hrebienok – Rainerova chata","d":"średnia","t":"3–4 h","o":"Szlak między Tatrzańską Łomnicą, Hrebienkiem i schroniskiem Rainerova chata. Pozwala spojrzeć na Dolinę Zimnej Wody i Tatry z niższej wysokości. Łatwa do średniej, dobra na pół dnia.","s":"Klasyki"}],"ds":"Tatrzańska Łomnica to baza pod Łomnicę (2634 m), z kolejką linową na szczyt. Z Hrebienka, dokąd jeździ kolejka z Starego Smokowca, wychodzą łatwe szlaki do wodospadów i schronisk. Dobre zarówno na spacery, jak i na wysokogórskie wyprawy."},{"id":"h-zuberec","n":"Zuberec (Roháče)","c":"SK","r":"Żylina","y":49.264,"x":19.618,"hikes":[{"n":"Baníkov (2178 m)","d":"średnia","t":"5–6 h","o":"Szczyt Tatr Zachodnich nad jeziorami Roháčskimi, z widokiem na grań Roháčów. Podejście jest długie, ale techniczne trudności są niewielkie, jeśli pogoda jest dobra.","s":"Szczyty"},{"n":"Roháčske plesá","d":"średnia","t":"5–6 h","o":"Szlak z Zubercu do Roháčskich Plies, jezior w dolinie polodowcowej pod grzbietem Roháčów. Piękna, malownicza trasa o średniej trudności, a nad jeziorami jest schronisko.","s":"Doliny i stawy"},{"n":"Rohacz Ostry (2088 m)","d":"trudna","t":"6–7 h","o":"Granitowy szczyt Roháčów w Tatrach Zachodnich. Trasa jest wymagająca i miejscami eksponowana. Zalecany doświadczony turysta.","s":"Szczyty"},{"n":"Rohacz Płaczliwy (2125 m)","d":"trudna","t":"7 h","o":"Szczyt Roháčów na granicy z Polską, z ekspozycją. Wymaga doświadczenia, pewnego kroku i dobrej pogody. Zwykle zajmuje cały dzień.","s":"Szczyty"},{"n":"Wołowiec z Zubercu","d":"średnia","t":"6–8 h","o":"Wejście od słowackiej strony na Wołowiec, jeden z najwyższych szczytów Tatr Zachodnich, na granicy z Polską. Długa trasa na cały dzień, z widokami na obie strony.","s":"Szczyty"},{"n":"Rohacze – Szlak Główny","d":"trudna","t":"8–10 h","o":"Wysokogórska trasa pod Rohacze, dla doświadczonych, w dobrych warunkach. Jest dłuższa i trudniejsza niż same jeziora Roháčskie.","s":"Klasyki"}],"ds":"Zuberec leży u stóp Tatr Zachodnich, w Dolinie Roháčskiej. Stąd idzie się do jezior Roháčskich i na szczyty Roháčów, a w okolicy jest skansen budownictwa orawskiego. Szlaki są mniej zatłoczone niż w Tatrach Wysokich."},{"id":"h-szczawnica","n":"Szczawnica (Pieniny)","c":"PL","r":"Małopolska","y":49.418,"x":20.511,"hikes":[{"n":"Wąwóz Homole","d":"łatwa","t":"2–3 h","o":"Skalny wąwóz w Małych Pieninach, z wysokimi ścianami i leśnym potokiem. Krótka i widowiskowa trasa, zwłaszcza w letnim upale.","s":"Szlaki","ct":"k"},{"n":"Wysoka (1050 m)","d":"średnia","t":"3–4 h","o":"Najwyższy szczyt Pienin, trasa z Jaworek przez Polanę Przysłop. Z góry widać Tatry, Dunajec i Małe Pieniny.","s":"Szczyty"},{"n":"Przełom Dunajca – spływ i szlak","d":"łatwa","t":"2–3 h","o":"Spływ tratwami przez przełom Dunajca połączony ze spacerem nad rzeką. Klasyczna atrakcja Pienin, dobra dla rodzin.","s":"Szlaki"},{"n":"Pieniny – Czerwony Klasztor – Trzy Korony","d":"średnia","t":"4–5 h","o":"Pętla przez granicę z widokiem na Dunajec i Trzy Korony (982 m), ostatnie metry po schodach. Jedna z najpiękniejszych tras Pienin.","s":"Klasyki","ct":"k"},{"n":"Przełom Dunajca – ścieżka","d":"łatwa","t":"2–3 h","o":"Spacer wzdłuż rzeki w głębokim wąwozie, bez wymagań. Najładniejszy przy niskim słońcu rano lub wieczorem.","s":"Klasyki"}],"ds":"Uzdrowisko u stóp Pienin z Trzema Koronami i Sokolicą. Przełom Dunajca i spływy tratwami są częścią wyprawy."},{"id":"h-klodzko","n":"Kotlina Kłodzka (Szczeliniec, Śnieżnik)","c":"PL","r":"Dolny Śląsk","y":50.485,"x":16.37,"hikes":[{"n":"Szczeliniec Wielki (919 m)","d":"łatwa","t":"2–3 h","o":"Skalne labirynty Gór Stołowych, ok. 600 stopni, z wąskimi szczelinami i punktem widokowym nad Kotliną Kłodzką. Dobry w deszczowy dzień, bo skały dają schronienie.","s":"Góry Stołowe","sk":"Schronisko na Szczelińcu Wielkim"},{"n":"Błędne Skały","d":"łatwa","t":"1–1,5 h","o":"Skalne miasto z wąskimi szczelinami, w którym łatwo się zgubić, i krótką, łatwą trasą dla rodzin. Kręcono tu sceny Opowieści z Narnii.","s":"Góry Stołowe","ct":"k","fm":["nar"]},{"n":"Śnieżnik (1425 m)","d":"średnia","t":"4–5 h","o":"Najwyższy szczyt Masywu Śnieżnika, z Międzygórza lub Kamienicy. Widok na Sudety, w tym Karkonosze, w dobrą pogodę.","s":"Szczyty","sk":"Schronisko Na Śnieżniku"},{"n":"Szczeliniec – Błędne Skały – Radkowskie Skały","d":"średnia","t":"5–6 h","o":"Dłuższa pętla po Górach Stołowych łącząca dwa najsłynniejsze skalne labirynty z Radkowskimi Skałami. Warto zacząć wcześnie.","s":"Góry Stołowe","ct":"k"},{"n":"Góry Bystrzyckie – Jagodna","d":"średnia","t":"3–4 h","o":"Szczyt Korony Gór Polski z wieżą widokową, mało uczęszczany. Dobre miejsce na spokojną wycieczkę po Sudetach.","s":"Klasyki"}],"ds":"Kotlina Kłodzka z Szczelińcem Wielkim i Błędnymi Skałami w Górach Stołowych oraz Śnieżnikiem. Skalne miasta i labirynty szczelin.","fl":{"nar":"Błędne Skały"}},{"id":"h-rabka","n":"Gorce, Beskid Wyspowy (Turbacz)","c":"PL","r":"Małopolska","y":49.56,"x":20.05,"hikes":[{"n":"Turbacz (1310 m)","d":"średnia","t":"4–5 h","o":"Najwyższy szczyt Gorców, z Nowego Targu lub Rabki-Zdrój. Na grzbiecie jest schronisko, widok na Tatry i Beskidy.","s":"Szczyty","sk":"Schronisko PTTK na Turbaczu"},{"n":"Mogielica (1171 m)","d":"średnia","t":"3–4 h","o":"Najwyższy szczyt Beskidu Wyspowego z wieżą widokową, z której widać Tatry i Beskidy. Bardzo spokojna trasa.","s":"Szczyty"},{"n":"Radziejowa (1262 m)","d":"średnia","t":"4–5 h","o":"Najwyższy szczyt Beskidu Sądeckiego, z wieżą widokową i szerokim widokiem na Tatry. Łagodne podejście od Rytra.","s":"Szczyty"},{"n":"Lubań (1225 m)","d":"średnia","t":"3–4 h","o":"Widokowy szczyt Gorców nad Krościenkiem, z wieżą i widokiem na Pieniny i Tatry. Krótszy odpowiednik Turbacza.","s":"Szczyty"},{"n":"Kudłoń (1274 m)","d":"średnia","t":"3–4 h","o":"Szczyt w Gorcach z widokiem na Tatry i Pieniny, na trasie z Przełęczy Gorc. Spokojne, leśne podejście.","s":"Klasyki"},{"n":"Gorc (1228 m)","d":"średnia","t":"3–4 h","o":"Szczyt Gorców z wieżą widokową, z widokiem na Tatry. Prosta trasa, dobra na jeden dzień.","s":"Klasyki"},{"n":"Turbacz z Nowego Targu","d":"średnia","t":"4–5 h","o":"Wejście na najwyższy szczyt Gorców z drugiej strony pasma, przez Polanę Wyrobki. Dłuższa, spokojniejsza wersja szlaku.","s":"Klasyki"}],"ds":"Gorce z Turbaczem (1310 m) i Beskid Wyspowy. Łagodniejsze góry z polanami i widokami na Tatry, popularne wśród osób szukających spokoju."},{"id":"h-pilsko","n":"Pilsko i Beskid Żywiecki","c":"PL","r":"Śląsk","y":49.53,"x":19.33,"hikes":[{"n":"Pilsko (1557 m)","d":"średnia","t":"4–5 h","o":"Drugi szczyt Beskidu Żywieckiego, pojawia się przy granicy ze Słowacją.","s":"Szczyty","sk":"Schronisko na Hali Miziowej"},{"n":"Hala Miziowa","d":"łatwa","t":"2–3 h","o":"Schronisko pod Pilskiem i początek szlaków na Pilsko, łatwy dojazd z Korbielowa. Polana z widokiem na Beskid Żywiecki.","s":"Szlaki","sk":"Schronisko na Hali Miziowej"},{"n":"Rysianka (1322 m)","d":"średnia","t":"4 h","o":"Hala Rysianka z widokiem na Tatry, ze schroniskiem. Jedna z najładniejszych hal Beskidu Żywieckiego.","s":"Szczyty","sk":"Schronisko na Hali Rysiance"},{"n":"Hala Rysianka – Romanka","d":"średnia","t":"4–5 h","o":"Trasa po jednych z najładniejszych hal w Beskidzie Żywieckim, z Romanką (1366 m). Dużo widoków, mało technicznie.","s":"Klasyki"}],"ds":"Pilsko (1557 m) i Beskid Żywiecki, drugi po Babiej Górze masyw w tej części Beskidów. Widoki na Tatry z polan szczytowych."},{"id":"h-slezanie","n":"Ślęża i Łysica (Korona Gór Polski)","c":"PL","r":"Dolny Śląsk / Świętokrzyskie","y":50.77,"x":16.7,"hikes":[{"n":"Ślęża (718 m)","d":"łatwa","t":"2–3 h","o":"Święta góra Dolnego Śląska, z pozostałościami kultu pogańskiego i schroniskiem na szczycie. Wyraźnie wznosi się nad równiną.","s":"Korona Gór Polski"},{"n":"Łysica (614 m)","d":"łatwa","t":"2–3 h","o":"Najwyższy szczyt Gór Świętokrzyskich, ze Świętym Krzyżem i klasztorem na sąsiedniej górze. Łatwa trasa, ładna jesienią.","s":"Korona Gór Polski"},{"n":"Skopiec (724 m)","d":"łatwa","t":"2–3 h","o":"Najwyższy szczyt Gór Kaczawskich, wieża widokowa i szeroki widok. Dobre, spokojne podejście.","s":"Korona Gór Polski"},{"n":"Orlica (1084 m)","d":"średnia","t":"3–4 h","o":"Najwyższy szczyt Gór Orlickich, na granicy z Czechami, ze schroniskiem i wieżą widokową. Bardziej odludna część Sudetów.","s":"Korona Gór Polski"},{"n":"Ślęża z Sobótki","d":"łatwa","t":"2–3 h","o":"Najpopularniejsze wejście na Ślężę z miasteczka, ok. 2 h pod górę. Po drodze rzeźby i kamienne figury z czasów pradawnych.","s":"Klasyki"}],"ds":"Ślęża i Łysica, dwa symbole Korony Gór Polski w niższych pasmach. Krótsze trasy, ale z ciekawą historią kultu i skałami."},{"id":"h-alpstein","n":"Appenzell / Alpstein","c":"CH","r":"Appenzell","y":47.282,"x":9.4,"hikes":[{"n":"Saxer Lücke","d":"łatwa","t":"2–3 h","o":"Skalna szczelina z widokiem na Alpstein; z kolejki Staubern ok. 1 h. Pod nią leży głęboka dolina Fälensee.","s":"Alpstein"},{"n":"Hoher Kasten – Saxer Lücke – Fälensee","d":"średnia","t":"5–6 h","o":"Pętla od kolejki z Brülisau przez Hoher Kasten, Saxer Lücke do jeziora Fälensee. Ze szczytu widać Jezioro Bodeńskie i Alpy.","s":"Alpstein"},{"n":"Seealpsee i Ebenalp","d":"łatwa","t":"3–4 h","o":"Jezioro Seealpsee w głębi doliny i jaskinia Wildkirchli, w której dawniej mieszkali pustelnicy. Całość da się zrobić z kolejką na Ebenalp.","s":"Alpstein"},{"n":"Säntis (2502 m)","d":"średnia","t":"wjazd lub 6–7 h","o":"Najwyższy szczyt Alpsteinu, widać z niego sześć krajów w pogodny dzień. Można wjechać kolejką albo wejść pieszo ze Schwägalp.","s":"Alpstein"},{"n":"Schäfler Ridge – Äscher Gasthaus","d":"średnia","t":"3–4 h","o":"Grań Schäfler z Gasthaus Aescher, schroniskiem wbudowanym w skalną ścianę. Zdjęcie stąd stało się symbolem Appenzell.","s":"Alpstein"},{"n":"Hundstein – Meglisalp","d":"średnia","t":"5–6 h","o":"Szlak do Meglisalp, wsi bez dróg, z kościółkiem i schroniskiem w sercu Alpsteinu. Przechodzisz przez wysokie przełęcze.","s":"Alpstein"}],"ds":"Pasmo Alpstein z Säntisem (2502 m), tradycyjną wsią Appenzell i jeziorami Seealpsee i Fälensee. Klimat bardziej pasterski niż wysokogórski."},{"id":"h-melchsee","n":"Melchsee-Frutt","c":"CH","r":"Obwalden","y":46.782,"x":8.287,"hikes":[{"n":"Vier-Seen-Wanderung (cztery jeziora)","d":"średnia","t":"4–5 h","o":"Najpopularniejsza trasa, ok. 14,8 km, wokół Melchsee, Tannensee, Blausee i Engstlensee.","s":"Melchsee-Frutt","ct":"j"},{"n":"Hochstollen Loop","d":"trudna","t":"5–6 h","o":"Długa pętla ok. 18 km z większym przewyższeniem w okolicy Melchsee-Frutt. Dla mocniejszych nóg, z widokami na Titlis i Bernese Alps.","s":"Melchsee-Frutt"},{"n":"Bonistock Circular Tour","d":"średnia","t":"2,5 h","o":"Pętla ok. 9,6 km wokół Bonistock nad jeziorem Melchsee. Dobry wybór na półdniową wędrówkę.","s":"Melchsee-Frutt"},{"n":"Erzegg Circular Tour","d":"średnia","t":"3 h","o":"Pętla ok. 11 km przez Erzegg, łatwa i widokowa. Idzie się łąkami nad Melchsee-Frutt.","s":"Melchsee-Frutt"},{"n":"Europaleiter – środek Szwajcarii","d":"średnia","t":"2 h","o":"Trasa do geograficznego środka Szwajcarii, oznaczonego na Älggi-Alp. To lokalna ciekawostka dla wielbicieli map.","s":"Melchsee-Frutt"},{"n":"Melchsee – Trübsee (Engelberg)","d":"średnia","t":"4 h","o":"Przejście z Melchsee-Frutt do Trübsee, ok. 15 km i kilka godzin marszu. Łączy dwie doliny przez przełęcz Jochpass.","s":"Melchsee-Frutt"}],"ds":"Płaskowyż z jeziorem na ok. 1900 m, dostępny kolejką gondolową z Stöckalp. Spokojne szlaki wokół jezior, zimą także narty i sanki."},{"id":"h-meiringen","n":"Meiringen / Haslital","c":"CH","r":"Berno","y":46.726,"x":8.184,"hikes":[{"n":"Triftbrücke (most wiszący)","d":"średnia","t":"4–5 h","o":"Most wiszący o długości 170 m i wysokości 100 m nad Triftsee; można podjechać kolejką Gadmen–Nessental.","s":"Haslital"},{"n":"Rosenlaui – Grosse Scheidegg","d":"średnia","t":"4–5 h","o":"Trasa z Rosenlaui do Grosse Scheidegg, z widokiem na Wetterhorn. Po drodze zobaczysz wąwóz Rosenlaui.","s":"Haslital"},{"n":"Lauteraarhütte","d":"trudna","t":"5–6 h","o":"Długa trasa doliną Grimsel do schroniska u lodowca Unteraar. Dla wytrwałych, z widokami na szczyty Bernese Alps.","s":"Haslital"}],"ds":"Dolina Haslital w Oberlandzie Berneńskim, znana z wąwozu Aareschlucht i wodospadów Reichenbach. Wygodna baza na trasy w stronę Grimselu i Hasliberg."},{"id":"h-engelberg","n":"Engelberg / Titlis","c":"CH","r":"Obwalden","y":46.818,"x":8.406,"hikes":[{"n":"Titlis Cliff Walk","d":"łatwa","t":"wjazd","o":"Wiszący most na wysokości 3041 m, jeden z najwyższych w Europie. Wjazd kolejką z Engelbergu, a spacer jest krótki.","s":"Engelberg"},{"n":"Trübsee – Jochpass","d":"średnia","t":"3–4 h","o":"Trasa z Engelbergu przez jezioro Trübsee na Jochpass. Wzdłuż drogi stoją owce i krowy.","s":"Engelberg"},{"n":"Brunnistöckli – Hahnen","d":"średnia","t":"4–5 h","o":"Wędrówka nad doliną Engelberg, z widokiem na lodowiec Titlis. Dla tych, którzy lubią grzbiety i mało ludzi.","s":"Engelberg"},{"n":"Fürenalp – Fürenwand","d":"łatwa","t":"2–3 h","o":"Spacer ze stacji kolejki Fürenalp do wodospadu Fürenwand, z widokiem na dolinę Engelberg. Dobre na rodzinny dzień.","s":"Engelberg"}],"ds":"Dolina pod górą Titlis (3239 m) z lodowcem, w której zimą jest jeden z większych ośrodków w środkowej Szwajcarii. Latem szlaki wokół jezior Trübsee i Engstlensee."},{"id":"h-luzern","n":"Lucerna, Rigi, Pilatus, Stoos","c":"CH","r":"Środkowa Szwajcaria","y":47.05,"x":8.31,"hikes":[{"n":"Rigi Kulm","d":"łatwa","t":"wjazd lub 3–4 h","o":"Królowa gór z koleją zębatą, najstarszą w Europie. Z Weggis można wejść pieszo, a na szczycie widać Jezioro Czterech Kantonów.","s":"Rigi"},{"n":"Pilatus Kulm (2132 m)","d":"średnia","t":"wjazd lub 4–5 h","o":"Najsłynniejszy szczyt nad Lucerną, z najbardziej stromą koleją zębatą na świecie. Wejść można szlakiem lub wjechać z Kriens.","s":"Pilatus"},{"n":"Stoos Ridge – Klingenstock – Fronalpstock","d":"średnia","t":"3–4 h","o":"Grzbiet nad jeziorem Czterech Kantonów z najstromszą kolejką linową świata.","s":"Stoos"},{"n":"Fronalpstock","d":"łatwa","t":"wjazd lub 2 h","o":"Szczyt nad Brunnen z widokiem na Jezioro Czterech Kantonów. Kolejka lub 2 h wejścia ze Stoos.","s":"Stoos"},{"n":"Hoch Ybrig Panorama","d":"średnia","t":"4–5 h","o":"Grzbietowa wędrówka z licznymi widokami na Alpy Szwyckie. Spokojniejsza niż Rigi czy Pilatus.","s":"Stoos"}],"ds":"Okolica Jeziora Czterech Kantonów z Rigi, Pilatusem i Stoos. Górskie widoki bez długich dojazdów, kolejki zębate i łodzie parowe dojeżdżają niemal pod szlaki."},{"id":"h-interlaken","n":"Interlaken i Brienz","c":"CH","r":"Berno","y":46.6863,"x":7.8632,"hikes":[{"n":"Harder Kulm","d":"łatwa","t":"2–3 h","o":"Wejście nad Interlaken z widokiem na Eiger, Mönch i Jungfrau oraz dwa jeziora. Na szczycie jest platforma widokowa.","s":"Interlaken"},{"n":"Niederhorn","d":"łatwa","t":"1–2 h","o":"Balkon nad Jeziorem Thunerskim, można wjechać kolejką ze Beatenbergu. Spacer grzbietem ma dobre widoki na Alpy.","s":"Interlaken"},{"n":"Brienzer Rothorn","d":"średnia","t":"wjazd lub 5 h","o":"Szczyt nad Jeziorem Brienz, na który jeździ pociąg parowy. Pieszo wejście zajmuje dużo czasu, ale widok jest wart wysiłku.","s":"Interlaken"},{"n":"Hardergrat","d":"trudna","t":"8–9 h","o":"Jedna z najtrudniejszych jednodniowych tras w Szwajcarii: wąska grań nad jeziorem Brienz, tylko przy dobrej pogodzie.","s":"Klasyki"},{"n":"Augstmatthorn","d":"średnia","t":"3.5–4.5 h","o":"Strome wejście z szerokimi widokami na jeziora Thun i Brienz oraz Alpy Berneńskie.","s":"Klasyki"}],"ds":"Miasto między jeziorami Thun i Brienz, baza do wypraw w Oberland. W okolicy są punkty widokowe, jeziora i parowa kolejka na Brienzer Rothorn."},{"id":"h-aletsch","n":"Aletsch (Riederalp / Bettmeralp)","c":"CH","r":"Valais","y":46.4,"x":8.03,"hikes":[{"n":"Aletsch Panoramaweg","d":"średnia","t":"5–6 h","o":"Trasa wzdłuż największego lodowca Alp, wpisanego na listę UNESCO. Idzie się z Bettmeralp lub Fiescheralp z widokiem na lodowiec.","s":"Aletsch"},{"n":"Fiescheralp – Bettmeralp","d":"łatwa","t":"3 h","o":"Najłatwiejsza trasa lodowcowa, bez trudnych odcinków. Zalecana na dzień, w którym chcesz zobaczyć lodowiec Aletsch bez zmęczenia.","s":"Aletsch"},{"n":"Aletschwald i Gletscherschlucht","d":"łatwa","t":"2–3 h","o":"Las sosnowy limbowych z drzewami starszymi niż 800 lat i wąwóz lodowcowy. Spokojny spacer w rezerwacie.","s":"Aletsch"},{"n":"Moosfluh","d":"średnia","t":"3–4 h","o":"Punkt widokowy nad lodowcem Aletsch, dojście z Riederalp. Z góry widać, jak lodowiec się kurczy.","s":"Aletsch"},{"n":"Märjelensee","d":"średnia","t":"5–6 h","o":"Jezioro Märjelen przy czole lodowca Aletsch. Dawniej woda z jeziora regularnie wylewała się do doliny.","s":"Aletsch"}],"ds":"Okolica największego lodowca Alp na tarasach Riederalp i Bettmeralp, wpisanych na listę UNESCO. Szlaki bez dużych przewyższeń z widokiem na lodowiec."},{"id":"h-saasfee","n":"Saas-Fee / Grächen","c":"CH","r":"Valais","y":46.109,"x":7.927,"hikes":[{"n":"Grächen – Saas-Fee (Europaweg lite)","d":"średnia","t":"4–5 h","o":"Odcinek Europawegu z widokami na cztery tysięczniki. Trasa jest wymagająca, ale mniej niż pełna wersja.","s":"Saas"},{"n":"Hannigalp – Grächen","d":"łatwa","t":"1–2 h","o":"Krótka pętla koło Grächen, dobra dla rodzin. Widać Weisshorn i Dom.","s":"Saas"},{"n":"Mittelallalin – Plattjen","d":"średnia","t":"3–4 h","o":"Trasa pod lodowcem Fee z panoramą Mischabel. Początek to Mittelallalin, najwyżej położona stacja obrotowej restauracji.","s":"Saas"},{"n":"Almagelleralp","d":"średnia","t":"4–5 h","o":"Trasa do schroniska u stóp Weissmies, przez dolinę Almagellertal. Dla lubiących ciszę i dużo marszu.","s":"Saas"}],"ds":"Wioska otoczona kilkunastoma czterotysięcznikami, bez ruchu samochodowego. Lodowiec Feegletscher jest całoroczny, a szlaki prowadzą w stronę lodowców i hut."},{"id":"h-verbier","n":"Verbier / Champex-Lac","c":"CH","r":"Valais","y":46.096,"x":7.228,"hikes":[{"n":"Mont Fort (3328 m)","d":"trudna","t":"7–9 h","o":"Wymagający szczyt nad Verbier, z widokiem na Mont Blanc i Matterhorn. Wejście wymaga dobrej kondycji i pogody.","s":"Verbier"},{"n":"Lac des Vaux – Savoleyres","d":"łatwa","t":"2–3 h","o":"Jezioro Vaux nad Verbier, spacer ze stacji gondoli. Idealny na krótki dzień.","s":"Verbier"},{"n":"Champex-Lac – Fenêtre d'Arpette","d":"trudna","t":"6–7 h","o":"Jeden z najpiękniejszych wariantów Tour du Mont Blanc, przez przełęcz Fenêtre d'Arpette (2665 m). Odcinek jest trudny, z blokami skalnymi i lodowcem Trient.","s":"Verbier"},{"n":"Cabane de Mont Fort","d":"średnia","t":"4–5 h","o":"Schronisko pod Mont Fort, dojście z Verbier. Popularne jako punkt na Haute Route.","s":"Verbier"}],"ds":"Duży ośrodek w Valais z szerokimi widokami na Mont Blanc i Grand Combin. Szlaki wysokogórskie, a w pobliżu jezioro Champex-Lac."},{"id":"h-creux","n":"Creux du Van","c":"CH","r":"Neuchâtel","y":46.94,"x":6.723,"hikes":[{"n":"Creux du Van – pętla","d":"średnia","t":"4–5 h","o":"Naturalny amfiteatr o średnicy 1 km, wejście z Noiraigue ok. 725 m w górę.","s":"Jura"},{"n":"Gorges de l'Areuse","d":"łatwa","t":"2–3 h","o":"Wąwóz rzeki Areuse w kantonie Neuchâtel, ze ścieżkami wzdłuż wody. Spokojne, leśne miejsce.","s":"Jura","ct":"k"}],"ds":"Wielki amfiteatr skalny w Jurze Szwajcarskiej, z przepaścią około 150 m. Jeden z najpopularniejszych krótkich szlaków poza Alpami, z szansą na zobaczenie koziorożców."},{"id":"h-lotschental","n":"Lötschental (Kippel, Fafleralp)","c":"CH","r":"Valais","y":46.4,"x":7.79,"hikes":[{"n":"Fafleralp – Gletscherstafel","d":"łatwa","t":"2–3 h","o":"Dolina z widokiem na lodowiec Langgletscher, w mało uczęszczanym Lötschental. Wioski z drewnianymi domami zachowały lokalne tradycje.","s":"Lötschental"},{"n":"Lötschentaler Höhenweg","d":"średnia","t":"6–7 h","o":"Wysokogórska wędrówka z widokami na Bietschhorn i dolinę. Wymaga całego dnia.","s":"Lötschental"},{"n":"Lötschenpass","d":"trudna","t":"6–8 h","o":"Przełęcz między Lötschental a Kandersteg, ze starym szlakiem handlowym i widokami na Bernese Alps. Długa trasa, dobra dla mocniejszych.","s":"Lötschental"}],"ds":"Odizolowana dolina w Valais z tradycyjnymi wsiami i widokiem na lodowiec Langgletscher. Jedna z bardziej spokojnych i dzikich dolin Szwajcarii."},{"id":"h-ticino","n":"Ticino (Verzasca, Locarno)","c":"CH","r":"Ticino","y":46.226,"x":8.8,"hikes":[{"n":"Dolina Verzasca – Ponte dei Salti","d":"łatwa","t":"1–2 h","o":"Kamienny most nad turkusowym potokiem Verzasca, znany z kąpieli i skoków. Woda jest zimna, ale przejrzysta.","s":"Ticino"},{"n":"Monte Generoso","d":"średnia","t":"wjazd lub 4–5 h","o":"Szczyt nad jeziorem Lugano, z kolejką zębatą. Ze szczytu widać Alpy, równinę Padu i jeziora.","s":"Ticino"},{"n":"Cardada – Cimetta","d":"łatwa","t":"2–3 h","o":"Widokowa trasa nad Locarno i Lago Maggiore. Wjazd kolejką z Orselina.","s":"Ticino"},{"n":"Sentiero di Gole","d":"łatwa","t":"2 h","o":"Spacer wąwozem rzeki w Ticino, z kładkami nad wodą. Krótki i chłodny w upał.","s":"Ticino"}],"ds":"Włoskojęzyczna część Szwajcarii z cieplejszym klimatem, kamiennymi wsiami i krystalicznie czystą rzeką Verzasca. Dobre miejsce, gdy w Alpach jest zła pogoda."},{"id":"h-flims","n":"Flims / Laax","c":"CH","r":"Gryzonia","y":46.834,"x":9.289,"hikes":[{"n":"Caumasee","d":"łatwa","t":"1,5–2 h","o":"Turkusowe jezioro w lesie koło Flims, z możliwością kąpieli latem. Woda przybiera różne odcienie w zależności od światła.","s":"Flims"},{"n":"Ruinaulta (Rhein Gorge)","d":"łatwa","t":"3–4 h","o":"Szwajcarski Grand Canyon nad Renem, z białymi urwiskami i wąską doliną. Trasa jest długa, ale płaska.","s":"Flims"},{"n":"Segnas – Naraus","d":"średnia","t":"4–5 h","o":"Widokowa trasa przez Tektonikarena Sardona (UNESCO), z widokiem na nasunięcie skał. Geologia widoczna gołym okiem.","s":"Flims"}],"ds":"Region Surselvy z Rheinschlucht (nazywanym szwajcarskim Wielkim Kanionem) i jeziorem Caumasee. Szlaki z widokiem na Tschingelhörner i Segnes."},{"id":"h-arosa","n":"Davos / Arosa","c":"CH","r":"Gryzonia","y":46.777,"x":9.679,"hikes":[{"n":"Weisshorn – Arosa","d":"średnia","t":"3–4 h","o":"Szczyt nad Arosą, przejście grzbietem z widokiem na Alpy. Wjazd kolejką z Arosy.","s":"Davos/Arosa"},{"n":"Schwarzhorn – Fanezmeta","d":"średnia","t":"5–6 h","o":"Widokowa wędrówka w Rätikonie, w stronę Austrii. Dużo skał i kwiatów.","s":"Davos/Arosa"},{"n":"Strelapass","d":"średnia","t":"3–4 h","o":"Przełęcz między Davos a Arosą, z widokiem na Schiahorn. Można wrócić kolejką.","s":"Davos/Arosa"},{"n":"Bärentritt – Schatzalp","d":"łatwa","t":"1–2 h","o":"Spacer wokół Davos, do dawnego sanatorium Schatzalp, które inspirowało Czarodziejską górę Manna. Idzie się łatwo.","s":"Davos/Arosa"}],"ds":"Okolica Davos i Arosa z wysokogórskimi jeziorami, szlakami z widokiem na Schiahorn i kolejkami. Wygodne trasy zarówno rodzinne, jak i dłuższe."},{"id":"h-pizol","n":"Pizol / Churfirsten","c":"CH","r":"St. Gallen","y":47.0,"x":9.4,"hikes":[{"n":"5-Seen-Wanderung (Pizol)","d":"średnia","t":"5–6 h","o":"Pięć jezior pod Pizol, ok. 9 km, klasyka wschodniej Szwajcarii. Ostatnie odcinki są strome.","s":"Pizol"},{"n":"Chäserrugg","d":"łatwa","t":"wjazd lub 3 h","o":"Szczyt Churfirsten z widokiem na Walensee i Alpy. Wjazd kolejką z Unterwasser lub wejście pieszo.","s":"Churfirsten"},{"n":"Wildhaus – Gamserrugg","d":"średnia","t":"3–4 h","o":"Szczyt nad Toggenburgiem, z widokiem na Säntis. Dobra jednodniowa wycieczka.","s":"Churfirsten"}],"ds":"Rejon Pizol i Churfirsten z charakterystycznymi siedmioma szczytami nad jeziorem Walensee. Popularne jest Fünf-Seen-Wanderung, szlak pięciu jezior pod Pizolem."},{"id":"h-gstaad","n":"Gstaad / Lenk","c":"CH","r":"Berno","y":46.47,"x":7.28,"hikes":[{"n":"Lauenensee","d":"łatwa","t":"1–2 h","o":"Spokojne jezioro nad Gstaad, otoczone lasem. Krótka, łatwa pętla.","s":"Gstaad"},{"n":"Wildstrubel – Iffigenalp","d":"trudna","t":"7–9 h","o":"Wysokogórska trasa z lodowcowymi widokami nad Lenk. Wymaga całego dnia i dobrej pogody.","s":"Gstaad"},{"n":"Iffigfall","d":"łatwa","t":"1–1,5 h","o":"Wodospad nad Lenk, dojście od Iffigenalp. Krótki spacer przez las i łąki.","s":"Gstaad"}],"ds":"Łagodniejszy region Berneńskich Alp z zielonymi dolinami, wodospadami i lodowcem Les Diablerets w pobliżu. Spokojniejsza alternatywa dla Interlaken."},{"id":"h-elm","n":"Elm / Glarus","c":"CH","r":"Glarus","y":46.92,"x":9.17,"hikes":[{"n":"Foopass – Martinsloch","d":"średnia","t":"5–6 h","o":"Szlak do Martinsloch, otworu w skale, przez który słońce przechodzi dwa razy w roku. Okolica należy do Tektonikarena Sardona (UNESCO).","s":"Glarus"},{"n":"Mürtschenstock","d":"średnia","t":"6–7 h","o":"Szczyt i szlak widokowy nad Walensee. Wymaga dobrego dnia i kondycji.","s":"Glarus"}],"ds":"Mała dolina w kantonie Glarus ze Sardona Tectonic Arena, wpisaną na listę UNESCO. Widać tu zjawisko nasunięcia starszych skał na młodsze."},{"id":"h-camino","n":"Camino de Santiago","c":"ES","r":"Galicja / cała Hiszpania","y":42.8806,"x":-8.5449,"hikes":[{"n":"Camino Francés (St-Jean-Pied-de-Port → Santiago)","d":"trudna","t":"30–35 dni","o":"Najpopularniejsza trasa, ok. 770–790 km, przez Pireneje, Nawarrę, Kastylię i Galicję.","s":"Trasy (całość)"},{"n":"Camino Portugués Central (Lizbona/Porto → Santiago)","d":"średnia","t":"12–29 dni","o":"Ok. 620 km z Lizbony i 240 km z Porto; druga najpopularniejsza trasa.","s":"Trasy (całość)"},{"n":"Camino Portugués de la Costa (Porto → Santiago)","d":"średnia","t":"12–14 dni","o":"Wariant drogi portugalskiej wzdłuż Atlantyku, z Porto przez Viana do Castelo i przeprawę do A Guarda, potem Vigo i dalej do Santiago. Dużo plaż i nadmorskich promenad, wiatr z oceanu. Ok. 260–280 km.","s":"Trasy (całość)"},{"n":"Camino del Norte (Irún → Santiago)","d":"trudna","t":"30–35 dni","o":"Najdłuższa z głównych, ok. 825 km, wzdłuż wybrzeża Biskajów.","s":"Trasy (całość)"},{"n":"Camino Primitivo (Oviedo → Santiago)","d":"trudna","t":"12–14 dni","o":"Ok. 310–320 km, najstarsza i górska trasa przez Asturię i Galicję.","s":"Trasy (całość)"},{"n":"Camino Inglés (Ferrol → Santiago)","d":"średnia","t":"5–6 dni","o":"Ok. 119 km, krótka, historyczna trasa dla pielgrzymów z morza.","s":"Trasy (całość)"},{"n":"Camino de Fisterra i Muxía (Santiago → Fisterra)","d":"średnia","t":"4–5 dni","o":"Przedłużenie z Santiago nad Atlantyk, do przylądka Fisterra, który w średniowieczu uważano za koniec świata. Po drodze można odbić do Muxíi. Tradycją jest zachód słońca przy latarni.","s":"Trasy (całość)"},{"n":"Vía de la Plata (Sewilla → Santiago)","d":"trudna","t":"35–40 dni","o":"Najdłuższe z hiszpańskich Camino, wiodące dawną rzymską drogą z Andaluzji przez Estremadurę i Kastylię. Mało pielgrzymów, długie odcinki bez wsi i latem bardzo duże upały. Wymaga dobrego planowania noclegów i wody.","s":"Trasy (całość)"},{"n":"Camino de Invierno (Ponferrada → Santiago)","d":"średnia","t":"12 dni","o":"Zimowa alternatywa Camino Francés, wybierana w średniowieczu, gdy śnieg zasypywał przełęcz O Cebreiro. Wiedzie przez Las Médulas, Quirogę i Monforte de Lemos. Spokojniejsza niż klasyczna droga.","s":"Trasy (całość)"},{"n":"Chemin du Puy (Le Puy-en-Velay → St-Jean)","d":"trudna","t":"30 dni","o":"Francuska Via Podiensis (GR 65) z Le Puy-en-Velay przez Aubrac i Conques do St-Jean-Pied-de-Port, gdzie zaczyna się Camino Francés. Dobra baza noclegowa w gîte d'étape i wiele pięknych wsi.","s":"Trasy (całość)"},{"n":"Ostatnie 100 km: Sarria → Santiago","d":"łatwa","t":"5–7 dni","o":"Najpopularniejszy fragment Camino Francés, bo wystarczy na certyfikat Compostela (min. 100 km). W sezonie bywa tłocznie i trzeba rezerwować noclegi. W ostatnich 100 km zbiera się dwie pieczątki dziennie do credencial.","s":"Trasy (całość)"},{"n":"Ostatnie 100 km: Tui → Santiago","d":"łatwa","t":"6–7 dni","o":"Ostatnia setka Camino Portugués, z granicznego Tui przez Pontevedrę i Padrón. Mniej tłoczna niż z Sarrii, a trasa jest zielona i dobrze oznakowana.","s":"Trasy (całość)"},{"n":"Etap 1: St-Jean-Pied-de-Port → Roncesvalles","d":"trudna","t":"7–9 h","o":"Najtrudniejszy etap początku: podejście przez Pireneje przez Col de Lepoeder (ok. 1430 m). Droga Napoleona jest zimą zamknięta, a w złej pogodzie zaleca się niższą trasę przez Valcarlos. Dobrze wyjść wcześnie.","s":"Camino Francés – etapy"},{"n":"Etap 2: Roncesvalles → Zubiri","d":"średnia","t":"5–7 h","o":"Zejście bukowymi lasami i wioskami Nawarry. Strome fragmenty zejścia do Zubiri męczą kolana.","s":"Camino Francés – etapy"},{"n":"Etap 3: Zubiri → Pamplona","d":"średnia","t":"5–6 h","o":"Wzdłuż rzeki Arga do Pampeluny, wejście przez mury twierdzy. Miasto jest znane z lipcowej fiesty San Fermín i dobrego jedzenia.","s":"Camino Francés – etapy"},{"n":"Etap 4: Pamplona → Puente la Reina","d":"średnia","t":"6–7 h","o":"Podejście na Alto del Perdón (ok. 770 m) z metalowymi rzeźbami pielgrzymów i widokami na Nawarrę, potem zejście do Puente la Reina z romańskim mostem.","s":"Camino
