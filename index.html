wa","y":-33.9628,"x":18.4098,"hikes":[{"n":"Platteklip Gorge","d":"średnia","t":"2–3 h","o":"Najkrótsze wejście na Table Mountain, ok. 3 km stromym żlebem.","s":"Klasyki"}]},{"id":"h-al-theth","n":"Theth i Valbona","c":"AL","r":"Szkodra","y":42.4,"x":19.7667,"hikes":[{"n":"Theth – Valbona (Valbona Pass)","d":"trudna","t":"6–8 h","o":"Klasyczne przejście Alp Albańskich między dwiema dolinami.","s":"Klasyki"},{"n":"Blue Eye Theth","d":"łatwa","t":"1–2 h","o":"Wodospad i kamień z turkusową wodą niedaleko Theth.","s":"Klasyki"}]},{"id":"h-ba-kravice","n":"Wodospady Kravice","c":"BA","r":"Hercegowina","y":43.1583,"x":17.6125,"hikes":[{"n":"Kravice","d":"łatwa","t":"1–2 h","o":"Krótki spacer do kaskady 25 m i kąpiel pod wodospadem.","s":"Klasyki","ct":"w"}]},{"id":"h-gr-vikos","n":"Wąwóz Vikos","c":"GR","r":"Epir","y":39.9167,"x":20.7167,"hikes":[{"n":"Wąwóz Vikos – Monodendri","d":"średnia","t":"5–6 h","o":"Jeden z najgłębszych wąwozów świata, trasa z Monodendri do Vikos.","s":"Klasyki","ct":"k"},{"n":"Wąwóz Vikos – Papigo i Rogovo","d":"średnia","t":"6–7 h","o":"Dłuższy odcinek wąwozu Vikos z Papigo, z widokami z krawędzi. Spokojne, kamieniste ścieżki w sercu Zagori.","s":"Klasyki","ct":"k"},{"n":"Wąwóz Aoos – Papigo Rock Pools","d":"łatwa","t":"2–3 h","o":"Spacer do naturalnych basenów skalnych koło Papigo, w których latem można się kąpać w zimnej wodzie. Krótka i łatwa trasa.","s":"Klasyki","ct":"k"},{"n":"Kamienne mosty Zagori","d":"łatwa","t":"2–3 h","o":"Spacer wśród tradycyjnych wiosek Zagorii i kamiennych mostów w łuku. Łatwa trasa, dobra na dzień zwiedzania.","s":"Klasyki"},{"n":"Jezioro Drakolimni","d":"trudna","t":"6–7 h","o":"Wysokogórskie 'Smocze Jezioro' pod szczytem Gamila w górach Pindos. Trasa jest stroma i wymaga ok. 6–7 h, a w schronisku można zostać na noc.","s":"Klasyki","ct":"j"}],"ds":"Wąwóz Vikos w regionie Zagori w Epirze należy do najgłębszych wąwozów świata w stosunku do szerokości, do ok. 900 m głębokości. Leży w Parku Narodowym Vikos-Aoos, wś ,"n":"Elephant Rocks","c":"NZ","r":"Otago","y":-44.88,"x":170.68,"ds":"Wapienne ostańce w dolinie Waitaki, koło Duntroon. W Lwie, czarownicy i starej szafie rozbito tu obóz Aslana.","hikes":[{"n":"Elephant Rocks","d":"łatwa","t":"1.5 h","o":"Spacer wśród ostańców wapiennych w dolinie Waitaki. W filmie to obóz Aslana.","s":"Klasyki","fm":["nar"]}],"fl":{"nar":"Obóz Aslana"},"fo":1},{"id":"h-film-bovec","n":"Bovec (Dolina Soczy)","c":"SI","r":"Dolina Soczy","y":46.338,"x":13.553,"ds":"Miasteczko w dolinie Soczy, pod parkiem Triglav. W Księciu Kaspianie zbudowano tu most z bitwą Telmarów.","hikes":[{"n":"Dolina Soczy – Boka i Kozjak","d":"średnia","t":"3 h","o":"Szlak wzdłuż Soczy do wodospadów Boka i Kozjak. W okolicy kręcono scenę bitwy na moście w Księciu Kaspianie.","s":"Klasyki","fm":["nar"]}],"fl":{"nar":"Bitwa na moście"}},{"id":"h-film-stadlandet","n":"Stadlandet","c":"NO","r":"Sogn og Fjordane","y":62.17,"x":5.15,"ds":"Półwysep na zachodzie Norwegii, o ostrych klifach i dzikim morzu. W Diunie to Caladan, planeta rodu Atrydów.","hikes":[{"n":"Kråkenes – klify Stad","d":"średnia","t":"3 h","o":"Spacer po klifach półwyspu Stad do latarni Kråkenes. W Diunie to dom Atrydów, Caladan.","s":"Klasyki","ct":"k","fm":["dune"]}],"fl":{"dune":"Caladan"}},{"id":"h-film-liwa","n":"Liwa (Abu Zabi)","c":"AE","r":"Abu Zabi","y":23.13,"x":53.78,"ds":"Oaza na krawędzi pustyni Rub al-Chali, z dużymi wydmami. W Diunie i Diunie: Część druga to Arrakis, planeta pustynna.","hikes":[{"n":"Wydmy Liwa","d":"łatwa","t":"3 h","o":"Spacer po wydmach pustyni Rub al-Chali. W Diunie powstały tu sceny z czerwi.","s":"Klasyki","fm":["dune"]}],"fl":{"dune":"Arrakis"},"fo":1},{"id":"h-film-brion","n":"Cmentarz Brion (Altivole)","c":"IT","r":"Wenecja Euganejska","y":45.779,"x":11.995,"ds":"Modernistyczny cmentarz Carla Scarpy koło Asolo. W Diunie: Część druga to wnętrza dworu cesarskiego Corrino.","fo":1,"hikes":[{"n":"Cmentarz Brion","d":"łatwa","t":"1 h","o":"Spacer po cmentarzu z betonowymi budowlami i wodą. W filmie to wnętrza cesarskich komnat.","s":"Klasyki","fm":["dune"]}],"fl":{"dune":"Pałac Corrino"}},{"id":"h-dominica","n":"Dominika (Morne Trois Pitons)","c":"DM","r":"Karaiby","y":15.3167,"x":-61.3167,"ds":"Wyspa natury z parkiem narodowym Morne Trois Pitons na liście UNESCO, z gorącymi źródłami, wodospadami i wulkanicznymi kanionami. Jedno z najlepszych miejsc na trekking w Karaibach. Kręcono tu m.in. Piratów z Karaibów: Skrzynię umarlaka.","hikes":[{"n":"Titou Gorge","d":"łatwa","t":"1–1.5 h","o":"Wąski wulkaniczny kanion z ciepłą wodą i wodospadem na końcu, do którego się płynie. W Skrzyni umarlaka to wąwóz, w którym Will Turner i załoga wiszą w klatkach z kości. Warto mieć kamizelkę.","s":"Klasyki","ct":"k","fm":["pirates"]},{"n":"Boiling Lake","d":"trudna","t":"6–8 h","o":"Jeden z najsłynniejszych treków Karaibów: przez Valley of Desolation z parującymi fumarolami do wrzącego jeziora, w którym woda bulgocze. Długi dzień, śliskie błoto, najlepiej z przewodnikiem.","s":"Klasyki","ct":"j"}],"fl":{"pirates":"Wyspa Kanibali"}},{"id":"h-wallilabou","n":"Wallilabou Bay (Saint Vincent)","c":"VC","r":"Karaiby","y":13.2492,"x":-61.26,"ds":"Zatoka na zachodnim wybrzeżu Saint Vincent, w której do dziś stoją dekoracje z Piratów z Karaibów. W filmach to Port Royal.","hikes":[{"n":"Wallilabou Bay, plan filmowy","d":"łatwa","t":"1 h","o":"Spacer po zachowanych dekoracjach portu z filmu, przy zatoce w otoczeniu gór. W serii to Port Royal, miejsce wielu scen z Jackiem Sparrowem.","s":"Klasyki","fm":["pirates"]}],"fo":1,"fl":{"pirates":"Port Royal"}},{"id":"h-bonneville","n":"Bonneville Salt Flats (Utah)","c":"US","r":"Utah","y":40.7608,"x":-113.8903,"ds":"Biała, idealnie płaska solnisko w Utah, uważane za jedno z najbardziej surrealistycznych miejsc w USA. W Na krańcu świata to Szafka Davy'ego Jonesa.","hikes":[{"n":"Bonneville Salt Flats","d":"łatwa","t":"1 h","o":"Spacer po białej, utwardzonej soli do horyzontu, najlepszy o wschodzie lub zachodzie słońca. Po deszczu powierzchnia zamienia się w lustro. W filmie Na krańcu świata to Szafka Davy'ego Jonesa.","s":"Klasyki","fm":["pirates"]}],"fo":1,"fl":{"pirates":"Szafka Davy'ego Jonesa"}},{"id":"h-li-liechtenstein","n":"Liechtenstein (Malbun, Triesenberg, Vaduz)","c":"LI","r":"Liechtenstein","y":47.1138,"x":9.5311,"ds":"Maleńkie księstwo między Szwajcarią a Austrią, z górami Rätikon nad doliną Renu. Klasykiem jest Fürstensteig z Drei Schwestern, a do tego dochodzą schroniska na szlaku Liechtensteiner Höhenweg. Latem szlaki są dostępne od czerwca do października.","hikes":[{"n":"Fürstensteig – Drei Schwestern","d":"trudna","t":"5–6 h","o":"Klasyczna wycieczka górska Liechtensteinu: skalna ścieżka Fürstensteig z 1898 r., potem grań Drei Schwestern i zejście przez Gafadurahütte do Planken. Ok. 12 km i ok. 850 m podejścia, dla pewnie stąpających i bez lęku wysokości. Odcinki są ubezpieczone linami.","s":"Klasyki"},{"n":"Fürstensteig z Gaflei (pętla)","d":"średnia","t":"2.5–3 h","o":"Krótsza wersja klasyka: z Gaflei skalną ścieżką wykutą w ścianie nad doliną Renu i powrót pętlą. Ok. 6 km i ok. 430 m podejścia. Wymaga pewnego kroku, ale nie trzeba iść całego grzbietu.","s":"Klasyki"},{"n":"Liechtenstein Panoramaweg","d":"trudna","t":"4 dni","o":"Trasa ze schroniska do schroniska: Planken, Gafadurahütte, Sücka, Pfälzerhütte i Malbun. Prowadzi przez całe księstwo, w tym Drei Schwestern. Warto sprawdzić terminy otwarcia schronisk (ok. połowa maja do połowy października).","s":"Klasyki"},{"n":"Gafadurahütte z Planken","d":"średnia","t":"2–3 h","o":"Wejście z Planken do schroniska Alpenverein, które leży na trasie Drei Schwestern. Dobre, gdy chcesz zobaczyć Rätikon bez wchodzenia na grań.","s":"Klasyki"},{"n":"Vaduz – zamek Vaduz","d":"łatwa","t":"1–1.5 h","o":"Spacer z centrum stolicy w górę do zamku, który jest rezydencją książęcą i nie jest dostępny do zwiedzania. Z góry widać Vaduz i dolinę Renu.","s":"Vaduz"}]},{"id":"h-at-brandnertal-ratikon","n":"Brandnertal / Rätikon (Lünersee)","c":"AT","r":"Vorarlberg","y":47.0536,"x":9.7525,"ds":"Dolina Brandnertal pod Rätikonem w Vorarlbergu. Lünersee to zbiornik na ok. 1970 m, do którego wjeżdża kolejka z Brand. Najwyższy szczyt Rätikonu Schesaplana (2965 m) jest wymagającym celem na cały dzień.","hikes":[{"n":"Lünersee dookoła","d":"łatwa","t":"2–3 h","o":"Pętla wokół górskiego jeziora zaporowego, z widokiem na Schesaplanę i lodowiec. Kolejka z Brand skraca dojście.","s":"Klasyki","ct":"j"},{"n":"Schesaplana","d":"trudna","t":"8–10 h","o":"Najwyższy szczyt Rätikonu (2965 m), zwykle z Lünersee przez lodowiec Brandner Gletscher. Wymaga kondycji i doświadczenia, a na lodowcu zalecany jest sprzęt.","s":"Klasyki"}]},{"id":"h-at-vorarlberg-bodensee","n":"Vorarlberg: Bregenz, Dornbirn, Feldkirch","c":"AT","r":"Vorarlberg","y":47.4125,"x":9.7417,"ds":"Dolina Renu i okolice Jeziora Bodeńskiego, z Pfänderem nad Bregenz i wąwozem Rappenlochschlucht koło Dornbirn. Dobre na krótkie, łatwe wycieczki z miast. Feldkirch ma średniowieczny zamek Schattenburg.","hikes":[{"n":"Rappenlochschlucht","d":"łatwa","t":"1.5–2 h","o":"Wąwóz rzeki Dornbirner Ach koło Dornbirn, z pomostami i schodami w skale. Szlak prowadzi dalej w stronę jeziora Staufensee. Zimą bywa zamknięty.","s":"Klasyki"},{"n":"Pfänder (Bregenz)","d":"łatwa","t":"1.5–2 h","o":"Kolejką na Pfänder (ok. 1060 m) nad Bregenz, z widokiem na Jezioro Bodeńskie i trzy kraje. Można też zejść pieszo.","s":"Klasyki"},{"n":"Schattenburg (Feldkirch)","d":"łatwa","t":"1 h","o":"Spacer z centrum Feldkirch na średniowieczny zamek nad miastem. Z murów widać dolinę Renu.","s":"Feldkirch"}]},{"id":"h-ch-bad-ragaz","n":"Bad Ragaz / Taminaschlucht","c":"CH","r":"Saint Gallen","y":47.0,"x":9.5,"ds":"Uzdrowisko u stóp Pizolu, ok. 15 km od Vaduz. Główna atrakcja to wąwóz Taminaschlucht z gorącym źródłem w Bad Pfäfers. Dobre na łatwy dzień, także przy gorszej pogodzie.","hikes":[{"n":"Taminaschlucht","d":"łatwa","t":"1–1.5 h","o":"Wąwóz rzeki Tamina z pomostami pod ścianami skalnymi, do dawnych łaźni w Bad Pfäfers przy źródle termalnym. Wstęp jest płatny, a zimą wąwóz zwykle jest zamknięty.","s":"Klasyki"}]},{"id":"h-de-tegernsee","n":"Tegernsee (Wallberg)","c":"DE","r":"Bawaria","y":47.693,"x":11.772,"ds":"Jezioro Tegernsee u podnóża Alp bawarskich, z kolejką na Wallberg (1722 m). Dobre na łatwe szlaki z widokiem na jezioro. Latem można pływać, a jesienią okolica ma ładne kolory.","hikes":[{"n":"Wallberg (1722 m)","d":"średnia","t":"3–4 h","o":"Wejście na Wallberg z Rottach-Egern, z widokiem na Tegernsee i Alpy. Można wjechać kolejką i zejść pieszo.","s":"Klasyki"},{"n":"Tegernsee dookoła","d":"łatwa","t":"5–6 h","o":"Okrężna ścieżka wokół jeziora, z dużą liczbą kawiarni po drodze. Można ją podzielić na krótsze odcinki, korzystając z promów.","s":"Tegernsee"}]},{"id":"h-de-lenggries","n":"Lenggries (Brauneck)","c":"DE","r":"Bawaria","y":47.6806,"x":11.5703,"ds":"Lenggries w dolinie Isary jest bazą pod Brauneck (1555 m), z gondolą i prostymi szlakami. Dobre na jednodniową wycieczkę z Monachium.","hikes":[{"n":"Brauneck z Lenggries","d":"średnia","t":"4–5 h","o":"Wejście z Lenggries na Brauneck, z widokiem na Alpy i dolinę Isary. Można wjechać gondolą i wrócić pieszo.","s":"Klasyki"}]},{"id":"h-de-chiemgau","n":"Chiemgau (Chiemsee, Kampenwand)","c":"DE","r":"Bawaria","y":47.8,"x":12.4,"ds":"Chiemsee zwane bawarskim morzem, z wyspami Herreninsel i Fraueninsel, oraz Kampenwand (1669 m) nad Aschau. Łatwe spacery nad wodą i wejścia z kolejką linową.","hikes":[{"n":"Kampenwand (1669 m)","d":"średnia","t":"4–5 h","o":"Wejście na charakterystyczny szczyt nad Aschau z dużym krzyżem na szczycie. Można skorzystać z kolejki linowej Kampenwandbahn.","s":"Klasyki"},{"n":"Herreninsel – Herrenchiemsee","d":"łatwa","t":"3–4 h","o":"Wycieczka statkiem z Prien na wyspę Herreninsel z pałacem Ludwika II. Dobry spacer po wyspie i zwiedzanie.","s":"Chiemsee"}]},{"id":"h-de-bayrischzell","n":"Bayrischzell (Wendelstein)","c":"DE","r":"Bawaria","y":47.677,"x":12.001,"ds":"Bayrischzell to baza pod Wendelstein (1838 m), z kolejką linową i najstarszą w Niemczech koleją zębatą. W okolicy są wodospady Tatzelwurm. Zimą działa ośrodek Sudelfeld.","hikes":[{"n":"Wendelstein (1838 m)","d":"trudna","t":"4–5 h","o":"Wejście na Wendelstein z Bayrischzell, z widokiem na Alpy i Bawarię. Można wjechać kolejką i wrócić pieszo.","s":"Klasyki"},{"n":"Tatzelwurm – wodospady","d":"łatwa","t":"1–1.5 h","o":"Krótki spacer do wodospadów Tatzelwurm koło Oberaudorf. Dobre na łatwy dzień lub gdy pogoda jest zmienna.","s":"Okolice"}]},{"id":"h-de-oberammergau","n":"Oberammergau (Laber, Ettal)","c":"DE","r":"Bawaria","y":47.597,"x":11.064,"ds":"Oberammergau znane z pasyjnych przedstawień i malowanych domów, z kolejką na Laber (1686 m). W pobliżu są klasztor w Ettal i pałac Linderhof Ludwika II. Dobre na łatwe wycieczki z Garmisch-Partenkirchen.","hikes":[{"n":"Laber – Ettaler Manndl","d":"średnia","t":"4–5 h","o":"Z kolejki na Laber (1686 m) grzbietem do Ettaler Manndl i zejście do Ettal. Widoki na Ammergauer Alpen.","s":"Klasyki"},{"n":"Linderhof – spacer","d":"łatwa","t":"2–3 h","o":"Spacer przy pałacu Linderhof Ludwika II z ogrodami i grotą Wenus. Zwiedzanie pałacu jest płatne i bywa tłoczno w sezonie.","s":"Oberammergau"}]}]};
