<style>
:root{
  --bg:#08111f; --bg2:#0d1b30; --glass:rgba(255,255,255,.045); --glass2:rgba(255,255,255,.08);
  --line:rgba(255,255,255,.09); --text:#eaf1ff; --mute:#8ea2c4; --faint:#5d7096;
  --accent:#5ad1ff; --accent2:#8b7bff; --ok:#38e0a0; --warn:#ffc65c; --bad:#ff6f7d;
  --grad:linear-gradient(135deg,#5ad1ff,#8b7bff); --halo:#14305a; --maphalo:#102949; --mapend:#091526; --accentbg:rgba(90,209,255,.09);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(1200px 600px at 50% -10%,var(--halo) 0%,var(--bg) 60%)}
body.summer{--accent:#ffd35a;--accent2:#ff8f5a;--grad:linear-gradient(135deg,#ffd35a,#ff8f5a);--halo:#21402f;--maphalo:#1b3a2d;--mapend:#07140e;--bg:#08140f;--accentbg:rgba(255,211,90,.1)}
button{font-family:inherit}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;margin:0 auto 2px}

/* header */
header{padding:calc(12px + var(--safe-t)) 16px 12px;background:linear-gradient(180deg,rgba(13,27,48,.92),rgba(8,17,31,.6));backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);z-index:3}
.brand{display:flex;align-items:center;gap:9px}
.logo{width:28px;height:28px;border-radius:9px;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(90,209,255,.35)}
.logo svg{width:18px;height:18px;stroke:#071426;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.brand h1{font-size:18px;font-weight:800;margin:0;letter-spacing:-.2px}
.rt{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.mode{margin-left:0;display:flex;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.mode button{background:none;border:0;color:var(--mute);padding:6px 11px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer}
.mode button.on{background:var(--grad);color:#071426}
.savel{display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:10.5px;color:var(--faint);margin-top:6px;min-height:14px}
.savel #saveState{text-align:right}
.acct{border:1px solid var(--line);background:var(--glass);color:var(--text);border-radius:999px;padding:6px 9px;font-size:11px;font-weight:600;cursor:pointer;min-width:0;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
@media(max-width:430px){.brand .logo{display:none}.brand h1{font-size:16px;white-space:nowrap}.mode button{padding:6px 7px;font-size:11.5px}.rt{gap:6px}}
.acct.on{border-color:rgba(56,224,160,.5);color:var(--ok);background:rgba(56,224,160,.08)}
#acctov{position:fixed;inset:0;z-index:150;background:rgba(3,8,16,.75);display:none;align-items:flex-start;justify-content:center;padding:calc(70px + var(--safe-t)) 14px 14px}
#acctov .lg{text-align:center}.lgi{width:54px;height:54px;margin:0 auto;border-radius:18px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:26px}
.lin{width:100%;box-sizing:border-box;background:var(--glass2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:13px 14px;font:inherit;font-size:16px;outline:none;color-scheme:dark}.lin:focus{border-color:var(--accent)}
.lbtn{width:100%;margin-top:10px;padding:14px}.lcl{width:100%;margin-top:12px;background:none}
#acctov .card{max-width:420px;width:100%;margin:0;background:#0d1b30}
.hstats{display:flex;gap:18px;margin-top:10px;align-items:flex-end}
.hstats div{display:flex;flex-direction:column;line-height:1.1}
.hstats b{font-size:22px;font-weight:800;letter-spacing:-.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hstats small{font-size:11px;color:var(--mute);margin-top:3px}
.prog{height:5px;background:var(--glass2);border-radius:5px;margin-top:11px;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--ok));width:0;border-radius:5px;transition:width .45s cubic-bezier(.2,.8,.2,1)}

main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;display:none;overflow:auto;-webkit-overflow-scrolling:touch}
.view.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

nav{display:flex;background:rgba(10,20,36,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 6px calc(6px + var(--safe-b))}
nav button{flex:1;background:none;border:0;color:var(--faint);padding:7px 0 5px;font-size:10.5px;font-weight:600;cursor:pointer;border-radius:12px;transition:color .2s,background .2s}
nav button.on{color:var(--accent);background:var(--accentbg)}

/* mapa */
#mapwrap{position:absolute;inset:0;touch-action:none;background:radial-gradient(ellipse at 50% 35%,var(--maphalo) 0%,var(--mapend) 70%)}
#map{width:100%;height:100%;display:block;touch-action:none;user-select:none}
.zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:8px}
.zoom button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(13,27,48,.78);backdrop-filter:blur(8px);color:var(--text);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.zoom button:active{background:var(--glass2)}
.legend{position:absolute;left:12px;bottom:12px;background:rgba(13,27,48,.78);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--mute);display:flex;gap:14px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:0}
.note{position:absolute;left:12px;bottom:58px;font-size:11px;color:var(--faint);max-width:70%}
.mapchips{position:absolute;left:12px;top:12px;display:flex;gap:8px;flex-wrap:wrap;max-width:calc(100% - 72px)}
.mapempty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;padding:20px}
.mapempty .card{pointer-events:auto;background:rgba(13,27,48,.88);backdrop-filter:blur(8px);margin:0}

/* lista */
.toolbar{position:sticky;top:0;z-index:2;background:linear-gradient(180deg,var(--bg) 70%,rgba(8,17,31,0));padding:12px 14px 10px}
.toolbar input[type=search],.toolbar select{width:100%;background:var(--glass);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 13px;font:inherit;font-size:14px;outline:none}
.toolbar input:focus,.toolbar select:focus{border-color:rgba(90,209,255,.5)}
.row2{display:flex;gap:8px;margin-top:8px}
.seg{display:flex;flex:1;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;background:none;border:0;color:var(--mute);padding:8px 2px;font-size:13px;font-weight:600;cursor:pointer;border-radius:9px;transition:all .15s}
.seg button.on{background:var(--glass2);color:var(--text)}
.list{padding:2px 12px 24px}
.item{display:flex;align-items:center;gap:12px;padding:11px 12px;margin-bottom:8px;border-radius:16px;background:var(--glass);border:1px solid var(--line);cursor:pointer;transition:transform .1s,background .15s}
.item:active{transform:scale(.99);background:var(--glass2)}
.item.v{border-color:rgba(56,224,160,.28);background:linear-gradient(90deg,rgba(56,224,160,.08),var(--glass) 60%)}
.item.p{border-color:rgba(255,198,92,.28)}
.flg{width:38px;height:38px;border-radius:12px;background:var(--glass2);display:flex;align-items:center;justify-content:center;font-size:20px;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block;font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t small{display:block;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.kmb{font-size:12px;color:var(--mute);text-align:right;white-space:nowrap;line-height:1.2}
.kmb b{display:block;color:var(--text);font-size:14px;font-weight:700}
.tick{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--faint);flex:none;background:none;cursor:pointer;transition:all .15s}
.tick.on{background:var(--ok);border-color:var(--ok);color:#052b1d;box-shadow:0 0 14px rgba(56,224,160,.45)}
.tick.plan{border-color:var(--warn);color:var(--warn);font-size:14px}
.empty{padding:36px 18px;text-align:center;color:var(--mute)}

/* karty */
.pad{padding:14px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 3px;font-size:16px;font-weight:700}
.card .sub{color:var(--mute);font-size:12.5px;margin-bottom:10px}
.bar{height:8px;background:var(--glass2);border-radius:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:8px}
.bar i.full{background:linear-gradient(90deg,var(--ok),#9af27e)}
.members{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.m{font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--mute);cursor:pointer;background:none;font-weight:500}
.m.on{border-color:rgba(56,224,160,.5);color:var(--ok);background:rgba(56,224,160,.08)}
.big{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.big .card{margin:0;text-align:left;padding:14px 14px 12px;position:relative;overflow:hidden}
.big .n{font-size:30px;font-weight:800;letter-spacing:-1px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1.1}
.big .l{font-size:12px;color:var(--mute);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
tr:last-child td{border-bottom:0}
th{color:var(--faint);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.5px}
td.r,th.r{text-align:right}
.btn{background:var(--glass2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:11px 15px;font-size:14px;font-weight:600;cursor:pointer}
.btn:active{opacity:.8}
.btn.pri{background:var(--grad);color:#071426;border:0}
.btn.ok{background:linear-gradient(135deg,#38e0a0,#7ef0b8);color:#052b1d;border:0}
.btn.warn{background:linear-gradient(135deg,#ffc65c,#ffdc8c);color:#2b1d03;border:0}
.btn.bad{background:none;border-color:rgba(255,111,125,.45);color:var(--bad)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:10px}
textarea{width:100%;background:var(--glass);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:10px 12px;font:inherit;font-size:14px;min-height:76px;outline:none;resize:vertical}
textarea:focus,input[type=date]:focus{border-color:rgba(90,209,255,.5)}

/* ranking */
.tiers .tier{display:flex;gap:8px;margin-bottom:9px}
.tiers .lab{width:46px;flex:none;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#0b1626;text-shadow:0 1px 0 rgba(255,255,255,.3)}
.chip{touch-action:pan-y;user-select:none;-webkit-user-select:none}.chip.drag{opacity:.35}.ghost{position:fixed;z-index:99;pointer-events:none;transform:translate(-50%,-120%);box-shadow:0 8px 24px rgba(0,0,0,.5)}.tiers .box.over{outline:2px solid var(--accent);background:var(--accentbg)}.pool{min-height:60px}
.tiers .box{flex:1;min-height:48px;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:7px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.small{font-size:12px;color:var(--mute)}
.hint{padding:2px 4px 12px;color:var(--mute);font-size:13px}

/* arkusz */
#sheetbg{position:fixed;inset:0;background:rgba(3,8,16,.62);backdrop-filter:blur(2px);display:none;z-index:10}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:linear-gradient(180deg,#14233d,#0e1b31);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:8px 16px calc(18px + var(--safe-b));z-index:11;display:none;box-shadow:0 -20px 60px rgba(0,0,0,.5)}
#sheet.open{animation:up .28s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:42px;height:4px;border-radius:4px;background:var(--glass2);margin:2px auto 12px}
.hero{display:flex;gap:12px;align-items:center}
.hero .flg{width:48px;height:48px;font-size:26px;border-radius:15px}
.hero h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.3px;line-height:1.2}
.hero .meta{color:var(--mute);font-size:13px;margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}
.tile{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:9px 10px}
.tile b{display:block;font-size:17px;font-weight:800;letter-spacing:-.3px}
.tile span{font-size:11px;color:var(--mute)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tags span{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(139,123,255,.14);color:#c0b8ff}
.lnk{display:flex;align-items:center;gap:8px;margin:10px 0;padding:11px 13px;border-radius:13px;background:rgba(90,209,255,.08);border:1px solid rgba(90,209,255,.22);color:var(--accent);text-decoration:none;font-size:14px;font-weight:600}
.sect{margin-top:16px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sh b{font-size:13px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stay{display:flex;gap:8px;align-items:flex-end;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px}
.stay .dt{flex:1;min-width:0}
.stay label,.fld label{display:block;color:var(--faint);font-size:11px;margin-bottom:4px;font-weight:600}
input[type=date]{width:100%;background:var(--glass2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 8px;font:inherit;font-size:14px;color-scheme:dark;outline:none;min-height:40px}
.stay .x{background:none;border:0;color:var(--faint);font-size:12px;padding:10px 6px;cursor:pointer;white-space:nowrap}
.stay .x.arm{color:var(--bad);font-weight:700}
.fld{margin:14px 0}
.stars{display:flex;gap:4px}
.stars button{background:none;border:0;font-size:34px;color:#3d5278;cursor:pointer;padding:0 2px;line-height:1}
.stars button.on{color:var(--warn);text-shadow:0 0 12px rgba(255,198,92,.5)}
.tbtns{display:flex;gap:7px}
.tbtns button{flex:1;border:1px solid var(--line);background:var(--glass);color:var(--text);border-radius:12px;padding:11px 0;font-weight:800;font-size:15px;cursor:pointer}
.tbtns button.on{color:#0b1626;border-color:transparent}
.two{display:flex;gap:10px;margin-top:12px}.two .btn{flex:1;padding:15px}
select.sel{width:100%;background:var(--glass2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 8px;font:inherit;font-size:14px;min-height:40px;color-scheme:dark;outline:none}
.prio{display:flex;gap:7px}.prio button{flex:1;border:1px solid var(--line);background:var(--glass);color:var(--mute);border-radius:12px;padding:11px 0;font-weight:800;font-size:15px;cursor:pointer}.prio button.on{background:linear-gradient(135deg,#ffc65c,#ff9f5c);color:#2b1d03;border-color:transparent}
.hike{display:flex;gap:10px;align-items:flex-start;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:8px}
.hike.done{border-color:rgba(56,224,160,.35);background:linear-gradient(90deg,rgba(56,224,160,.08),var(--glass) 60%)}
.hike .hb{flex:1;min-width:0}.hike .hb>b{display:block;font-size:14.5px;font-weight:600}
.hike .bd{display:flex;gap:6px;margin:4px 0}.hike .bd span{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--glass2);color:var(--mute);font-weight:600}
.hike .bd .d0{background:rgba(56,224,160,.15);color:#6ff0bb}.hike .bd .d1{background:rgba(255,198,92,.15);color:#ffd27f}.hike .bd .d2{background:rgba(255,111,125,.16);color:#ff97a2}
.hike p{margin:2px 0 5px;color:var(--mute);font-size:12.5px}.hike a{font-size:12px;color:var(--accent);text-decoration:none;font-weight:600}
.hike .tick{margin-top:2px}
.szrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:6px 0 8px;padding:8px 10px;border-radius:12px;background:rgba(255,198,92,.07);border:1px solid rgba(255,198,92,.22);font-size:12.5px;color:#ffd99a}
.szb{border:1px solid rgba(255,198,92,.5);background:none;color:#ffd99a;border-radius:999px;padding:5px 11px;font-weight:700;font-size:12px;cursor:pointer}.szb.on{background:rgba(255,198,92,.22)}
.szs button{background:none;border:0;font-size:22px;color:#4b4132;cursor:pointer;padding:0 1px;line-height:1}.szs button.on{color:var(--warn)}
#shareov{position:fixed;inset:0;z-index:200;background:rgba(3,8,16,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px}
#shareov canvas{max-width:100%;max-height:calc(100% - 120px);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M2 20 9 7l4.5 7L16 10l6 10H2z"/></svg></div>
    <h1>Ski Been</h1>
    <div class="rt"><button id="acct" class="acct" style="display:none">👤 Niezalogowany</button>
    <div class="mode" id="mode"><button data-m="w" class="on">❄️ Zima</button><button data-m="s">☀️ Lato</button></div></div>
  </div>
  <div class="hstats" id="hstats"></div>
  <div class="prog"><i id="progBar"></i></div>
  <div class="savel"><span id="saveState"></span></div>
</header>
<main>
  <section class="view on" id="v-mapa">
    <div id="mapwrap">
      <svg id="map" xmlns="http://www.w3.org/2000/svg"></svg>

function monthOpts(sel){ return `<option value="">miesiąc (opcjonalnie)</option>` + MONTHS.map((m,i) => { const v = String(i+1).padStart(2,"0"); return `<option value="${v}" ${v===sel?"selected":""}>${m}</option>`; }).join(""); }
const TIERS = [["S","linear-gradient(135deg,#ff7b8a,#ff9f7b)"],["A","linear-gradient(135deg,#ffb36b,#ffd36b)"],["B","linear-gradient(135deg,#ffe66b,#e9f27b)"],["C","linear-gradient(135deg,#a6e36b,#7be3a0)"],["D","linear-gradient(135deg,#6bd0ff,#7ba6ff)"]];

/* ---------- stan i zapis ---------- */
// wpis: {s:"v"|"p", stays:[{y,m}], pd:"RRRR[-MM]", pr:0..5, r:0..5, t:"S".."D"|"", n:"", done:{idxSzlaku:1}}
let wVisits = {}, sVisits = {}, visits = wVisits;
const LS = "skibeen.v1", LSH = "skibeen.h1", LSM = "skibeen.mode";
let store = {mode:"local", ref:null};
let writing = false, dirty = false, saveTimer = null;

function migrate(o){
  const out = {};
  Object.keys(o || {}).forEach(id => {
    if (!o[id]) return;
    const v = Object.assign({}, o[id]);
    v.s = v.s === "p" ? "p" : "v";
    let st = (Array.isArray(v.stays) ? v.stays : []).map(x => x.y !== undefined ? {y:String(x.y||""), m:String(x.m||"")} : {y:(x.f||x.e||"").slice(0,4), m:(x.f||"").slice(5,7)}).filter(x => x);
    if (v.d !== undefined) { if (v.s === "p") v.pd = v.pd || v.d || ""; else if (v.d && !st.length) st = [{y:v.d.slice(0,4), m:v.d.slice(5,7)}]; delete v.d; }
    v.stays = st; v.pd = String(v.pd || "").slice(0,7);
    v.pr = +v.pr || 0; v.r = v.r || 0; v.t = v.t || ""; v.n = v.n || "";
    v.done = (v.done && typeof v.done === "object") ? Object.assign({}, v.done) : {};
    v.sz = (v.sz && typeof v.sz === "object") ? Object.assign({}, v.sz) : {};
    out[id] = v;
  });
  return out;
}
function syncVisits(){ visits = MODE === "w" ? wVisits : sVisits; }
function loadLocal(){ try { const t = localStorage.getItem(LS); if (t) wVisits = migrate(JSON.parse(t)); const h = localStorage.getItem(LSH); if (h) sVisits = migrate(JSON.parse(h)); } catch(e){} syncVisits(); }
function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(wVisits)); localStorage.setItem(LSH, JSON.stringify(sVisits)); } catch(e){} }
const exportJSON = pretty => JSON.stringify({visits: wVisits, hvisits: sVisits}, null, pretty ? 1 : 0);
function setSaveState(t){ $("saveState").textContent = t; }
function scheduleSave(){
  saveLocal(); dirty = true;
  if (store.mode !== "db" && store.mode !== "sb") { setSaveState("zapis: ta przeglądarka"); return; }
  setSaveState("zapisuję…"); clearTimeout(saveTimer); saveTimer = setTimeout(flush, 700);
}
async function flush(){
  if (writing) { saveTimer = setTimeout(flush, 400); return; }
  if (!dirty || !(store.ref || store.mode === "sb")) return;
  writing = true; dirty = false;
  if (store.mode === "sb") {
    try {
      const r = await store.sb.from("profiles").upsert({user_id: store.uid, data: {visits: wVisits, hvisits: sVisits}, updated_at: new Date().toISOString()}).select("updated_at").single();
      if (r.error) throw r.error; store.rev = r.data.updated_at; setSaveState("zapisano ✓ · konto");
    } catch(e){ dirty = true; setSaveState("błąd zapisu, spróbuję ponownie"); setTimeout(flush, 8000); }
  } else {
    try { await store.ref.set({visits: wVisits, hvisits: sVisits}); setSaveState("zapisano ✓"); } catch(e){ setSaveState("zapis: ta przeglądarka"); }
  }
  writing = false; if (dirty) flush();
}
const SBC = window.__SB__ || null;
const cloneJ = o => JSON.parse(JSON.stringify(o || {}));
async function attachUser(user){
  const sb = store.sb; store.uid = user.id; store.authed = true; store.email = user.email || ""; const um = user.user_metadata || {}; store.name = um.full_name || um.name || (user.email ? user.email.split("@")[0] : ""); setSaveState("synchronizuję…");
  try {
    const r = await sb.from("profiles").select("data,updated_at").eq("user_id", user.id).maybeSingle();
    if (r.error) throw r.error;
    const rd = (r.data && r.data.data) || {}, rv = migrate(cloneJ(rd.visits)), rh = migrate(cloneJ(rd.hvisits));
    wVisits = Object.assign({}, wVisits, rv); sVisits = Object.assign({}, sVisits, rh);   // dane z konta mają pierwszeństwo, lokalne tylko uzupełniają
    syncVisits(); saveLocal(); store.mode = "sb"; store.rev = r.data ? r.data.updated_at : "";
    dirty = true; await flush(); renderAll(); updateAcct(); closeAccount();
  } catch(e){ store.mode = "local"; setSaveState("zalogowano, ale sync nie działa: " + String((e && (e.message || e.code)) || e).slice(0,90)); renderAll(); updateAcct(); }
}
async function pullSb(){
  if (store.mode !== "sb" || dirty || writing || curId) return;
  try {
    const r = await store.sb.from("profiles").select("data,updated_at").eq("user_id", store.uid).maybeSingle();
    if (r.error || !r.data || r.data.updated_at === store.rev) return;
    const rd = r.data.data || {}; wVisits = migrate(cloneJ(rd.visits)); sVisits = migrate(cloneJ(rd.hvisits)); syncVisits(); saveLocal(); store.rev = r.data.updated_at; renderAll(); setSaveState("zapisano ✓ · konto");
  } catch(e){}
}
async function initSb(){
  loadLocal(); renderAll();
  const sb = window.supabase.createClient(SBC.url, SBC.key, {auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}});
  store = {mode:"local", sb, uid:null, email:"", name:"", rev:""};
  setSaveState("zapis: ta przeglądarka");
  updateAcct(); $("acct").onclick = openAccount;
  try { const hp = new URLSearchParams((location.hash||"").replace(/^#/,"") + "&" + (location.search||"").replace(/^\?/,"")); const er = hp.get("error_description") || hp.get("error"); if (er) { setSaveState("logowanie nie wyszło: " + decodeURIComponent(er.replace(/\+/g," ")).slice(0,90)); history.replaceState(null,"",location.pathname); } } catch(e){}
  sb.auth.onAuthStateChange((ev, ses) => {
    if (ses && ses.user && store.uid !== ses.user.id) setTimeout(() => attachUser(ses.user), 0);
    else if (!ses && (store.mode === "sb" || store.authed)) { store.mode = "local"; store.authed = false; store.uid = null; store.name = ""; setSaveState("wylogowano · dane zostają w tej przeglądarce"); renderAll(); updateAcct(); }
  });
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pullSb(); });
}
async function initStore(){
  if (SBC && window.supabase) return initSb();
  loadLocal(); renderAll();
  try {
    const user = await useCap("user"), db = await useCap("db");
    if (!user || !db) { setSaveState("zapis: ta przeglądarka"); return; }
    const uid = await user.id(); if (!uid) { setSaveState("zapis: ta przeglądarka"); return; }
    const ref = db.doc("data/users/" + uid + "/profile");
    const snap = await ref.get(); const dd = snap.exists ? snap.data() : null;
    if (dd && (dd.visits || dd.hvisits)) {
      wVisits = migrate(JSON.parse(JSON.stringify(dd.visits || {}))); sVisits = migrate(JSON.parse(JSON.stringify(dd.hvisits || {}))); syncVisits(); saveLocal();
    } else if (Object.keys(wVisits).length || Object.keys(sVisits).length) { await ref.set({visits: wVisits, hvisits: sVisits}); }
    store = {mode:"db", ref}; setSaveState("zapisano ✓"); renderAll();
  } catch(e){ setSaveState("zapis: ta przeglądarka"); }
}

/* ---------- logika ---------- */
const isVis = id => !!visits[id] && visits[id].s === "v";
const isPlan = id => !!visits[id] && visits[id].s === "p";
const newEntry = st => ({s: st, stays: [], pd: "", pr: 0, r: 0, t: "", n: "", done: {}, sz: {}});
function setStatus(id, st){
  if (!visits[id]) visits[id] = newEntry(st); else visits[id].s = st;
  scheduleSave(); renderAll();
}
function stats(){
  const v = R.filter(r => isVis(r.id));
  const countries = new Set(); v.forEach(r => r.c.split(",").forEach(c => countries.add(c)));
  const km = v.reduce((s, r) => s + r.k, 0);
  let stays = 0, hikes = 0; v.forEach(r => { stays += visits[r.id].stays.length; hikes += Object.keys(visits[r.id].done).length; });
  const gdone = G.filter(g => g.m.length >= 2 && g.m.every(isVis)).length;
  return {n:v.length, countries, km, stays, hikes, gdone};
}
const lastYear = id => { const y = visits[id].stays.map(x => x.y).filter(Boolean).sort(); return y.length ? y[y.length-1] : ""; };

/* ---------- nagłówek ---------- */
function renderHeader(){
  const s = stats(), W = MODE === "w";
  $("progBar").style.width = (100 * s.n / R.length) + "%";
  $("hstats").innerHTML =
    `<div><b>${s.n}</b><small>z ${R.length} ${W ? "ośrodków" : "miejsc"}</small></div>` +
    `<div><b>${s.countries.size}</b><small>${s.countries.size===1?"kraj":"krajów"}</small></div>` +
    `<div><b>${W ? Math.round(s.km) : s.hikes}</b><small>${W ? "km tras" : plur(s.hikes,"szlak","szlaki","szlaków")}</small></div>` +
    `<div><b>${s.stays}</b><small>${plur(s.stays,"pobyt","pobyty","pobytów")}</small></div>`;
}

let fStat = "all", fCountry = "", fSort = "k", fQ = "", fMinKm = 0, fMinEl = 0;

function initListControls(){

  $("fcountry").addEventListener("change", e => { fCountry = e.target.value; renderList(); });

function renderList(){
  let a = R.filter(r =>
    (fStat==="all" || (fStat==="yes" && isVis(r.id)) || (fStat==="plan" && isPlan(r.id)) || (fStat==="no" && !visits[r.id])) &&
    (!fCountry || r.c.split(",").includes(fCountry)) && (!fQ || r.s.includes(fQ)) &&
    (!fMinKm || r.k >= fMinKm) && (!fMinEl || (r.e || 0) >= fMinEl));
  const pr = id => (visits[id] && visits[id].s === "p") ? visits[id].pr : -1;
  if (fSort==="k") a.sort((x,y)=>y.k-x.k);
  else if (fSort==="n") a.sort((x,y)=>x.n.localeCompare(y.n,"pl"));
  else if (fSort==="p") a.sort((x,y)=>pr(y.id)-pr(x.id) || y.k-x.k);
  else a.sort((x,y)=>cname(x.c.split(",")[0]).localeCompare(cname(y.c.split(",")[0]),"pl") || y.k-x.k);
  const W = MODE === "w";
  $("list").innerHTML = a.length ? a.map(r => {
    const v = visits[r.id]; let extra = "";
    if (v && v.s === "v") {
      const n = v.stays.length;
      extra = " · " + (n ? n + " " + plur(n,"pobyt","pobyty","pobytów") + (lastYear(r.id) ? ", ostatnio " + lastYear(r.id) : "") : "byłem") + (v.t ? " · tier " + v.t : "");
      if (!W) { const dn = Object.keys(v.done).length; if (dn) extra += " · " + dn + "/" + r.hikes.length + " szlaków"; }
    } else if (v && v.s === "p") extra = " · planuję" + (v.pr ? " · priorytet " + v.pr : "") + (v.pd ? " · " + esc(fmtPd(v.pd)) : "");
    return `<div class="item ${v ? (v.s==="v"?"v":"p") : ""}" data-id="${esc(r.id)}">
      <div class="flg">${flag(r.c.split(",")[0])}</div>
      <div class="t"><b>${esc(r.n)}</b><small>${esc(r.c.split(",").map(cname).join(", "))}${r.g.length ? " · " + esc(r.g[r.g.length-1]) : ""}${W && r.e ? " · do " + r.e + " m" : ""}${extra}</small></div>
      <div class="kmb"><b>${W ? Math.round(r.k) : r.hikes.length}</b>${W ? "km" : plur(r.hikes.length,"szlak","szlaki","szlaków")}</div>
      <button class="tick ${isVis(r.id)?"on":isPlan(r.id)?"plan":""}" aria-label="Byłem">${isPlan(r.id)?"📅":"✓"}</button>
    </div>`; }).join("") : `<div class="empty">Nic nie pasuje do filtrów.</div>`;
  const fc = $("fcount"); if (fc) fc.textContent = a.length + " " + (MODE === "w" ? plur(a.length, "ośrodek", "ośrodki", "ośrodków") : plur(a.length, "miejsce", "miejsca", "miejsc"));
}

function renderTiers(){
  const vis = R.filter(r => isVis(r.id)).sort((x,y)=>(visits[y.id].r||0)-(visits[x.id].r||0) || y.k-x.k);
  const chip = r => `<button class="m on chip" data-id="${esc(r.id)}">${esc(r.n)}</button>`;
  const rows = TIERS.map(([t,c]) => {
    const a = vis.filter(r => visits[r.id].t === t);
    return `<div class="tier"><div class="lab" style="background:${c}">${t}</div><div class="box" data-t="${t}">${a.map(chip).join("")}</div></div>`;
  }).join("");
  const none = vis.filter(r => !visits[r.id].t);
  const plans = R.filter(r => isPlan(r.id));
  const wish = plans.length ? `<div class="card" style="margin-top:14px"><h3>📅 Lista życzeń</h3><div class="sub">Plany według priorytetu (5 = bardzo mnie ciekawi).</div>` +
    [5,4,3,2,1,0].map(p => { const a = plans.filter(r => visits[r.id].pr === p).sort((x,y)=>y.k-x.k); return a.length ? `<div class="small" style="margin:8px 0 4px">${p ? "Priorytet " + p : "Bez priorytetu"}</div><div class="members" style="margin-top:0">${a.map(r => `<button class="m" data-id="${esc(r.id)}" style="border-color:rgba(255,198,92,.5);color:var(--warn)">${esc(r.n)}${visits[r.id].pd ? " · " + esc(fmtPd(visits[r.id].pd)) : ""}</button>`).join("")}</div>` : ""; }).join("") + `</div>` : "";
  $("tiers").innerHTML = (vis.length ? `<div class="hint">Przytrzymaj miejsce i przeciągnij do wybranego tieru (S–D). Z powrotem na dół, żeby zdjąć tier. Dotknięcie otwiera szczegóły.</div>` : `<div class="empty">Oznacz kilka miejsc jako "Byłem", a potem ułożysz je tutaj w tier listę.</div>`) + rows +
    (vis.length ? `<div class="card" style="margin-top:14px"><h3>Do ułożenia</h3><div class="sub">Miejsca, w których byłeś i które nie mają jeszcze tieru.</div><div class="members pool box" data-t="">${none.map(chip).join("") || `<span class="small">Wszystko ułożone ✓</span>`}</div></div>` : "") + wish;
}
(function(){
  let drag = null;
  const host = $("tiers");
  const boxAt = (x, y) => { const el = document.elementFromPoint(x, y); return el && el.closest ? el.closest(".box[data-t]") : null; };
  const noScroll = e => { if (drag && drag.on) e.preventDefault(); };
  document.addEventListener("touchmove", noScroll, {passive:false});
  host.addEventListener("pointerdown", e => {
    const c = e.target.closest(".chip"); if (!c) return;
    drag = {c, id:c.dataset.id, x:e.clientX, y:e.clientY, on:false, g:null, pid:e.pointerId, over:null};
    const mouse = e.pointerType === "mouse";
    drag.timer = setTimeout(() => start(), mouse ? 0 : 230);
  });
  function start(){
    if (!drag) return; drag.on = true; drag.c.classList.add("drag");
    const g = drag.c.cloneNode(true); g.classList.add("ghost"); g.classList.remove("drag"); document.body.append(g); drag.g = g;
    g.style.left = drag.x + "px"; g.style.top = drag.y + "px";
    try { host.setPointerCapture(drag.pid); } catch(_){}
  }
  host.addEventListener("pointermove", e => {
    if (!drag) return;
    if (!drag.on) { if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 10) { clearTimeout(drag.timer); if (e.pointerType === "mouse") start(); else drag = null; } if (!drag || !drag.on) return; }
    drag.g.style.left = e.clientX + "px"; drag.g.style.top = e.clientY + "px";
    const b = boxAt(e.clientX, e.clientY); if (drag.over && drag.over !== b) drag.over.classList.remove("over"); if (b) b.classList.add("over"); drag.over = b;
  });
  function end(e, cancel){
    if (!drag) return; const d = drag; drag = null; clearTimeout(d.timer);
    if (!d.on) return;
    d.c.classList.remove("drag"); d.g.remove(); if (d.over) d.over.classList.remove("over");
    d.moved = true; host._swallow = true; setTimeout(() => host._swallow = false, 0);
    const b = cancel ? null : boxAt(e.clientX, e.clientY);
    if (b && visits[d.id]) { visits[d.id].t = b.dataset.t; scheduleSave(); renderAll(); }
  }
  host.addEventListener("pointerup", e => end(e, false));
  host.addEventListener("pointercancel", e => end(e, true));
  host.addEventListener("click", e => { if (host._swallow) { e.stopPropagation(); return; } const b = e.target.closest(".m"); if (b) openSheet(b.dataset.id); }, true);
})();

async function saveBlob(name, blob, msg){
  try { const dl = await useCap("downloads"); if (dl) { await dl.save({filename:name, data:blob}); if (msg) msg.textContent = "Zapisano ✓"; return true; } } catch(e){}
  try { const u = URL.createObjectURL(blob), a = document.createElement("a"); a.href = u; a.download = name; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(u), 4000); if (msg) msg.textContent = "Pobrano ✓"; return true; } catch(e){}
  if (msg) msg.textContent = "Nie udało się pobrać pliku."; return false;
}
const xmlEsc = t => String(t).replace(/[<>&"']/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;","'":"&apos;"}[c]));
function markedList(){ return R.filter(r => visits[r.id]).map(r => ({r, v:visits[r.id]})); }
function noteFor(r, v){
  const parts = [v.s === "v" ? "Byłem" : "Planuję" + (v.pr ? " (priorytet " + v.pr + ")" : "")];
  if (v.s === "v") { if (v.t) parts.push("tier " + v.t); if (v.r) parts.push(v.r + "/5"); if (v.stays.length) parts.push("pobyty: " + v.stays.map(x => fmtYM(x.y, x.m)).join(", ")); }
  if (v.n) parts.push(v.n);
  return parts.join(" · ");
}
function exportGPX(){

  return `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Ski Been" xmlns="http://www.topografix.com/GPX/1/1">\n${w}\n</gpx>`;
}
function exportKML(){

  const st = (id, col) => `<Style id="${id}"><IconStyle><color>${col}</color><scale>1.1</scale></IconStyle></Style>`;
  return `<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Ski Been</name>${st("v","ff8ae038")}${st("p","ff5cc6ff")}\n${pm}\n</Document></kml>`;

  const cur = (document.querySelector(".view.on") || {}).id || "v-mapa";
  if (cur === "v-grupy") show("mapa"); else fit();
}
$("mode").addEventListener("click", e => { const b = e.target.closest("button"); if (b) setMode(b.dataset.m); });
function renderAll(){ renderHeader(); renderList(); renderGroups(); renderTiers(); renderStats(); mapRefresh(); }

initListControls(); mapInit(); show(location.hash.slice(1) || "mapa");
try { if (localStorage.getItem(LSM) === "s") setMode("s"); } catch(e){}
initStore();
</script>
