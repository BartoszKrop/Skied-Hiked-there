#sheetbg{position:fixed;inset:0;background:rgba(3,8,16,.62);backdrop-filter:blur(2px);display:none;z-index:10}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:90%;overflow:auto;background:linear-gradient(180deg,#14233d,#0e1b31);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:8px 16px calc(18px + var(--safe-b));z-index:11;display:none;box-shadow:0 -20px 60px rgba(0,0,0,.5)}

.grab{width:42px;height:4px;border-radius:4px;background:var(--glass2);margin:2px auto 12px}

.tday.t0{border-style:dashed;background:none}.tday.t0 .sh{background:rgba(128,128,128,.12);border-bottom:1.5px dashed rgba(128,128,128,.35)}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.sh b{font-size:13px;color:var(--mute);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.stay{display:flex;gap:6px;align-items:center;background:var(--glass);border:1px solid var(--line);border-radius:12px;padding:4px 6px;margin-bottom:5px}.stay select.sel{padding:4px 8px;font-size:13px;min-height:32px}
.stay .dt{flex:1;min-width:0}
.stay label,.fld label{display:block;color:var(--faint);font-size:11px;margin-bottom:4px;font-weight:600}
input[type=date]{width:100%;background:var(--glass2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 8px;font:inherit;font-size:14px;color-scheme:dark;outline:none;min-height:40px}
.stay .x{background:none;border:0;color:var(--faint);font-size:13px;padding:6px;cursor:pointer;white-space:nowrap}
.stay .x.arm{color:var(--bad);font-weight:700}
.fld{margin:14px 0}
.stars{display:flex;gap:4px}
.stars button{background:none;border:0;font-size:34px;color:#3d5278;cursor:pointer;padding:0 2px;line-height:1}
.stars button.on{color:var(--warn);text-shadow:0 0 12px rgba(255,198,92,.5)}
.tbtns{display:flex;gap:7px}
.tbtns button{flex:1;border:1px solid var(--line);background:var(--glass);color:var(--text);border-radius:12px;padding:11px 0;font-weight:800;font-size:15px;cursor:pointer}
.tbtns button.on{color:#0b1626;border-color:transparent}
.two{display:flex;gap:10px;margin-top:12px}.two .btn{flex:1;padding:15px}
select.sel{width:100%;background:var(--glass2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 8px;font:inherit;font-size:14px;min-height:40px;color-scheme:dark;outline:none}
.prio{display:flex;gap:7px}.prio button{flex:1;border:1px solid var(--line);background:var(--glass);color:var(--mute);border-radius:12px;padding:11px 0;font-weight:800;font-size:15px;cursor:pointer}.prio button.on{background:linear-gradient(135deg,#ffc65c,#ff9f5c);color:#2b1d03;border-color:transparent}
.hike{display:flex;gap:10px;align-items:flex-start;background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:8px}
.hike.done{border-color:rgba(56,224,160,.35);background:linear-gradient(90deg,rgba(56,224,160,.08),var(--glass) 60%)}
.hike .hb{flex:1;min-width:0}.hike .hb>b{display:block;font-size:14.5px;font-weight:600}
.hike .bd{display:flex;gap:6px;margin:4px 0}.hike .bd span{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--glass2);color:var(--mute);font-weight:600}
.hike .bd .d0{background:rgba(56,224,160,.15);color:#6ff0bb}.hike .bd .d1{background:rgba(255,198,92,.15);color:#ffd27f}.hike .bd .d2{background:rgba(255,111,125,.16);color:#ff97a2}
.hike p{margin:2px 0 5px;color:var(--mute);font-size:12.5px}.hike a{font-size:12px;color:var(--accent);text-decoration:none;font-weight:600}
.hike .tick{margin-top:2px}.tk2{display:flex;flex-direction:column;gap:6px}.tick.pon{background:var(--warn);border-color:var(--warn);color:#2b1d05}.hike.planned{border-color:rgba(255,198,92,.45);background:linear-gradient(90deg,rgba(255,198,92,.08),var(--glass) 60%)}
.szrow{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:6px 0 8px;padding:8px 10px;border-radius:12px;background:rgba(255,198,92,.07);border:1px solid rgba(255,198,92,.22);font-size:12.5px;color:#ffd99a}
.szb{border:1px solid rgba(255,198,92,.5);background:none;color:#ffd99a;border-radius:999px;padding:5px 11px;font-weight:700;font-size:12px;cursor:pointer}.szb.on{background:rgba(255,198,92,.22)}
.szs button{background:none;border:0;font-size:22px;color:#4b4132;cursor:pointer;padding:0 1px;line-height:1}.szs button.on{color:var(--warn)}
#shareov{position:fixed;inset:0;z-index:200;background:rgba(3,8,16,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:14px}
#shareov canvas{max-width:100%;max-height:calc(100% - 120px);border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.6)}
body.ro .item .tick{pointer-events:none;opacity:.55}
body.ro #sheet button:not(#sclose),body.ro #sheet select,body.ro #sheet textarea,body.ro #sheet input{pointer-events:none}
body.ro #sheet .btn.sm,body.ro #sheet .x{display:none}
#robar{display:none;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 14px;font-size:13px;background:rgba(90,209,255,.1);border-bottom:1px solid var(--line)}
#robar .sp{flex:1}
.hnote{margin:6px 0 4px;min-height:48px;font-size:13px}.hnro{margin:6px 0 4px;font-size:13px;color:var(--text);opacity:.9;white-space:pre-wrap}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin:8px 0;color:var(--text)}.chk input{width:18px;height:18px}
.frow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px}.frow:last-child{border-bottom:0}
@media(max-width:560px){.brand{flex-wrap:wrap;row-gap:8px;gap:6px}.rt{display:contents}#frbtn{margin-left:auto}.rt .acct{padding:5px 8px!important}#acct{max-width:58px}}
@media(max-width:380px){.brand h1{font-size:15px}.swt{gap:6px;padding:3px 8px 3px 3px}.logo{width:24px;height:24px}.rt .acct{padding:5px 6px!important}.brand{gap:4px}}
</style>

function migrate(o){
  const out = {};
  Object.keys(o || {}).forEach(id => {
    if (!o[id]) return;
    const v = Object.assign({}, o[id]);
    v.s = v.s === "p" ? "p" : "v";
    let st = (Array.isArray(v.stays) ? v.stays : []).map(x => x.y !== undefined ? {y:String(x.y||""), m:String(x.m||"")} : {y:(x.f||x.e||"").slice(0,4), m:(x.f||"").slice(5,7)}).filter(x => x);
    if (v.d !== undefined) { if (v.s === "p") v.pd = v.pd || v.d || ""; else if (v.d && !st.length) st = [{y:v.d.slice(0,4), m:v.d.slice(5,7)}]; delete v.d; }
    v.stays = st; v.pd = String(v.pd || "").slice(0,7);
    v.pr = +v.pr || 0; v.r = v.r || 0; v.t = v.t || ""; v.n = v.n || "";
    v.done = (v.done && typeof v.done === "object") ? Object.assign({}, v.done) : {};
    v.hp = (v.hp && typeof v.hp === "object") ? Object.assign({}, v.hp) : {};
    v.sz = (v.sz && typeof v.sz === "object") ? Object.assign({}, v.sz) : {};
    out[id] = v;
  });
  return out;
}

/* ---------- logika ---------- */
const isVis = id => !!visits[id] && visits[id].s === "v";
const isPlan = id => !!visits[id] && visits[id].s === "p";
const newEntry = st => ({s: st, stays: [], pd: "", pr: 0, r: 0, t: "", n: "", done: {}, sz: {}, hr: {}, hn: {}});
function setStatus(id, st){
  if (!visits[id]) visits[id] = newEntry(st); else visits[id].s = st;
  scheduleSave(); renderAll();
}
function stats(){
  const v = R.filter(r => isVis(r.id));
  const countries = new Set(); v.forEach(r => r.c.split(",").forEach(c => countries.add(c)));
  const km = v.reduce((s, r) => s + r.k, 0);
  let stays = 0, hikes = 0; v.forEach(r => { stays += visits[r.id].stays.length; hikes += Object.keys(visits[r.id].done).length; });
  const gdone = G.filter(g => g.m.length >= 2 && g.m.every(isVis)).length;
  return {n:v.length, countries, km, stays, hikes, gdone};
}
const lastYear = id => { const y = visits[id].stays.map(x => x.y).filter(Boolean).sort(); return y.length ? y[y.length-1] : ""; };
